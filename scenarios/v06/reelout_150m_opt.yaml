# Run summary for output/reelout_150m_opt.arrow, written by examples/simple_reelout.jl at the end of the run.
success_criteria: "all 9 passed"    # pass/fail verdict vs V3Kite's success criteria
simulation:
  script: "simple_opt_reelout.jl"   # script that produced this run
  project: "system_reelout_150m.yaml" # system project flown
  rel_turbulence: "default"         # turbulence level in [0, 1] passed to init
  wind_speed: 6.0                   # mean wind speed in m/s passed to init
  time: "21:00:24"                  # wall-clock time the run finished
  date: "2026-08-26"                # wall-clock date the run finished
  hostname: "ufryzen"               # machine the run executed on
  git_hash: "de8bf78"               # SimpleKiteControllers.jl commit hash
  git_status: "clean"               # SimpleKiteControllers.jl working tree: clean or dirty
