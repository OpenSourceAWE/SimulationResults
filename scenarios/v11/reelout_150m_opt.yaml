    mean: 1.37                      # mean cross-track error [deg]
    max: 5.62                       # max cross-track error [deg]
  elevation_deg:
    min_settled: 10.5               # min elevation, settled window [deg]
    min_whole_run: 10.5             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 84          # peak heading rate [deg/s]
  extent:
    azimuth_deg:
      min: -28.6                    # flown azimuth reach, negative side [deg]
      max: 27.1                     # flown azimuth reach, positive side [deg]
    azimuth_pct_of_amplitude:
      min: 98                       # negative reach as % of the pattern's ±A
      max: 101                      # positive reach as % of the pattern's ±A
    worst_lobe_deg:
      min: -19.7                    # weakest lobe, negative side [deg]
      max: 20.0                     # weakest lobe, positive side [deg]
    elevation_span_deg: 27.7        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 15.0    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 99     # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 6181                      # mean tether force, settled window [N]
    std: 663                        # std tether force, settled window [N]
    cv_pct: 10.7                    # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.192             # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 0 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0029         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.37     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.18    # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.192   # peak steering commanded
    rate_limited_pct_time: 0        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.153  # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
  v_app_phase4:
    duration_s: 73.7                # phase-4 window length [s]
    mean_m_s: 32.48                 # mean apparent wind speed [m/s]
    min_m_s: 25.46                  # min apparent wind speed [m/s]
    max_m_s: 39.12                  # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: 20.3             # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 4.59               # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.29               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.26               # crest factor: peak / mean reel-out power over the reeling window
    duration_s: 74.5                # reeling window length [s]
    n_samples: 6703                 # sample count in the reeling window
    energy_kJ: 1419.8               # energy over the reeling window [kJ]
    energy_run_kJ: 1415.9           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 6703                 # sample count in the reeling window
  ringing:
    n_peaks: 6                      # ring peaks detected above peak_floor
    period_s: 2.94                  # mean peak-to-peak ring period [s]
    zeta: 0.103                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.55             # first ring peak's amplitude above the local trend [m/s]
    duration_s: 20.0                # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 3.66        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 3.19      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 22493              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 18899      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 18899              # 26% of the reeling window
      t_040.9_s: 23047              # 23% of the reeling window
      t_058.3_s: 24027              # 24% of the reeling window
      t_075.8_s: 24163              # 27% of the reeling window
      t_095.9_s: 22212              # 0% of the reeling window
    measured_W: 19063               # mean reel-out power the run harvested [W]
    ratio: 0.85                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.662              # optimizer's l_dp [m]; rel_depower equivalent 0.311 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_040.9_s: 1.682              # optimizer's l_dp [m]; rel_depower equivalent 0.315 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_058.3_s: 1.677              # optimizer's l_dp [m]; rel_depower equivalent 0.314 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_075.8_s: 1.668              # optimizer's l_dp [m]; rel_depower equivalent 0.313 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_095.9_s: 1.699              # optimizer's l_dp [m]; rel_depower equivalent 0.319 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.9              # centre azimuth of the path [deg]
    az_amplitude_deg: 39.0          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 30.7             # centre elevation of the path [deg]
    el_height_deg: 16.9             # elevation span of the path, peak to peak [deg]
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 14.16    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.363        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    margin_start: 0.97              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.47                # curvature margin at reelout_l_max [-]
    c1_final: 0.1919                # turn-rate gain at depower_final [1/m]
    margin_final: 1.66              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.61        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked_s: 18.6                 # wall time the simulation was frozen waiting for replies [s]
    installed: 4                    # new paths actually flown
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_040.9_s: "installed — margin 1.57 (phase 5: 2.01 at 380 m), clearance 49.2 m, 23047 W predicted" # at L = 205 m
      t_058.3_s: "installed — margin 1.38 (phase 5: 1.39 at 380 m), clearance 55.8 m, 24027 W predicted" # at L = 261 m
      t_075.8_s: "installed — margin 1.63 (phase 5: 1.34 at 380 m), clearance 69.5 m, 24163 W predicted" # at L = 319 m
      t_095.9_s: "installed — margin 0.88 (droop spread at 50 %, lobe lift at 0 %) (phase 5: 0.61 at 380 m), clearance 80.6 m, 22212 W predicted" # at L = 380 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 0.71                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [-0.24, 0.26, 1.1, 1.48, 0.94] # the learnt correction per band, crossing first [deg]
    lift_deg: 1.5                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead_s: 8.0                # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t_s: 86.4                  # when the lift actually latched [s]
    lift_remaining_m: 26.1          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_044.9_s: "blended in"       # +0.56° of shift (mean over the bands), curvature margin 1.49 vs 0.82 required
      t_062.3_s: "blended in"       # +0.06° of shift (mean over the bands), curvature margin 1.39 vs 0.82 required
      t_079.8_s: "blended in"       # +0.09° of shift (mean over the bands), curvature margin 1.43 vs 0.82 required
      t_086.4_s: "blended in"       # +1.50° of shift (mean over the bands), curvature margin 1.51 vs 0.82 required
      t_095.9_s: "carried by an install (50 % of the spread)" # +0.00° of shift (mean over the bands), curvature margin 0.88 vs 0.82 required
    laps:
      lap_1: -1.2                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.20°, correction became [-0.08 +0.34 +0.84 +0.99 +0.71]° (crossing … lobe)
      lap_2: -0.17                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.76°, correction became [-0.34 +0.19 +0.92 +1.33 +0.99]° (crossing … lobe)
      lap_3: -0.11                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.76°, correction became [-0.24 +0.26 +1.10 +1.48 +0.94]° (crossing … lobe)
    lap_profiles:
      lap_1: "+0.39 -0.74 -1.82 -2.21 -1.22" # error vs the optimizer's curve per band, crossing first; 262/285/315/335/488 samples, correction now [-0.08 +0.34 +0.84 +0.99 +0.71]° (crossing … lobe)
      lap_2: "+0.81 +0.26 -0.29 -1.05 -0.31" # error vs the optimizer's curve per band, crossing first; 256/271/278/301/458 samples, correction now [-0.34 +0.19 +0.92 +1.33 +0.99]° (crossing … lobe)
      lap_3: "+0.03 -0.14 -0.55 -0.75 +0.51" # error vs the optimizer's curve per band, crossing first; 281/304/277/278/437 samples, correction now [-0.24 +0.26 +1.10 +1.48 +0.94]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: -0.94             # kite below the path's elevation centre [deg], over 1348 samples; the path itself sits -0.11 half-spans down there and the kite 0.09° under it
    az_20_40_pct: -0.13             # kite below the path's elevation centre [deg], over 1417 samples; the path itself sits -0.10 half-spans down there and the kite -0.59° under it
    az_40_60_pct: 2.26              # kite below the path's elevation centre [deg], over 1408 samples; the path itself sits 0.09 half-spans down there and the kite -1.59° under it
    az_60_80_pct: 3.28              # kite below the path's elevation centre [deg], over 1381 samples; the path itself sits 0.17 half-spans down there and the kite -2.01° under it
    az_80_100_pct: 2.07             # kite below the path's elevation centre [deg], over 2171 samples; the path itself sits 0.18 half-spans down there and the kite -0.76° under it
    centre_to_lobe_deg: 4.22        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 2.21             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [1.73, 1.98, 2.41, 2.6, 2.32] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 28.79     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 15.47  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 10.5            # lowest elevation over the whole run — set in phase 4, so a phase-5 lift does not move it [deg]
    el_min_final_deg: 11.59         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 8.98     # reach margin: flew 29.14° against the 20.15° required by min_span_frac = 0.70, +45 %
    azimuth_reach_neg_deg: 8.18     # reach margin: flew 28.34° against the 20.15° required by min_span_frac = 0.70, +41 %
    elevation_span_deg: 4.44        # reach margin: flew 15.27° against the 10.83° required by min_span_frac = 0.70, +41 %
    tightest: "elevation span"      # the size criterion with the least room, +4.44° (+41 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 56.8                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 46.3               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 9.5    # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 11.0            # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0408               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 8000.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 1e-03/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
