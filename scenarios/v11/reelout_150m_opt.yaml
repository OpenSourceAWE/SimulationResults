  project: "system_reelout_150m.yaml" # system project flown
  rel_turbulence: "default"         # turbulence level in [0, 1] passed to init
  wind_speed: 11.0                  # mean wind speed in m/s passed to init
  time: "11:05:31"                  # wall-clock time the run finished
  date: "2026-08-26"                # wall-clock date the run finished
  hostname: "ufryzen"               # machine the run executed on
  git_hash: "630186e"               # SimpleKiteControllers.jl commit hash
  git_status: "dirty"               # SimpleKiteControllers.jl working tree: clean or dirty
fig8_metrics:
