    mean: 1.06                      # mean cross-track error [deg]
    max: 4.95                       # max cross-track error [deg]
  elevation_deg:
    min_settled: 10.6               # min elevation, settled window [deg]
    min_whole_run: 10.6             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 125         # peak heading rate [deg/s]
  extent:
    azimuth_deg:
      min: -19.0                    # flown azimuth reach, negative side [deg]
      max: 15.4                     # flown azimuth reach, positive side [deg]
    azimuth_pct_of_amplitude:
      min: 105                      # negative reach as % of the pattern's ±A
      max: 98                       # positive reach as % of the pattern's ±A
    worst_lobe_deg:
      min: -13.4                    # weakest lobe, negative side [deg]
      max: 11.8                     # weakest lobe, positive side [deg]
    elevation_span_deg: 19.0        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 9.3     # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 85     # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 7327                      # mean tether force, settled window [N]
    std: 744                        # std tether force, settled window [N]
    cv_pct: 10.2                    # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.32              # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 1 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0058         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 1.02     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.227   # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.32    # peak steering commanded
    rate_limited_pct_time: 5        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
  v_app_phase4:
    duration_s: 35.8                # phase-4 window length [s]
    mean_m_s: 31.41                 # mean apparent wind speed [m/s]
    min_m_s: 25.72                  # min apparent wind speed [m/s]
    max_m_s: 43.8                   # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: 16.3             # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 3.15               # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.37               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.23               # crest factor: peak / mean reel-out power over the reeling window
    duration_s: 38.0                # reeling window length [s]
    n_samples: 3417                 # sample count in the reeling window
    energy_kJ: 1673.5               # energy over the reeling window [kJ]
    energy_run_kJ: 1672.2           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 3417                 # sample count in the reeling window
  ringing:
    n_peaks: 7                      # ring peaks detected above peak_floor
    period_s: 2.71                  # mean peak-to-peak ring period [s]
    zeta: 0.083                     # damping ratio from the peak log decrement
    overshoot_m_s: 1.24             # first ring peak's amplitude above the local trend [m/s]
    duration_s: 20.0                # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 7.58        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 6.0       # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 47092              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 42972      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 42972              # 38% of the reeling window
      t_039.7_s: 48686              # 28% of the reeling window
      t_050.5_s: 50404              # 34% of the reeling window
    measured_W: 44078               # mean reel-out power the run harvested [W]
    ratio: 0.94                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.421              # optimizer's l_dp [m]; rel_depower equivalent 0.269 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_039.7_s: 1.413              # optimizer's l_dp [m]; rel_depower equivalent 0.268 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_050.5_s: 1.411              # optimizer's l_dp [m]; rel_depower equivalent 0.267 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.8              # centre azimuth of the path [deg]
    az_amplitude_deg: 19.8          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 23.0             # centre elevation of the path [deg]
    el_height_deg: 14.5             # elevation span of the path, peak to peak [deg]
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.2       # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 14.25    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.538        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    margin_start: 0.83              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.11                # curvature margin at reelout_l_max [-]
    c1_final: 0.1919                # turn-rate gain at depower_final [1/m]
    margin_final: 1.44              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.91        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 3                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked_s: 35.6                 # wall time the simulation was frozen waiting for replies [s]
    installed: 2                    # new paths actually flown
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_039.7_s: "installed — margin 1.15 (phase 5: 1.28 at 380 m), clearance 49.8 m, 48686 W predicted" # at L = 236 m
      t_050.5_s: "installed — margin 1.07 (phase 5: 0.91 at 380 m), clearance 66.3 m, 50404 W predicted" # at L = 308 m
      t_061.8_s: "skipped — cached failure from 2026-08-26 10:58:35 (solver failed at L = 378.7 m, guess el 30°)" # at L = 379 m
      t_061.8_s_2: "failed"         # at L = 379 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 0.43                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [0.05, 0.2, 0.51, 0.77, 0.61] # the learnt correction per band, crossing first [deg]
    lift_deg: 1.5                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead_s: 8.0                # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t_s: 53.5                  # when the lift actually latched [s]
    lift_remaining_m: 52.8          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_043.7_s: "blended in"       # +0.38° of shift (mean over the bands), curvature margin 1.18 vs 0.82 required
      t_054.5_s: "blended in"       # +1.55° of shift (mean over the bands), curvature margin 1.16 vs 0.82 required
    laps:
      lap_1: -0.74                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.74°, correction became [+0.14 +0.26 +0.43 +0.60 +0.45]° (crossing … lobe)
      lap_2: -0.1                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.48°, correction became [+0.05 +0.20 +0.51 +0.77 +0.61]° (crossing … lobe)
    lap_profiles:
      lap_1: "-0.23 -0.55 -0.85 -1.37 -0.78" # error vs the optimizer's curve per band, crossing first; 180/252/212/173/292 samples, correction now [+0.14 +0.26 +0.43 +0.60 +0.45]° (crossing … lobe)
      lap_2: "+0.24 +0.13 -0.19 -0.52 -0.18" # error vs the optimizer's curve per band, crossing first; 188/191/186/166/242 samples, correction now [+0.05 +0.20 +0.51 +0.77 +0.61]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 3.08              # kite below the path's elevation centre [deg], over 580 samples; the path itself sits 0.54 half-spans down there and the kite -0.12° under it
    az_20_40_pct: 2.39              # kite below the path's elevation centre [deg], over 677 samples; the path itself sits 0.36 half-spans down there and the kite -0.46° under it
    az_40_60_pct: 1.7               # kite below the path's elevation centre [deg], over 662 samples; the path itself sits 0.14 half-spans down there and the kite -1.14° under it
    az_60_80_pct: 2.26              # kite below the path's elevation centre [deg], over 516 samples; the path itself sits 0.14 half-spans down there and the kite -1.63° under it
    az_80_100_pct: 1.29             # kite below the path's elevation centre [deg], over 831 samples; the path itself sits 0.14 half-spans down there and the kite -0.79° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.93             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [1.55, 1.7, 2.01, 2.27, 2.11] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 17.6      # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 12.17  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 10.6            # lowest elevation over the whole run — set in phase 4, so a phase-5 lift does not move it [deg]
    el_min_final_deg: 10.68         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 4.97     # reach margin: flew 17.30° against the 12.32° required by min_span_frac = 0.70, +40 %
    azimuth_reach_neg_deg: 6.12     # reach margin: flew 18.44° against the 12.32° required by min_span_frac = 0.70, +50 %
    elevation_span_deg: 1.76        # reach margin: flew 10.28° against the 8.52° required by min_span_frac = 0.70, +21 %
    tightest: "elevation span"      # the size criterion with the least room, +1.76° (+21 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 40.8                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 44.8               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 9.5    # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 11.0            # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0738                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0738               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 8000.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 1e-03/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
