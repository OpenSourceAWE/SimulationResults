      lap_2: -0.32                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.67°, correction became [+0.08 +0.31 +0.68 +0.97 +0.66]° (crossing … lobe)
      lap_3: 0.19                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.35°, correction became [-0.03 +0.14 +0.54 +0.84 +0.69]° (crossing … lobe)
      lap_4: -0.3                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.72°, correction became [+0.03 +0.27 +0.83 +1.16 +0.80]° (crossing … lobe)
      lap_6: -0.89                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.46°, correction became [+0.94 +1.22 +1.93 +2.43 +1.48]° (crossing … lobe)
    lap_profiles:
      lap_1: "-0.32 -0.60 -0.87 -1.15 -0.68" # error vs the optimizer's curve per band, crossing first; 226/257/221/190/352 samples, correction now [+0.18 +0.29 +0.43 +0.52 +0.39]° (crossing … lobe)
      lap_2: "+0.32 -0.05 -0.55 -1.18 -0.31" # error vs the optimizer's curve per band, crossing first; 271/331/279/227/383 samples, correction now [+0.08 +0.31 +0.68 +0.97 +0.66]° (crossing … lobe)
      lap_3: "+0.28 +0.36 +0.24 +0.05 +0.08" # error vs the optimizer's curve per band, crossing first; 196/200/194/172/290 samples, correction now [-0.03 +0.14 +0.54 +0.84 +0.69]° (crossing … lobe)
      lap_4: "-0.03 -0.20 -0.65 -0.98 +0.08" # error vs the optimizer's curve per band, crossing first; 199/221/203/142/247 samples, correction now [+0.03 +0.27 +0.83 +1.16 +0.80]° (crossing … lobe)
      lap_6: "-0.89 -0.94 -1.15 -1.62 -0.31" # error vs the optimizer's curve per band, crossing first; 216/239/210/117/266 samples, correction now [+0.94 +1.22 +1.93 +2.43 +1.48]° (crossing … lobe)
