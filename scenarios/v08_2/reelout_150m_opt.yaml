    predicted_initial_W: 18606      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 18606              # 45% of the reeling window
      t_057.9_s: 22420              # 16% of the reeling window
      t_069.6_s: 22860              # 16% of the reeling window
      t_080.8_s: 23127              # 18% of the reeling window
      t_093.6_s: 23315              # 6% of the reeling window
