performance:
  sim_time_s: 112.5                 # simulated time [s]
  wall_time_s: 281.5                # wall-clock time [s]
  total_wall_time_s: 1024.4         # the whole script: package loading, init, settling, the startup solve and the run, up to this summary — the archive copy and any plots follow it [s]
  optimization_time_s: 233.4        # wall time waiting for the optimizer: the startup solve (25.2 s) plus every blocking re-optimization (traj_opt.reopt.blocked_s) [s]
  realtime_factor: 1.53             # sim_time / wall_time, excluding time frozen for re-optimization
  ms_per_step: 7.2                  # wall time per step, excluding time frozen for re-optimization [ms]
  steps: 10125                      # step count
  dt_s: 0.011111111111111112        # simulation timestep [s]
  vsm_interval: 10                  # VSM aerodynamic update interval [steps]
