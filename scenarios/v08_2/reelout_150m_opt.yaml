  date: "2026-08-22"                # wall-clock date the run finished
  hostname: "framework"             # machine the run executed on
  git_hash: "67d2634"               # SimpleKiteControllers.jl commit hash
  git_status: "clean"               # SimpleKiteControllers.jl working tree: clean or dirty
