    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.5              # centre azimuth of the path [deg]
    az_amplitude_deg: 24.1          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 25.0             # centre elevation of the path [deg]
    el_height_deg: 17.2             # elevation span of the path, peak to peak [deg]
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.2       # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 16.31    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.311        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 30.0 # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    margin_start: 1.05              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.66                # curvature margin at reelout_l_max [-]
    c1_final: 0.2133                # turn-rate gain at depower_final [1/m]
