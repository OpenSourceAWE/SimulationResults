  realtime_factor: 3.95             # sim_time / wall_time, excluding time frozen for re-optimization
  ms_per_step: 2.8                  # wall time per step, excluding time frozen for re-optimization [ms]
  steps: 27952                      # step count
  dt_s: 0.011111111111111112        # simulation timestep [s]
  vsm_interval: 10                  # VSM aerodynamic update interval [steps]
