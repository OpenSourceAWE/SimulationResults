      t_108.4_s: 1.5                # optimizer's l_dp [m]; rel_depower equivalent 0.281 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_143.7_s: 1.488              # optimizer's l_dp [m]; rel_depower equivalent 0.279 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_180.6_s: 1.482              # optimizer's l_dp [m]; rel_depower equivalent 0.277 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
