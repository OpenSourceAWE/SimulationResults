      lap_6: -0.1                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.63°, correction became [+0.01 +0.17 +0.71 +1.29 +0.97]° (crossing … lobe)
      lap_7: -0.26                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.82°, correction became [+0.03 +0.23 +0.88 +1.50 +1.20]° (crossing … lobe)
