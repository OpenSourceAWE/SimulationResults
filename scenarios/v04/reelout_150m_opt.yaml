    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    margin_start: 0.96              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
