      lap_5: "+0.23 +0.20 +0.05 -0.36 +0.39" # error vs the optimizer's curve per band, crossing first; 554/608/610/481/435 samples, correction now [+0.04 +0.16 +0.62 +1.17 +0.91]° (crossing … lobe)
