    mean: 2.17                      # mean cross-track error [deg]
    max: 7.47                       # max cross-track error [deg]
  elevation_deg:
    min_settled: 7.5                # min elevation, settled window [deg]
    min_whole_run: 7.5              # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 64          # peak heading rate [deg/s]
  extent:
    azimuth_deg:
      min: -21.0                    # flown azimuth reach, negative side [deg]
      max: 22.3                     # flown azimuth reach, positive side [deg]
    azimuth_pct_of_amplitude:
      min: 94                       # negative reach as % of the pattern's ±A
      max: 96                       # positive reach as % of the pattern's ±A
    worst_lobe_deg:
      min: -16.5                    # weakest lobe, negative side [deg]
      max: 17.3                     # weakest lobe, positive side [deg]
    elevation_span_deg: 25.1        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 10.4    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 87     # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 1102                      # mean tether force, settled window [N]
    std: 234                        # std tether force, settled window [N]
    cv_pct: 21.3                    # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.32              # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 12 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0105         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.16     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.32    # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.32    # peak steering commanded
    rate_limited_pct_time: 6        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
