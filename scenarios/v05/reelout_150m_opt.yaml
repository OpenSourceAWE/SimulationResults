      lap_5: -0.12                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.08°, correction became [+0.33 +0.64 +1.44 +1.88 +1.32]° (crossing … lobe)
      lap_7: -2.49                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -3.49°, correction became [+3.08 +3.53 +4.00 +4.00 +3.36]° (crossing … lobe)
