      lap_2: "+0.19 -0.33 -0.88 -1.49 -0.20" # error vs the optimizer's curve per band, crossing first; 393/428/389/283/428 samples, correction now [+0.44 +0.74 +1.27 +1.56 +1.00]° (crossing … lobe)
      lap_3: "  -     -     -     -   +0.06" # error vs the optimizer's curve per band, crossing first; 0/0/0/0/2 samples, correction now [+0.32 +0.64 +1.26 +1.57 +1.25]° (crossing … lobe)
