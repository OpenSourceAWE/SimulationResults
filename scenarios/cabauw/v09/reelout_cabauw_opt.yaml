  settle_time: 15.6                 # time after t_start to converge [s]
  laps: 4.5                         # figure-eight laps completed
  lap_time:
    fastest: 14.2                   # shortest time for one full figure of eight — lap 1, starting at t = 17.9 s [s]
    mean: 18.5                      # mean time per full figure of eight, over 4 laps [s]
    slowest: 23.4                   # longest time for one full figure of eight — lap 4 [s]
  cross_track_deg:
    rms: 1.92                       # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 1.66                      # mean cross-track error vs the unlifted optimizer path [deg]
    max: 5.0                        # max cross-track error vs the unlifted optimizer path [deg]
  elevation_deg:
    min_settled: 11.2               # min elevation, settled window [deg]
    min_whole_run: 11.2             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 70          # peak heading rate [deg/s]
  extent:
    azimuth_deg:
      min: -23.9                    # flown azimuth reach, negative side [deg]
      max: 23.6                     # flown azimuth reach, positive side [deg]
    azimuth_pct_of_amplitude:
      min: 109                      # negative reach as % of the pattern's ±A
      max: 112                      # positive reach as % of the pattern's ±A
    worst_lobe_deg:
      min: -21.2                    # weakest lobe, negative side [deg]
      max: 21.7                     # weakest lobe, positive side [deg]
    elevation_span_deg: 31.3        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 23.1    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 105    # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 6893                      # mean tether force, settled window [N]
    std: 473                        # std tether force, settled window [N]
    cv_pct: 6.9                     # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.224             # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 1 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0032         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.29     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.219   # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.224   # peak steering commanded
    rate_limited_pct_time: 0        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
