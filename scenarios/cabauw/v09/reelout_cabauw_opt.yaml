      lap_2: "+0.21 -0.96 -1.71 -1.92 +0.08" # error vs the optimizer's curve per band, crossing first; 349/227/185/252/376 samples, correction now [+0.91 +1.36 +1.85 +1.75 +0.88]° (crossing … lobe)
