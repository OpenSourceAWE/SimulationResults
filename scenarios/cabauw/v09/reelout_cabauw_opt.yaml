  force:
    cf_force_ro: 1.11               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.16               # crest factor: peak / mean reel-out power over the reeling window
    duration: 70.1                  # reeling window length [s]
    n_samples: 6306                 # sample count in the reeling window
    energy_kJ: 1544.4               # energy over the reeling window [kJ]
    energy_run_kJ: 1540.5           # energy over the whole run [kJ]
  winch_state:
