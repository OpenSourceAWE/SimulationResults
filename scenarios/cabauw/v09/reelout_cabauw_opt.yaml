    mean: 18.2                      # mean time per full figure of eight, over 5 laps [s]
    slowest: 25.4                   # longest time for one full figure of eight — lap 4 [s]
  cross_track_deg:
    rms: 1.48                       # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 1.15                      # mean cross-track error vs the unlifted optimizer path [deg]
    max: 4.94                       # max cross-track error vs the unlifted optimizer path [deg]
  elevation_deg:
    min_settled: 10.7               # min elevation, settled window [deg]
    min_whole_run: 10.7             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 87          # peak heading rate [deg/s]
  extent:
