      t_076.1_s: "blended in"       # +3.00° of shift (mean over the bands), curvature margin 0.94 vs 0.82 required
      t_085.0_s: "carried by an install (0 % of the spread)" # -0.00° of shift (mean over the bands), curvature margin 1.18 vs 0.82 required
    laps:
