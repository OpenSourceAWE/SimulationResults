      min: -14.3                    # weakest lobe, negative side [deg]
      max: 14.3                     # weakest lobe, positive side [deg]
    elevation_span_deg: 25.6        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 18.6    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 96     # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 6967                      # mean tether force, settled window [N]
    std: 458                        # std tether force, settled window [N]
    cv_pct: 6.6                     # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.271             # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 1 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0036         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.39     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.26    # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.271   # peak steering commanded
    rate_limited_pct_time: 0        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
  v_app_phase4:
    duration: 67.6                  # phase-4 window length [s]
    mean_m_s: 37.05                 # mean apparent wind speed [m/s]
    min_m_s: 33.44                  # min apparent wind speed [m/s]
    max_m_s: 41.19                  # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: 37.2             # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 5.75               # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.1                # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.16               # crest factor: peak / mean reel-out power over the reeling window
    duration: 69.3                  # reeling window length [s]
    n_samples: 6233                 # sample count in the reeling window
    energy_kJ: 1565.7               # energy over the reeling window [kJ]
    energy_run_kJ: 1561.7           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 6233                 # sample count in the reeling window
  ringing:
    n_peaks: 5                      # ring peaks detected above peak_floor
    period: 2.89                    # mean peak-to-peak ring period [s]
    zeta: 0.117                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.43             # first ring peak's amplitude above the local trend [m/s]
    duration: 12.9                  # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 3.58        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 3.35      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 22768              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 21477      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 21477              # 20% of the reeling window
      t_030.6_s: 22851              # 19% of the reeling window
      t_043.6_s: 23231              # 24% of the reeling window
      t_060.5_s: 23229              # 32% of the reeling window
      t_082.9_s: 22302              # 5% of the reeling window
    measured_W: 22608               # mean reel-out power the run harvested [W]
    ratio: 0.99                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 30.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # offset of the seed the startup solve converged from after a 422 — a startup_retry_el_offsets entry, or a whole degree walked outward past them when the failure cache rejected the listed ones; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.803              # optimizer's l_dp [m]; rel_depower equivalent 0.342 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_030.6_s: 1.821              # optimizer's l_dp [m]; rel_depower equivalent 0.345 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_043.6_s: 1.831              # optimizer's l_dp [m]; rel_depower equivalent 0.347 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_060.5_s: 1.846              # optimizer's l_dp [m]; rel_depower equivalent 0.350 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_082.9_s: 1.885              # optimizer's l_dp [m]; rel_depower equivalent 0.358 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.3416             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_030.6_s: 0.3451             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_043.6_s: 0.3472             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_060.5_s: 0.3502             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_082.9_s: 0.3581             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.4              # centre azimuth of the path [deg]
    az_amplitude_deg: 24.2          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 27.8             # centre elevation of the path [deg]
    el_height_deg: 20.9             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 24.41    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.387        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    c1_pattern: 0.1734              # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own under fly_opt_depower), not depower_setpoint's [1/m]
    gain_scale_flown: 1.416         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 0.89              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.26                # curvature margin at reelout_l_max [-]
    c1_final: 0.1655                # turn-rate gain at depower_final [1/m]
    margin_final: 2.12              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.93        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 23.1                   # wall time the simulation was frozen waiting for replies [s]
    installed: 4                    # new paths actually flown
    cycle_wall:
      t_030.6_s: 4.7                # wall time from the first request to the verdict (installed), every retry included, at L = 194 m [s]
      t_043.6_s: 5.0                # wall time from the first request to the verdict (installed), every retry included, at L = 239 m [s]
      t_060.5_s: 5.0                # wall time from the first request to the verdict (installed), every retry included, at L = 298 m [s]
      t_082.9_s: 8.5                # wall time from the first request to the verdict (installed), every retry included, at L = 374 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_030.6_s: "installed — margin 0.87 (lobe lift at 75 %) (phase 5: 1.67 at 380 m), clearance 47.9 m, size x0.92, 22851 W predicted" # at L = 194 m
      t_043.6_s: "installed — margin 0.93 (phase 5: 1.45 at 380 m), clearance 57.9 m, size x1.08, 23231 W predicted" # at L = 239 m
      t_060.5_s: "installed — margin 1.03 (phase 5: 1.31 at 380 m), clearance 73.2 m, size x1.06, 23229 W predicted" # at L = 298 m
      t_082.9_s: "installed — margin 0.88 (phase 5: 0.93 at 380 m), clearance 101.0 m, size x0.53, 22302 W predicted" # at L = 374 m
  el_lift:
    lift_deg: 1.0                   # el_offset_final, the fixed lift of the path once reel-out ends [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.0                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the units el_offset_wing_az/_blend are read in
    wing_az_deg: 10.0               # azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg or fraction of A]
    lift_t: 76.4                    # when the lift actually latched [s]
    lift_remaining_m: 27.7          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_076.4_s: "blended in"       # +1.00° of shift, curvature margin 1.17 vs 0.82 required
  droop_profile:
    az_00_20_pct: 2.95              # kite below the path's elevation centre [deg], over 1920 samples; the path itself sits 0.30 half-spans down there and the kite -0.31° under it
    az_20_40_pct: 1.28              # kite below the path's elevation centre [deg], over 1792 samples; the path itself sits 0.09 half-spans down there and the kite -0.57° under it
    az_40_60_pct: 1.97              # kite below the path's elevation centre [deg], over 1199 samples; the path itself sits 0.09 half-spans down there and the kite -1.28° under it
    az_60_80_pct: 2.55              # kite below the path's elevation centre [deg], over 1078 samples; the path itself sits 0.12 half-spans down there and the kite -1.44° under it
    az_80_100_pct: -0.34            # kite below the path's elevation centre [deg], over 2072 samples; the path itself sits -0.08 half-spans down there and the kite -0.40° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.0              # rigid lift the path in the air actually carries — el_offset_final once it has been delivered [deg]
    commanded_az_amp_deg: 19.64     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 19.0   # mean commanded pattern height [deg]
    wing_deg: 1.0                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 12.0            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 14.81         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 7.28     # reach margin: flew 21.03° against the 13.75° required by min_span_frac = 0.70, +53 %
    azimuth_reach_neg_deg: 6.88     # reach margin: flew 20.63° against the 13.75° required by min_span_frac = 0.70, +50 %
    elevation_span_deg: 4.85        # reach margin: flew 18.15° against the 13.30° required by min_span_frac = 0.70, +36 %
    tightest: "elevation span"      # the size criterion with the least room, +4.85° (+36 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 44.7                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 39.6               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 10.88  # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 9.0             # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 1                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0408               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 7900.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
