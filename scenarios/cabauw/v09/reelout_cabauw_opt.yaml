    n_peaks: 6                      # ring peaks detected above peak_floor
    period: 2.92                    # mean peak-to-peak ring period [s]
    zeta: 0.081                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.43             # first ring peak's amplitude above the local trend [m/s]
    duration: 17.1                  # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 3.59        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 3.34      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 22568              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 20610      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 20610              # 22% of the reeling window
      t_032.1_s: 22912              # 24% of the reeling window
      t_049.2_s: 23317              # 28% of the reeling window
      t_068.5_s: 23144              # 26% of the reeling window
    measured_W: 22041               # mean reel-out power the run harvested [W]
    ratio: 0.98                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 30.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # offset of the seed the startup solve converged from after a 422 — a startup_retry_el_offsets entry, or a whole degree walked outward past them when the failure cache rejected the listed ones; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.812              # optimizer's l_dp [m]; rel_depower equivalent 0.343 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_032.1_s: 1.82               # optimizer's l_dp [m]; rel_depower equivalent 0.345 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_049.2_s: 1.836              # optimizer's l_dp [m]; rel_depower equivalent 0.348 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_068.5_s: 1.857              # optimizer's l_dp [m]; rel_depower equivalent 0.352 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.3433             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_032.1_s: 0.345              # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_049.2_s: 0.3482             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_068.5_s: 0.3523             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: -0.4             # centre azimuth of the path [deg]
    az_amplitude_deg: 24.7          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 29.2             # centre elevation of the path [deg]
    el_height_deg: 21.5             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 25               # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    seed_spread_pct: 0              # share of the remembered bias's band-to-band SPREAD the STARTUP install carried; its mean always goes in whole, and the spread is rationed before the lobe lift is
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 23.84    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.562        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    c1_pattern: 0.1717              # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own under fly_opt_depower), not depower_setpoint's [1/m]
    gain_scale_flown: 1.417         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 1.0               # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.52                # curvature margin at reelout_l_max [-]
    c1_final: 0.1655                # turn-rate gain at depower_final [1/m]
    margin_final: 2.26              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 1.05        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 3                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 14.6                   # wall time the simulation was frozen waiting for replies [s]
    installed: 3                    # new paths actually flown
    cycle_wall:
      t_032.1_s: 4.6                # wall time from the first request to the verdict (installed), every retry included, at L = 199 m [s]
      t_049.2_s: 4.5                # wall time from the first request to the verdict (installed), every retry included, at L = 258 m [s]
      t_068.5_s: 5.5                # wall time from the first request to the verdict (installed), every retry included, at L = 324 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_032.1_s: "installed — margin 0.94 (droop spread at 25 %, lobe lift at 0 %) (phase 5: 1.74 at 380 m), clearance 52.5 m, size x1.03, 22912 W predicted" # at L = 199 m
      t_049.2_s: "installed — margin 0.88 (droop spread at 50 %, lobe lift at 0 %) (phase 5: 1.29 at 380 m), clearance 68.1 m, size x0.97, 23317 W predicted" # at L = 258 m
      t_068.5_s: "installed — margin 0.88 (droop spread at 56 %, lobe lift at 0 %) (phase 5: 1.05 at 380 m), clearance 91.7 m, size x1.15, 23144 W predicted" # at L = 324 m
  el_bias:
    learning: true                  # traj_opt.learning; false zeroes the gains and leaves the cache alone
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 1.41                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [0.68, 1.23, 2.17, 1.89, 1.09] # the learnt correction per band, crossing first [deg]
    seed_deg: [0.95, 1.67, 2.46, 2.25, 1.26] # the correction the run started from, remembered per project and wind speed after el_bias_seed_laps laps of the previous run; zeros = none
    seed_source: "interpolated of system_reelout_cabauw@5.75, system_reelout_cabauw@10.00" # where the seed came from: exact = this condition, else the nearest or interpolated neighbour of this project, or the mean of every project
    seed_laps: 2                    # el_bias_seed_laps, laps after which this run's correction is remembered; 0 = off
    lift_deg: 3.0                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t: 77.2                    # when the lift actually latched [s]
    lift_remaining_m: 26.4          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_017.9_s: "held back"        # +0.00° of shift (mean over the bands), curvature margin 0.41 vs 0.82 required
      t_032.1_s: "carried by an install (25 % of the spread)" # +0.00° of shift (mean over the bands), curvature margin 0.94 vs 0.82 required
      t_036.1_s: "blended in (100 % of the mean, 25 % of the spread)" # +0.13° of shift (mean over the bands), curvature margin 0.89 vs 0.82 required
      t_049.2_s: "carried by an install (50 % of the spread)" # +0.00° of shift (mean over the bands), curvature margin 0.88 vs 0.82 required
      t_053.2_s: "blended in (100 % of the mean, 25 % of the spread)" # -0.05° of shift (mean over the bands), curvature margin 0.84 vs 0.82 required
      t_068.5_s: "carried by an install (56 % of the spread)" # +0.00° of shift (mean over the bands), curvature margin 0.88 vs 0.82 required
      t_072.5_s: "blended in"       # -0.38° of shift (mean over the bands), curvature margin 0.92 vs 0.82 required
      t_077.2_s: "blended in"       # +3.00° of shift (mean over the bands), curvature margin 0.89 vs 0.82 required
    laps:
      lap_1: -0.18                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.77°, correction became [+1.26 +1.82 +2.46 +2.31 +1.40]° (crossing … lobe)
      lap_2: 0.19                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.61°, correction became [+1.10 +1.60 +2.54 +2.40 +1.35]° (crossing … lobe)
      lap_3: 0.84                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.81°, correction became [+0.68 +1.23 +2.17 +1.89 +1.09]° (crossing … lobe)
    lap_profiles:
      lap_1: "-0.35 -0.40 -0.32 -0.59 +0.34" # error vs the optimizer's curve per band, crossing first; 288/231/185/186/386 samples, correction now [+1.26 +1.82 +2.46 +2.31 +1.40]° (crossing … lobe)
      lap_2: "+0.48 +0.49 -0.58 -0.67 +0.82" # error vs the optimizer's curve per band, crossing first; 264/345/241/289/403 samples, correction now [+1.10 +1.60 +2.54 +2.40 +1.35]° (crossing … lobe)
      lap_3: "+1.07 +0.77 +0.25 +0.72 +1.03" # error vs the optimizer's curve per band, crossing first; 407/384/242/208/495 samples, correction now [+0.68 +1.23 +2.17 +1.89 +1.09]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 2.77              # kite below the path's elevation centre [deg], over 1894 samples; the path itself sits 0.18 half-spans down there and the kite -0.60° under it
    az_20_40_pct: 3.42              # kite below the path's elevation centre [deg], over 1774 samples; the path itself sits 0.20 half-spans down there and the kite -1.11° under it
    az_40_60_pct: 4.54              # kite below the path's elevation centre [deg], over 1192 samples; the path itself sits 0.20 half-spans down there and the kite -2.27° under it
    az_60_80_pct: 5.02              # kite below the path's elevation centre [deg], over 1091 samples; the path itself sits 0.23 half-spans down there and the kite -2.38° under it
    az_80_100_pct: 1.91             # kite below the path's elevation centre [deg], over 2160 samples; the path itself sits 0.11 half-spans down there and the kite -0.56° under it
    centre_to_lobe_deg: 2.24        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 4.41             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [3.68, 4.23, 5.17, 4.89, 4.09] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 21.57     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 22.56  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 11.2            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 17.31         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 8.97     # reach margin: flew 24.07° against the 15.10° required by min_span_frac = 0.70, +59 %
    azimuth_reach_neg_deg: 8.5      # reach margin: flew 23.60° against the 15.10° required by min_span_frac = 0.70, +56 %
    elevation_span_deg: 7.84        # reach margin: flew 23.63° against the 15.79° required by min_span_frac = 0.70, +50 %
    tightest: "elevation span"      # the size criterion with the least room, +7.84° (+50 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 47.3                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 40.4               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 9.5    # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 9.0             # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 1                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0408               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 8000.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
