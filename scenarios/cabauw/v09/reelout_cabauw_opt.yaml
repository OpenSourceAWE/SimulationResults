    slowest: 22.5                   # longest time for one full figure of eight — lap 4 [s]
  cross_track_deg:
    rms: 1.07                       # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 0.82                      # mean cross-track error vs the unlifted optimizer path [deg]
    max: 4.99                       # max cross-track error vs the unlifted optimizer path [deg]
  elevation_deg:
