  optimization_time: 125.3          # wall time waiting for the optimizer: the startup solve (14.1 s) plus every blocking re-optimization (traj_opt.reopt.blocked) [s]
  max_optimization_time: 87.7       # longest wall time to compute a new figure of eight, retries included: the re-optimization at t = 49.4 s (failed, L = 259 m); the startup solve took 14.1 s [s]
