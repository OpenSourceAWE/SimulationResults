  av_power_ro: 2320                 # mean reel-out power over phase four [W]
  min_power_ro: 1702                # min reel-out power over phase four, last 2 s excluded [W]
  max_power_ro: 3377                # max reel-out power over phase four [W]
  min_force_ro: 1103                # min tether force over phase four, last 2 s excluded [N]
