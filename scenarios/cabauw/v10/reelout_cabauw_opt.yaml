  v_ro_min: 2.74                    # min reel-out speed over phase four, last 2 s excluded [m/s]
  v_ro_av: 3.39                     # mean reel-out speed over phase four [m/s]
  v_ro_max: 3.65                    # max reel-out speed over phase four [m/s]
  av_depower_ro: 0.365              # mean KCU depower over phase four [-]
