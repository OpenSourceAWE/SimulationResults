  power_ratio: 1.04                 # measured / predicted reel-out power [-]
  success_criteria: "all 10 passed" # pass/fail verdict vs V3Kite's success criteria
  cross_track_rms_deg: 1.22         # RMS cross-track error, settled window [deg]
  total_wall_time: 188.6            # the whole script, start to this summary [s]
  realtime_factor: 4.51             # sim_time / wall_time, excluding time frozen for re-optimization
  optimization_requests: 4          # solves that completed, accepted or rejected
