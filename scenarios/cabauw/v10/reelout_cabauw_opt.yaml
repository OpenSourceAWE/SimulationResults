# Run summary for output/reelout_cabauw_opt.arrow, written by examples/simple_reelout.jl at the end of the run.
success_criteria: "all 10 passed"   # pass/fail verdict vs V3Kite's success criteria
simulation:
  script: "simple_opt_reelout.jl"   # script that produced this run
  project: "system_reelout_cabauw.yaml" # system project flown
  rel_turbulence: 0.0               # turbulence level in [0, 1] passed to init
  wind_speed: 10.0                  # mean wind speed in m/s passed to init
  time: "19:07:28"                  # wall-clock time the run finished
  date: "2026-10-05"                # wall-clock date the run finished
  hostname: "ufryzen"               # machine the run executed on
  git_hash: "7a09700"               # SimpleKiteControllers.jl commit hash
  git_status: "dirty"               # SimpleKiteControllers.jl working tree: clean or dirty
fig8_metrics:
  settled_from: 17.4                # sim time the scoring window begins [s]
  settle_time: 15.4                 # time after t_start to converge [s]
  laps: 3.0                         # figure-eight laps completed
  lap_time:
    fastest: 16.3                   # shortest time for one full figure of eight — lap 1, starting at t = 17.8 s [s]
    mean: 20.5                      # mean time per full figure of eight, over 2 laps [s]
    slowest: 24.6                   # longest time for one full figure of eight — lap 2 [s]
  cross_track_deg:
    rms: 1.44                       # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 1.09                      # mean cross-track error vs the unlifted optimizer path [deg]
    max: 4.95                       # max cross-track error vs the unlifted optimizer path [deg]
  elevation_deg:
    min_settled: 12.2               # min elevation, settled window [deg]
    min_whole_run: 12.0             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 75          # peak heading rate [deg/s]
  extent:
    azimuth_deg:
      min: -27.5                    # flown azimuth reach, negative side [deg]
      max: 31.6                     # flown azimuth reach, positive side [deg]
    azimuth_pct_of_amplitude:
      min: 91                       # negative reach as % of the pattern's ±A
      max: 103                      # positive reach as % of the pattern's ±A
    worst_lobe_deg:
      min: -18.8                    # weakest lobe, negative side [deg]
      max: 29.4                     # weakest lobe, positive side [deg]
    elevation_span_deg: 25.6        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 22.1    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 105    # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 6465                      # mean tether force, settled window [N]
    std: 704                        # std tether force, settled window [N]
    cv_pct: 10.9                    # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.32              # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 1 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0039         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.29     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.32    # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.32    # peak steering commanded
    rate_limited_pct_time: 2        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
  v_app_phase4:
    duration: 68.4                  # phase-4 window length [s]
    mean_m_s: 35.09                 # mean apparent wind speed [m/s]
    min_m_s: 31.81                  # min apparent wind speed [m/s]
    max_m_s: 38.57                  # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: 30.0             # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 2.78               # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.2                # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.27               # crest factor: peak / mean reel-out power over the reeling window
    duration: 63.3                  # reeling window length [s]
    n_samples: 5697                 # sample count in the reeling window
    energy_kJ: 1353.6               # energy over the reeling window [kJ]
    energy_run_kJ: 1477.7           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 6391                 # sample count in the reeling window
  ringing:
    n_peaks: 7                      # ring peaks detected above peak_floor
    period: 2.99                    # mean peak-to-peak ring period [s]
    zeta: 0.059                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.43             # first ring peak's amplitude above the local trend [m/s]
    duration: 19.0                  # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 3.5         # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 3.27      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 21218              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 18745      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 18745              # 30% of the reeling window
      t_034.1_s: 21201              # 39% of the reeling window
      t_058.7_s: 23612              # 31% of the reeling window
    measured_W: 21373               # mean reel-out power the run harvested [W]
    ratio: 1.01                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate, fitted into the startup box; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak, fitted into the startup box [deg]
    el_center_deg: 30.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # offset of the seed the startup solve converged from after a 422 — a startup_retry_el_offsets entry, or a whole degree walked outward past them when the failure cache rejected the listed ones; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.908              # optimizer's l_dp [m]; rel_depower equivalent 0.395 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_034.1_s: 1.9                # optimizer's l_dp [m]; rel_depower equivalent 0.393 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_058.7_s: 1.889              # optimizer's l_dp [m]; rel_depower equivalent 0.389 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.3955             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
      t_034.1_s: 0.3927             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
      t_058.7_s: 0.3887             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.0              # centre azimuth of the path [deg]
    az_amplitude_deg: 28.0          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 28.6             # centre elevation of the path [deg]
    el_height_deg: 21.3             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 18.16    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.618        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 34.05 # reel-out per lap ASSUMED for the startup request, fitted to the wind; the only request with no reply to measure it off [m]
  reopt:
    requests: 2                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 0.0                    # wall time the simulation was frozen waiting for replies [s]
    cache_hits: 3                   # optimizer steps, startup included, served from the solution or failure cache (OptChain) without asking the server
    cache_misses: 0                 # optimizer steps sent to the server
    cache_rebuilds: 0               # server sessions rebuilt from the cache before a miss
    replayed_from: ""               # scenario whose optimizer results were flown instead of asking the optimizer (`replay_paths`); empty for a normal run
    installed: 2                    # new paths actually flown
    cycle_wall:
      t_034.1_s: 0.0                # wall time from the first request to the verdict (installed), every retry included, at L = 210 m [s]
      t_058.7_s: 0.0                # wall time from the first request to the verdict (installed), every retry included, at L = 291 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    challenges: 0                   # cold challenger solves run against an accepted reply that grew by more than challenge_growth while predicting less than the previous install
    challenges_won: 0               # challengers installed instead of the reply they challenged
    events:
      t_034.1_s: "installed — margin Inf, clearance 55.7 m, size x1.22, 21201 W predicted" # at L = 210 m
      t_058.7_s: "installed — margin Inf, clearance 64.6 m, size x0.87, 23612 W predicted" # at L = 291 m
  el_lift:
    lift_deg: 1.0                   # el_offset_final, the fixed lift of the path once reel-out ends [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 0.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the units el_offset_wing_az/_blend are read in
    wing_az_deg: 10.0               # azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg or fraction of A]
    lift_t: 76.5                    # when the lift actually latched [s]
    lift_remaining_m: 28.0          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_076.5_s: "blended in"       # +1.00° of shift, curvature margin Inf vs 0.82 required
  droop_profile:
    az_00_20_pct: 3.94              # kite below the path's elevation centre [deg], over 1155 samples; the path itself sits 0.40 half-spans down there and the kite 0.04° under it
    az_20_40_pct: 2.01              # kite below the path's elevation centre [deg], over 1149 samples; the path itself sits 0.17 half-spans down there and the kite -0.33° under it
    az_40_60_pct: 0.46              # kite below the path's elevation centre [deg], over 1044 samples; the path itself sits -0.04 half-spans down there and the kite -0.80° under it
    az_60_80_pct: -23.89            # kite below the path's elevation centre [deg], over 2943 samples; the path itself sits -0.74 half-spans down there and the kite 17.22° under it
    az_80_100_pct: -15.43           # kite below the path's elevation centre [deg], over 2564 samples; the path itself sits -0.59 half-spans down there and the kite 10.01° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.0              # rigid lift the path in the air actually carries — el_offset_final once it has been delivered [deg]
    commanded_az_amp_deg: 30.11     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 19.69  # mean commanded pattern height [deg]
    wing_deg: 0.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 12.0            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 45.97         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 9.98     # reach margin: flew 31.06° against the 21.08° required by min_span_frac = 0.70, +47 %
    azimuth_reach_neg_deg: 6.33     # reach margin: flew 27.41° against the 21.08° required by min_span_frac = 0.70, +30 %
    elevation_span_deg: 6.97        # reach margin: flew 20.76° against the 13.78° required by min_span_frac = 0.70, +51 %
    tightest: "azimuth reach neg"   # the size criterion with the least room, +6.33° (+30 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 46.2                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 31.8               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 11.7   # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 10.0            # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 1                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    k_v_flown: 0.0408               # k_v the run actually flew
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 7200.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 1.00 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
performance:
  sim_time: 116.1                   # simulated time [s]
  wall_time: 18.1                   # wall-clock time [s]
  total_wall_time: 22.5             # the whole script: package loading, init, settling, the startup solve and the run, up to this summary — the archive copy and any plots follow it [s]
  optimization_time: 0.3            # wall time waiting for the optimizer: the startup solve (0.3 s) plus every blocking re-optimization (traj_opt.reopt.blocked) [s]
  max_optimization_time: 0.3        # longest wall time to compute a new figure of eight, retries included: the startup solve; the slowest re-optimization took 0.0 s [s]
  realtime_factor: 6.43             # sim_time / wall_time, excluding time frozen for re-optimization
  ms_per_step: 1.7                  # wall time per step, excluding time frozen for re-optimization [ms]
  steps: 10453                      # step count
  dt: 0.011111111111111112          # simulation timestep [s]
  vsm_interval: 5                   # VSM aerodynamic update interval [steps]
