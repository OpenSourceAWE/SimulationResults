  power_ratio: 1.01                 # measured / predicted reel-out power [-]
  success_criteria: "all 10 passed" # pass/fail verdict vs V3Kite's success criteria
  cross_track_rms_deg: 1.44         # RMS cross-track error, settled window [deg]
  total_wall_time: 22.5             # the whole script, start to this summary [s]
  realtime_factor: 6.43             # sim_time / wall_time, excluding time frozen for re-optimization
  optimization_requests: 2          # solves that completed, accepted or rejected
  optimizations_installed: 2        # new paths actually flown
  fastest_fig8: 16.3                # shortest time for flying one full figure of eight [s]
  max_optimization_time: 0.3        # longest wall time to compute a new figure of eight, retries included [s]
  av_power_ro: 21722                # mean reel-out power over phase four [W]
  min_power_ro: 15213               # min reel-out power over phase four, last 2 s excluded [W]
  max_power_ro: 27053               # max reel-out power over phase four [W]
  min_force_ro: 5025                # min tether force over phase four, last 2 s excluded [N]
  av_force_ro: 6468                 # mean tether force over phase four [N]
  max_force_ro: 7733                # max tether force over phase four [N]
  v_ro_min: 2.85                    # min reel-out speed over phase four, last 2 s excluded [m/s]
  v_ro_av: 3.34                     # mean reel-out speed over phase four [m/s]
  v_ro_max: 3.5                     # max reel-out speed over phase four [m/s]
  av_depower_ro: 0.392              # mean KCU depower over phase four [-]
  max_depower_final: 0.389          # highest depower the force limiter asked for, from the stop latch through phase 5; the phase-5 floor itself when it never engaged or is off (depower_final_max == depower_final) [-]
  gain_scale_final_peak: 1.456      # heading_p factor phase 5 flew with at the limiter's peak, c1(depower_setpoint)/c1(flown), read at 0.35 [-]
