    mean: 17.8                      # mean time per full figure of eight, over 4 laps [s]
    slowest: 25.2                   # longest time for one full figure of eight — lap 4 [s]
  cross_track_deg:
    rms: 1.26                       # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 0.96                      # mean cross-track error vs the unlifted optimizer path [deg]
    max: 4.93                       # max cross-track error vs the unlifted optimizer path [deg]
  elevation_deg:
    min_settled: 11.2               # min elevation, settled window [deg]
    min_whole_run: 11.2             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 79          # peak heading rate [deg/s]
  extent:
    azimuth_deg:
      min: -23.8                    # flown azimuth reach, negative side [deg]
      max: 23.7                     # flown azimuth reach, positive side [deg]
    azimuth_pct_of_amplitude:
      min: 103                      # negative reach as % of the pattern's ±A
      max: 106                      # positive reach as % of the pattern's ±A
    worst_lobe_deg:
      min: -20.4                    # weakest lobe, negative side [deg]
      max: 20.5                     # weakest lobe, positive side [deg]
    elevation_span_deg: 28.7        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 23.2    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 100    # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 7275                      # mean tether force, settled window [N]
    std: 506                        # std tether force, settled window [N]
    cv_pct: 7.0                     # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.271             # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 0 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0039         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.35     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.263   # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.271   # peak steering commanded
    rate_limited_pct_time: 1        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
  v_app_phase4:
    duration: 66.7                  # phase-4 window length [s]
    mean_m_s: 39.38                 # mean apparent wind speed [m/s]
    min_m_s: 34.23                  # min apparent wind speed [m/s]
    max_m_s: 42.36                  # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: 45.9             # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 4.72               # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.14               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.18               # crest factor: peak / mean reel-out power over the reeling window
    duration: 68.3                  # reeling window length [s]
    n_samples: 6143                 # sample count in the reeling window
    energy_kJ: 1658.3               # energy over the reeling window [kJ]
    energy_run_kJ: 1654.2           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 6143                 # sample count in the reeling window
  ringing:
    n_peaks: 4                      # ring peaks detected above peak_floor
    period: 4.69                    # mean peak-to-peak ring period [s]
    zeta: 0.162                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.46             # first ring peak's amplitude above the local trend [m/s]
    duration: 16.6                  # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 3.75        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 3.4       # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 23294              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 19267      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 19267              # 22% of the reeling window
      t_031.6_s: 24357              # 21% of the reeling window
      t_045.9_s: 24922              # 26% of the reeling window
      t_064.0_s: 24098              # 30% of the reeling window
    measured_W: 24296               # mean reel-out power the run harvested [W]
    ratio: 1.04                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 30.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # offset of the seed the startup solve converged from after a 422 — a startup_retry_el_offsets entry, or a whole degree walked outward past them when the failure cache rejected the listed ones; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.904              # optimizer's l_dp [m]; rel_depower equivalent 0.362 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_031.6_s: 1.882              # optimizer's l_dp [m]; rel_depower equivalent 0.357 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_045.9_s: 1.896              # optimizer's l_dp [m]; rel_depower equivalent 0.360 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_064.0_s: 1.917              # optimizer's l_dp [m]; rel_depower equivalent 0.364 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.3617             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_031.6_s: 0.3574             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_045.9_s: 0.3601             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_064.0_s: 0.3644             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: -1.3             # centre azimuth of the path [deg]
    az_amplitude_deg: 26.5          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 28.9             # centre elevation of the path [deg]
    el_height_deg: 24.8             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 50               # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 25.53    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.617        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    c1_pattern: 0.1552              # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own under fly_opt_depower), not depower_setpoint's [1/m]
    gain_scale_flown: 1.582         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 0.92              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.33                # curvature margin at reelout_l_max [-]
    c1_final: 0.1655                # turn-rate gain at depower_final [1/m]
    margin_final: 2.43              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 1.48        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 3                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 64.9                   # wall time the simulation was frozen waiting for replies [s]
    installed: 3                    # new paths actually flown
    cycle_wall:
      t_031.6_s: 45.8               # wall time from the first request to the verdict (installed), every retry included, at L = 200 m [s]
      t_045.9_s: 13.1               # wall time from the first request to the verdict (installed), every retry included, at L = 250 m [s]
      t_064.0_s: 6.5                # wall time from the first request to the verdict (installed), every retry included, at L = 313 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_031.6_s: "installed — margin 0.90 (lobe lift at 50 %) (phase 5: 1.79 at 380 m), clearance 46.0 m, size x0.85, 24357 W predicted" # at L = 200 m
      t_045.9_s: "installed — margin 0.86 (phase 5: 1.39 at 380 m), clearance 59.0 m, size x1.08, 24922 W predicted" # at L = 250 m
      t_064.0_s: "installed — margin 1.13 (phase 5: 1.48 at 380 m), clearance 82.5 m, size x1.26, 24098 W predicted" # at L = 313 m
  el_lift:
    lift_deg: 1.0                   # el_offset_final, the fixed lift of the path once reel-out ends [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.0                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the units el_offset_wing_az/_blend are read in
    wing_az_deg: 10.0               # azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg or fraction of A]
    lift_t: 75.4                    # when the lift actually latched [s]
    lift_remaining_m: 27.7          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_075.4_s: "blended in"       # +1.00° of shift, curvature margin 1.18 vs 0.82 required
  droop_profile:
    az_00_20_pct: 3.52              # kite below the path's elevation centre [deg], over 2074 samples; the path itself sits 0.29 half-spans down there and the kite -0.21° under it
    az_20_40_pct: 1.32              # kite below the path's elevation centre [deg], over 2005 samples; the path itself sits 0.07 half-spans down there and the kite -0.56° under it
    az_40_60_pct: 2.36              # kite below the path's elevation centre [deg], over 1070 samples; the path itself sits 0.07 half-spans down there and the kite -1.48° under it
    az_60_80_pct: 2.53              # kite below the path's elevation centre [deg], over 998 samples; the path itself sits 0.08 half-spans down there and the kite -1.52° under it
    az_80_100_pct: -0.51            # kite below the path's elevation centre [deg], over 1967 samples; the path itself sits -0.08 half-spans down there and the kite -0.38° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.0              # rigid lift the path in the air actually carries — el_offset_final once it has been delivered [deg]
    commanded_az_amp_deg: 23.44     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 23.39  # mean commanded pattern height [deg]
    wing_deg: 1.0                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 11.2            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 15.71         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 8.41     # reach margin: flew 24.82° against the 16.41° required by min_span_frac = 0.70, +51 %
    azimuth_reach_neg_deg: 7.73     # reach margin: flew 24.14° against the 16.41° required by min_span_frac = 0.70, +47 %
    elevation_span_deg: 7.0         # reach margin: flew 23.37° against the 16.37° required by min_span_frac = 0.70, +43 %
    tightest: "elevation span"      # the size criterion with the least room, +7.00° (+43 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 42.7                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 36.8               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 9.78   # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 10.0            # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 1                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0408               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 7200.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
performance:
  sim_time: 108.0                   # simulated time [s]
  wall_time: 92.0                   # wall-clock time [s]
