    steady_v_reelout_m_s: 3.28      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 22872              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 19686      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 19686              # 19% of the reeling window
      t_030.5_s: 22430              # 21% of the reeling window
      t_045.2_s: 23977              # 27% of the reeling window
      t_064.6_s: 24136              # 33% of the reeling window
    measured_W: 21362               # mean reel-out power the run harvested [W]
    ratio: 0.93                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # startup_retry_el_offsets entry the startup solve converged from after a 422; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.6             # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.424              # optimizer's l_dp [m]; rel_depower equivalent 0.266 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_030.5_s: 1.433              # optimizer's l_dp [m]; rel_depower equivalent 0.268 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_045.2_s: 1.457              # optimizer's l_dp [m]; rel_depower equivalent 0.272 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_064.6_s: 1.503              # optimizer's l_dp [m]; rel_depower equivalent 0.282 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.4              # centre azimuth of the path [deg]
    az_amplitude_deg: 20.5          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 26.0             # centre elevation of the path [deg]
    el_height_deg: 12.8             # elevation span of the path, peak to peak [deg]
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 17.13    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.608        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    margin_start: 0.92              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.33                # curvature margin at reelout_l_max [-]
    c1_final: 0.1655                # turn-rate gain at depower_final [1/m]
    margin_final: 1.61              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 1.31        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 3                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 18.6                   # wall time the simulation was frozen waiting for replies [s]
    installed: 3                    # new paths actually flown
    cycle_wall:
      t_030.5_s: 7.9                # wall time from the first request to the verdict (installed), every retry included, at L = 192 m [s]
      t_045.2_s: 6.0                # wall time from the first request to the verdict (installed), every retry included, at L = 242 m [s]
      t_064.6_s: 5.0                # wall time from the first request to the verdict (installed), every retry included, at L = 308 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_030.5_s: "installed — margin 0.95 (phase 5: 1.28 at 380 m), clearance 71.3 m, 22430 W predicted" # at L = 192 m
      t_045.2_s: "installed — margin 1.18 (phase 5: 1.26 at 380 m), clearance 83.5 m, 23977 W predicted" # at L = 242 m
      t_064.6_s: "installed — margin 1.56 (phase 5: 1.31 at 380 m), clearance 102.1 m, 24136 W predicted" # at L = 308 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 2.0                  # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [1.36, 1.86, 2.78, 2.62, 1.37] # the learnt correction per band, crossing first [deg]
    lift_deg: 3.0                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t: 78.4                    # when the lift actually latched [s]
    lift_remaining_m: 26.3          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_034.5_s: "blended in"       # +0.61° of shift (mean over the bands), curvature margin 1.09 vs 0.82 required
      t_049.2_s: "blended in"       # +0.50° of shift (mean over the bands), curvature margin 1.25 vs 0.82 required
      t_068.6_s: "blended in"       # +0.04° of shift (mean over the bands), curvature margin 1.66 vs 0.82 required
      t_078.4_s: "blended in"       # +3.00° of shift (mean over the bands), curvature margin 1.90 vs 0.82 required
      t_118.1_s: "blended in"       # +0.87° of shift (mean over the bands), curvature margin 1.19 vs 0.82 required
    laps:
      lap_1: -1.15                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.15°, correction became [+0.51 +0.61 +0.72 +0.70 +0.49]° (crossing … lobe)
      lap_2: -0.95                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.55°, correction became [+0.58 +0.97 +1.43 +1.53 +1.03]° (crossing … lobe)
      lap_3: -0.02                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.09°, correction became [+0.42 +0.84 +1.53 +1.74 +1.22]° (crossing … lobe)
      lap_5: -0.79                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.85°, correction became [+1.41 +1.89 +2.75 +2.62 +1.41]° (crossing … lobe)
      lap_6: 0.07                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.82°, correction became [+1.36 +1.86 +2.78 +2.62 +1.37]° (crossing … lobe)
    lap_profiles:
      lap_1: "-0.98 -1.25 -1.49 -1.52 -0.84" # error vs the optimizer's curve per band, crossing first; 205/192/163/169/332 samples, correction now [+0.51 +0.61 +0.72 +0.70 +0.49]° (crossing … lobe)
      lap_2: "+0.07 -0.82 -1.56 -1.98 -0.72" # error vs the optimizer's curve per band, crossing first; 254/261/232/230/352 samples, correction now [+0.58 +0.97 +1.43 +1.53 +1.03]° (crossing … lobe)
      lap_3: "+0.49 +0.27 -0.39 -0.79 -0.01" # error vs the optimizer's curve per band, crossing first; 407/364/298/277/394 samples, correction now [+0.42 +0.84 +1.53 +1.74 +1.22]° (crossing … lobe)
      lap_5: "-0.92 -1.05 -1.42 -1.17 +0.23" # error vs the optimizer's curve per band, crossing first; 653/559/397/352/608 samples, correction now [+1.41 +1.89 +2.75 +2.62 +1.41]° (crossing … lobe)
      lap_6: "+0.13 +0.03 -0.25 -0.31 +0.48" # error vs the optimizer's curve per band, crossing first; 655/560/399/354/610 samples, correction now [+1.36 +1.86 +2.78 +2.62 +1.37]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 3.56              # kite below the path's elevation centre [deg], over 2745 samples; the path itself sits 0.36 half-spans down there and the kite -0.87° under it
    az_20_40_pct: 1.83              # kite below the path's elevation centre [deg], over 2533 samples; the path itself sits 0.06 half-spans down there and the kite -1.44° under it
    az_40_60_pct: 2.33              # kite below the path's elevation centre [deg], over 1961 samples; the path itself sits 0.01 half-spans down there and the kite -2.35° under it
    az_60_80_pct: 2.25              # kite below the path's elevation centre [deg], over 1793 samples; the path itself sits -0.02 half-spans down there and the kite -2.48° under it
    az_80_100_pct: 0.49             # kite below the path's elevation centre [deg], over 2941 samples; the path itself sits -0.06 half-spans down there and the kite -1.01° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 5.02             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [4.41, 4.89, 5.75, 5.62, 4.41] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 23.71     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 14.62  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 15.5            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 18.58         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 7.83     # reach margin: flew 24.43° against the 16.60° required by min_span_frac = 0.70, +47 %
    azimuth_reach_neg_deg: 7.73     # reach margin: flew 24.33° against the 16.60° required by min_span_frac = 0.70, +47 %
    elevation_span_deg: 5.83        # reach margin: flew 16.07° against the 10.24° required by min_span_frac = 0.70, +57 %
    tightest: "elevation span"      # the size criterion with the least room, +5.83° (+57 %) — what the NEXT lift has to spend
