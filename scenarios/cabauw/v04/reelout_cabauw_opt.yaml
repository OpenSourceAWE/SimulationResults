    az_80_100_pct: 1.28             # kite below the path's elevation centre [deg], over 2495 samples; the path itself sits 0.15 half-spans down there and the kite -0.81° under it
    centre_to_lobe_deg: 0.02        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.0              # rigid lift the path in the air actually carries — el_offset_final once it has been delivered [deg]
