    az_amplitude_deg: 22.8          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 25.2             # centre elevation of the path [deg]
    el_height_deg: 12.6             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
