    azimuth_reach_neg_deg: 5.08     # reach margin: flew 18.82° against the 13.74° required by min_span_frac = 0.70, +37 %
    elevation_span_deg: 4.43        # reach margin: flew 10.79° against the 6.36° required by min_span_frac = 0.70, +70 %
