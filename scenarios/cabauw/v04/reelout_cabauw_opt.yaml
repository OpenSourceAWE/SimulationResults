      t_092.6_s: 10.6               # wall time from the first request to the verdict (installed), every retry included, at L = 310 m [s]
      t_113.0_s: 8.8                # wall time from the first request to the verdict (installed), every retry included, at L = 357 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
