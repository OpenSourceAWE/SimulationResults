      t_056.1_s: "installed — margin 1.06 (phase 5: 1.18 at 380 m), clearance 79.1 m, size x0.91, 6553 W predicted" # at L = 227 m
      t_075.9_s: "installed — margin 1.03 (phase 5: 0.96 at 380 m), clearance 96.7 m, size x0.93, 7235 W predicted" # at L = 271 m
