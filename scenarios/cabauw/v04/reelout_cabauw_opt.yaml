    final_fallback_t: 127.7         # when phase 5's path fell back to an earlier install (final_margin_min) [s]
    final_fallback_to_t: 0.0        # install time of the path it fell back to; 0 = the startup path [s]
    margin_final_fallback: 1.86     # phase-5 margin of that path, carrying the current lift: the one phase 5 flies [-]
