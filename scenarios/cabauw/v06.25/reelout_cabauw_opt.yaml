  settle_time: 16.0                 # time after t_start to converge [s]
  laps: 4.5                         # figure-eight laps completed
  lap_time:
    fastest: 12.9                   # shortest time for one full figure of eight — lap 1, starting at t = 18.1 s [s]
    mean: 18.4                      # mean time per full figure of eight, over 4 laps [s]
    slowest: 25.8                   # longest time for one full figure of eight — lap 4 [s]
  cross_track_deg:
    rms: 1.84                       # RMS cross-track error [deg]
    mean: 1.44                      # mean cross-track error [deg]
    max: 5.27                       # max cross-track error [deg]
  elevation_deg:
    min_settled: 15.3               # min elevation, settled window [deg]
    min_whole_run: 15.3             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 89          # peak heading rate [deg/s]
  extent:
    azimuth_deg:
      min: -23.9                    # flown azimuth reach, negative side [deg]
      max: 24.5                     # flown azimuth reach, positive side [deg]
    azimuth_pct_of_amplitude:
      min: 102                      # negative reach as % of the pattern's ±A
      max: 105                      # positive reach as % of the pattern's ±A
    worst_lobe_deg:
      min: -22.9                    # weakest lobe, negative side [deg]
      max: 23.5                     # weakest lobe, positive side [deg]
    elevation_span_deg: 24.1        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 15.8    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 98     # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 6086                      # mean tether force, settled window [N]
    std: 881                        # std tether force, settled window [N]
    cv_pct: 14.5                    # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.229             # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 0 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0029         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.27     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.211   # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.229   # peak steering commanded
    rate_limited_pct_time: 0        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.182  # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
  v_app_phase4:
    duration: 69.7                  # phase-4 window length [s]
    mean_m_s: 30.38                 # mean apparent wind speed [m/s]
    min_m_s: 26.85                  # min apparent wind speed [m/s]
    max_m_s: 32.63                  # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: 12.5             # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 4.64               # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.21               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.3                # crest factor: peak / mean reel-out power over the reeling window
    duration: 71.5                  # reeling window length [s]
    n_samples: 6437                 # sample count in the reeling window
    energy_kJ: 1497.5               # energy over the reeling window [kJ]
    energy_run_kJ: 1495.3           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 6437                 # sample count in the reeling window
  ringing:
    n_peaks: 5                      # ring peaks detected above peak_floor
    period: 2.36                    # mean peak-to-peak ring period [s]
    zeta: 0.096                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.54             # first ring peak's amplitude above the local trend [m/s]
    duration: 12.0                  # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 3.51        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 3.22      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 23366              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 22089      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 22089              # 21% of the reeling window
      t_031.0_s: 23594              # 22% of the reeling window
      t_046.7_s: 23706              # 27% of the reeling window
      t_065.8_s: 23764              # 31% of the reeling window
    measured_W: 20938               # mean reel-out power the run harvested [W]
    ratio: 0.9                      # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # startup_retry_el_offsets entry the startup solve converged from after a 422; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.6             # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.436              # optimizer's l_dp [m]; rel_depower equivalent 0.268 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_031.0_s: 1.488              # optimizer's l_dp [m]; rel_depower equivalent 0.279 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_046.7_s: 1.529              # optimizer's l_dp [m]; rel_depower equivalent 0.287 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_065.8_s: 1.556              # optimizer's l_dp [m]; rel_depower equivalent 0.292 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: -1.0             # centre azimuth of the path [deg]
    az_amplitude_deg: 23.2          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 27.5             # centre elevation of the path [deg]
    el_height_deg: 13.9             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 17.64    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.609        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    c1_pattern: 0.2494              # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own under fly_opt_depower), not depower_setpoint's [1/m]
    gain_scale_flown: 0.975         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 0.91              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.31                # curvature margin at reelout_l_max [-]
    c1_final: 0.1655                # turn-rate gain at depower_final [1/m]
    margin_final: 1.53              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 1.48        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 3                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 11.1                   # wall time the simulation was frozen waiting for replies [s]
    installed: 3                    # new paths actually flown
    cycle_wall:
      t_031.0_s: 4.8                # wall time from the first request to the verdict (installed), every retry included, at L = 197 m [s]
      t_046.7_s: 3.6                # wall time from the first request to the verdict (installed), every retry included, at L = 250 m [s]
      t_065.8_s: 3.5                # wall time from the first request to the verdict (installed), every retry included, at L = 314 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_031.0_s: "installed — margin 1.01 (phase 5: 1.36 at 380 m), clearance 60.0 m, 23594 W predicted" # at L = 197 m
      t_046.7_s: "installed — margin 1.19 (phase 5: 1.30 at 380 m), clearance 75.4 m, 23706 W predicted" # at L = 250 m
      t_065.8_s: "installed — margin 1.65 (phase 5: 1.48 at 380 m), clearance 99.1 m, 23764 W predicted" # at L = 314 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 1.04                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [0.39, 0.73, 1.32, 1.66, 1.13] # the learnt correction per band, crossing first [deg]
    lift_deg: 3.0                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t: 78.6                    # when the lift actually latched [s]
    lift_remaining_m: 25.6          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_035.0_s: "blended in"       # +0.65° of shift (mean over the bands), curvature margin 1.10 vs 0.82 required
      t_050.7_s: "blended in"       # +0.39° of shift (mean over the bands), curvature margin 1.17 vs 0.82 required
      t_069.8_s: "blended in"       # +0.00° of shift (mean over the bands), curvature margin 1.73 vs 0.82 required
      t_078.6_s: "blended in"       # +3.00° of shift (mean over the bands), curvature margin 1.72 vs 0.82 required
    laps:
      lap_1: -1.24                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.24°, correction became [+0.46 +0.62 +0.75 +0.84 +0.57]° (crossing … lobe)
      lap_2: -0.73                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.36°, correction became [+0.57 +0.88 +1.28 +1.49 +0.98]° (crossing … lobe)
      lap_3: 0.05                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.96°, correction became [+0.39 +0.73 +1.32 +1.66 +1.13]° (crossing … lobe)
    lap_profiles:
      lap_1: "-0.84 -1.32 -1.52 -1.87 -0.95" # error vs the optimizer's curve per band, crossing first; 220/213/181/193/356 samples, correction now [+0.46 +0.62 +0.75 +0.84 +0.57]° (crossing … lobe)
      lap_2: "-0.08 -0.58 -1.13 -1.69 -0.43" # error vs the optimizer's curve per band, crossing first; 276/292/265/229/353 samples, correction now [+0.57 +0.88 +1.28 +1.49 +0.98]° (crossing … lobe)
      lap_3: "+0.50 +0.28 -0.18 -0.75 +0.11" # error vs the optimizer's curve per band, crossing first; 351/367/303/252/443 samples, correction now [+0.39 +0.73 +1.32 +1.66 +1.13]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 2.72              # kite below the path's elevation centre [deg], over 1738 samples; the path itself sits 0.25 half-spans down there and the kite -0.63° under it
    az_20_40_pct: 2.09              # kite below the path's elevation centre [deg], over 1751 samples; the path itself sits 0.10 half-spans down there and the kite -1.28° under it
    az_40_60_pct: 2.3               # kite below the path's elevation centre [deg], over 1422 samples; the path itself sits 0.04 half-spans down there and the kite -2.04° under it
    az_60_80_pct: 2.51              # kite below the path's elevation centre [deg], over 1223 samples; the path itself sits 0.03 half-spans down there and the kite -2.34° under it
    az_80_100_pct: 0.08             # kite below the path's elevation centre [deg], over 2131 samples; the path itself sits -0.09 half-spans down there and the kite -0.87° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 4.04             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [3.39, 3.73, 4.32, 4.66, 4.13] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 23.44     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 16.82  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 15.3            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 17.73         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 8.1      # reach margin: flew 24.51° against the 16.41° required by min_span_frac = 0.70, +49 %
    azimuth_reach_neg_deg: 7.59     # reach margin: flew 24.00° against the 16.41° required by min_span_frac = 0.70, +46 %
    elevation_span_deg: 4.76        # reach margin: flew 16.53° against the 11.77° required by min_span_frac = 0.70, +40 %
    tightest: "elevation span"      # the size criterion with the least room, +4.76° (+40 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 52.7                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 46.4               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 9.5    # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 6.25            # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 1                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0408               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 8000.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
performance:
  sim_time: 109.9                   # simulated time [s]
  wall_time: 32.8                   # wall-clock time [s]
  total_wall_time: 111.3            # the whole script: package loading, init, settling, the startup solve and the run, up to this summary — the archive copy and any plots follow it [s]
  optimization_time: 21.0           # wall time waiting for the optimizer: the startup solve (9.9 s) plus every blocking re-optimization (traj_opt.reopt.blocked) [s]
  max_optimization_time: 9.9        # longest wall time to compute a new figure of eight, retries included: the startup solve; the slowest re-optimization took 4.8 s [s]
