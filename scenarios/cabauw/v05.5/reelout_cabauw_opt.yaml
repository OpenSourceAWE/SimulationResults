      t_077.5_s: "blended in"       # -0.05° of shift (mean over the bands), curvature margin 1.03 vs 0.82 required
      t_082.6_s: "blended in"       # +3.00° of shift (mean over the bands), curvature margin 1.05 vs 0.82 required
      t_117.8_s: "held back"        # +0.37° of shift (mean over the bands), curvature margin 0.74 vs 0.82 required
    laps:
