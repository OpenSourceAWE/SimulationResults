  settle_time: 17.3                 # time after t_start to converge [s]
  laps: 4.0                         # figure-eight laps completed
  lap_time:
    fastest: 14.2                   # shortest time for one full figure of eight — lap 1, starting at t = 19.6 s [s]
    mean: 16.0                      # mean time per full figure of eight, over 4 laps [s]
    slowest: 18.4                   # longest time for one full figure of eight — lap 4 [s]
  cross_track_deg:
    rms: 1.0                        # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 0.83                      # mean cross-track error vs the unlifted optimizer path [deg]
    max: 4.95                       # max cross-track error vs the unlifted optimizer path [deg]
  elevation_deg:
    min_settled: 14.7               # min elevation, settled window [deg]
    min_whole_run: 12.9             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 90          # peak heading rate [deg/s]
  extent:
    azimuth_deg:
      min: -19.3                    # flown azimuth reach, negative side [deg]
      max: 19.3                     # flown azimuth reach, positive side [deg]
    azimuth_pct_of_amplitude:
      min: 100                      # negative reach as % of the pattern's ±A
      max: 104                      # positive reach as % of the pattern's ±A
    worst_lobe_deg:
      min: -17.6                    # weakest lobe, negative side [deg]
      max: 17.8                     # weakest lobe, positive side [deg]
    elevation_span_deg: 16.4        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 12.7    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 127    # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 5930                      # mean tether force, settled window [N]
    std: 334                        # std tether force, settled window [N]
    cv_pct: 5.6                     # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.297             # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 0 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0027         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.38     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.293   # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.297   # peak steering commanded
    rate_limited_pct_time: 2        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
  v_app_phase4:
    duration: 71.4                  # phase-4 window length [s]
    mean_m_s: 25.72                 # mean apparent wind speed [m/s]
    min_m_s: 22.96                  # min apparent wind speed [m/s]
    max_m_s: 28.26                  # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: -4.7             # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 4.28               # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.12               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.21               # crest factor: peak / mean reel-out power over the reeling window
    duration: 67.0                  # reeling window length [s]
    n_samples: 6030                 # sample count in the reeling window
    energy_kJ: 1244.0               # energy over the reeling window [kJ]
    energy_run_kJ: 1362.8           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 6692                 # sample count in the reeling window
  ringing:
    n_peaks: 4                      # ring peaks detected above peak_floor
    period: 3.34                    # mean peak-to-peak ring period [s]
    zeta: 0.068                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.3              # first ring peak's amplitude above the local trend [m/s]
    duration: 20.0                  # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 3.17        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 3.19      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 18512              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 14821      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 14821              # 25% of the reeling window
      t_033.8_s: 17576              # 23% of the reeling window
      t_049.1_s: 19758              # 24% of the reeling window
      t_065.2_s: 21598              # 28% of the reeling window
    measured_W: 18567               # mean reel-out power the run harvested [W]
    ratio: 1.0                      # measured / predicted, against the weighted prediction
  guess:
    a_deg: 25.2                     # width of the guess lemniscate, fitted into the startup box; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak, fitted into the startup box [deg]
    el_center_deg: 29.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # offset of the seed the startup solve converged from after a 422 — a startup_retry_el_offsets entry, or a whole degree walked outward past them when the failure cache rejected the listed ones; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.6             # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.428              # optimizer's l_dp [m]; rel_depower equivalent 0.273 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_033.8_s: 1.422              # optimizer's l_dp [m]; rel_depower equivalent 0.273 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_049.1_s: 1.419              # optimizer's l_dp [m]; rel_depower equivalent 0.272 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_065.2_s: 1.423              # optimizer's l_dp [m]; rel_depower equivalent 0.273 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_087.7_s: 1.47               # optimizer's l_dp [m]; rel_depower equivalent 0.280 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.2733             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
      t_033.8_s: 0.2725             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
      t_049.1_s: 0.272              # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
      t_065.2_s: 0.2726             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
      t_087.7_s: 0.2795             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: -0.0             # centre azimuth of the path [deg]
    az_amplitude_deg: 20.9          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 25.0             # centre elevation of the path [deg]
    el_height_deg: 12.2             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 16.06    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.391        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 25.11 # reel-out per lap ASSUMED for the startup request, fitted to the wind; the only request with no reply to measure it off [m]
    c1_pattern: 0.2372              # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own), not depower_setpoint's [1/m]
    gain_scale_flown: 0.998         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 1.05              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.67                # curvature margin at reelout_l_max [-]
    c1_final: 0.1626                # turn-rate gain at depower_final [1/m]
    margin_final: 1.82              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.66        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
    final_fallback_t: 100.2         # when phase 5's path fell back to an earlier install (final_margin_min) [s]
    final_fallback_to_t: 0.0        # install time of the path it fell back to; 0 = the startup path [s]
    margin_final_fallback: 1.83     # phase-5 margin of that path, carrying the current lift: the one phase 5 flies [-]
  reopt:
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 43.8                   # wall time the simulation was frozen waiting for replies [s]
    cache_hits: 1                   # optimizer steps, startup included, served from the solution or failure cache (OptChain) without asking the server
    cache_misses: 4                 # optimizer steps sent to the server
    cache_rebuilds: 1               # server sessions rebuilt from the cache before a miss
    replayed_from: ""               # scenario whose optimizer results were flown instead of asking the optimizer (`replay_paths`); empty for a normal run
    installed: 4                    # new paths actually flown
    cycle_wall:
      t_033.8_s: 18.9               # wall time from the first request to the verdict (installed), every retry included, at L = 198 m [s]
      t_049.1_s: 8.6                # wall time from the first request to the verdict (installed), every retry included, at L = 246 m [s]
      t_065.2_s: 20.1               # wall time from the first request to the verdict (installed), every retry included, at L = 299 m [s]
      t_087.7_s: 7.0                # wall time from the first request to the verdict (installed), every retry included, at L = 373 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    challenges: 0                   # cold challenger solves run against an accepted reply that grew by more than challenge_growth while predicting less than the previous install
    challenges_won: 0               # challengers installed instead of the reply they challenged
    events:
      t_033.8_s: "installed — margin 1.12 (phase 5: 1.47 at 380 m), clearance 67.8 m, size x0.88, 17576 W predicted" # at L = 198 m
      t_049.1_s: "installed — margin 1.14 (phase 5: 1.20 at 380 m), clearance 87.8 m, size x0.92, 19758 W predicted" # at L = 246 m
      t_065.2_s: "installed — margin 1.16 (phase 5: 1.01 at 380 m), clearance 113.5 m, size x1.04, 21598 W predicted" # at L = 299 m
      t_087.7_s: "installed — margin 0.92 (phase 5: 0.66 at 380 m), clearance 159.2 m, size x0.75, 22329 W predicted" # at L = 373 m
  el_lift:
    lift_deg: 1.0                   # el_offset_final, the fixed lift of the path once reel-out ends [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 0.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the units el_offset_wing_az/_blend are read in
    wing_az_deg: 10.0               # azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg or fraction of A]
    lift_t: 81.7                    # when the lift actually latched [s]
    lift_remaining_m: 26.3          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_081.7_s: "blended in"       # +1.00° of shift, curvature margin 1.33 vs 0.82 required
  droop_profile:
    az_00_20_pct: 0.5               # kite below the path's elevation centre [deg], over 1177 samples; the path itself sits 0.36 half-spans down there and the kite 1.13° under it
    az_20_40_pct: -1.0              # kite below the path's elevation centre [deg], over 1608 samples; the path itself sits 0.42 half-spans down there and the kite 2.62° under it
    az_40_60_pct: -2.67             # kite below the path's elevation centre [deg], over 1485 samples; the path itself sits -0.01 half-spans down there and the kite 2.86° under it
    az_60_80_pct: -22.43            # kite below the path's elevation centre [deg], over 3357 samples; the path itself sits -0.65 half-spans down there and the kite 19.15° under it
    az_80_100_pct: 0.32             # kite below the path's elevation centre [deg], over 1505 samples; the path itself sits -0.04 half-spans down there and the kite -0.48° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.0              # rigid lift the path in the air actually carries — el_offset_final once it has been delivered [deg]
    commanded_az_amp_deg: 18.42     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 9.67   # mean commanded pattern height [deg]
    wing_deg: 0.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 12.9            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 40.62         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 6.31     # reach margin: flew 19.20° against the 12.89° required by min_span_frac = 0.70, +49 %
    azimuth_reach_neg_deg: 5.52     # reach margin: flew 18.42° against the 12.89° required by min_span_frac = 0.70, +43 %
    elevation_span_deg: 5.47        # reach margin: flew 12.24° against the 6.77° required by min_span_frac = 0.70, +81 %
    tightest: "elevation span"      # the size criterion with the least room, +5.47° (+81 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 48.7                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 33.6               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 20.79  # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 5.5             # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 1                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    k_v_flown: 0.0408               # k_v the run actually flew
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 7200.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 1.00 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
performance:
  sim_time: 121.0                   # simulated time [s]
  wall_time: 84.0                   # wall-clock time [s]
  total_wall_time: 89.5             # the whole script: package loading, init, settling, the startup solve and the run, up to this summary — the archive copy and any plots follow it [s]
  optimization_time: 44.2           # wall time waiting for the optimizer: the startup solve (0.4 s) plus every blocking re-optimization (traj_opt.reopt.blocked) [s]
  max_optimization_time: 20.1       # longest wall time to compute a new figure of eight, retries included: the re-optimization at t = 65.2 s (installed, L = 299 m); the startup solve took 0.4 s [s]
