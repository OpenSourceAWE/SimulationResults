  steering:
    peak_abs_u_s: 0.32              # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 3 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.006          # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.42     # high-frequency std of heading rate [deg/s]
  tape:
