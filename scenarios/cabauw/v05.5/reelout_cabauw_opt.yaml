  max_optimization_time: 9.6        # longest wall time to compute a new figure of eight, retries included: the startup solve; the slowest re-optimization took 6.7 s [s]
  realtime_factor: 3.68             # sim_time / wall_time, excluding time frozen for re-optimization
  ms_per_step: 3.0                  # wall time per step, excluding time frozen for re-optimization [ms]
  steps: 10809                      # step count
  dt: 0.011111111111111112          # simulation timestep [s]
  vsm_interval: 10                  # VSM aerodynamic update interval [steps]
