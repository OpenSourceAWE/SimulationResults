    fastest: 12.5                   # shortest time for one full figure of eight — lap 1, starting at t = 18.7 s [s]
    mean: 17.5                      # mean time per full figure of eight, over 7 laps [s]
    slowest: 23.5                   # longest time for one full figure of eight — lap 7 [s]
  cross_track_deg:
    rms: 2.05                       # RMS cross-track error [deg]
    mean: 1.53                      # mean cross-track error [deg]
    max: 5.96                       # max cross-track error [deg]
  elevation_deg:
    min_settled: 15.3               # min elevation, settled window [deg]
    min_whole_run: 15.3             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 105         # peak heading rate [deg/s]
  extent:
