      t_032.2_s: 1.424              # optimizer's l_dp [m]; rel_depower equivalent 0.266 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_046.1_s: 1.42               # optimizer's l_dp [m]; rel_depower equivalent 0.265 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_060.4_s: 1.421              # optimizer's l_dp [m]; rel_depower equivalent 0.265 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_076.0_s: 1.431              # optimizer's l_dp [m]; rel_depower equivalent 0.267 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.2667             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_032.2_s: 0.2658             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_046.1_s: 0.2649             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_060.4_s: 0.2653             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_076.0_s: 0.2673             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.0              # centre azimuth of the path [deg]
    az_amplitude_deg: 21.1          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 25.9             # centre elevation of the path [deg]
    el_height_deg: 13.2             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 14.94    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.499        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    c1_pattern: 0.2526              # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own under fly_opt_depower), not depower_setpoint's [1/m]
    gain_scale_flown: 0.971         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 1.21              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 3.06                # curvature margin at reelout_l_max [-]
    c1_final: 0.1656                # turn-rate gain at depower_final [1/m]
    margin_final: 1.97              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.81        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
    final_fallback_t: 88.9          # when phase 5's path fell back to an earlier install (final_margin_min) [s]
    final_fallback_to_t: 0.0        # install time of the path it fell back to; 0 = the startup path [s]
    margin_final_fallback: 2.0      # phase-5 margin of that path, carrying the current lift: the one phase 5 flies [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 15.1                   # wall time the simulation was frozen waiting for replies [s]
    cache_hits: 2                   # optimizer steps, startup included, served from the solution or failure cache (OptChain) without asking the server
    cache_misses: 3                 # optimizer steps sent to the server
    cache_rebuilds: 1               # server sessions rebuilt from the cache before a miss
    replayed_from: ""               # scenario whose optimizer results were flown instead of asking the optimizer (REPLAY_PATHS); empty for a normal run
    installed: 4                    # new paths actually flown
    cycle_wall:
      t_032.2_s: 0.1                # wall time from the first request to the verdict (installed), every retry included, at L = 193 m [s]
      t_046.1_s: 11.9               # wall time from the first request to the verdict (installed), every retry included, at L = 237 m [s]
      t_060.4_s: 4.5                # wall time from the first request to the verdict (installed), every retry included, at L = 284 m [s]
      t_076.0_s: 6.5                # wall time from the first request to the verdict (installed), every retry included, at L = 335 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_032.2_s: "installed — margin 1.14 (phase 5: 1.47 at 380 m), clearance 67.6 m, size x0.91, 17290 W predicted" # at L = 193 m
      t_046.1_s: "installed — margin 1.12 (phase 5: 1.17 at 380 m), clearance 86.2 m, size x0.91, 19415 W predicted" # at L = 237 m
      t_060.4_s: "installed — margin 1.14 (phase 5: 1.00 at 380 m), clearance 107.7 m, size x0.97, 21172 W predicted" # at L = 284 m
      t_076.0_s: "installed — margin 1.09 (phase 5: 0.81 at 380 m), clearance 131.4 m, size x1.11, 22417 W predicted" # at L = 335 m
  el_lift:
    lift_deg: 1.0                   # el_offset_final, the fixed lift of the path once reel-out ends [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.0                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the units el_offset_wing_az/_blend are read in
    wing_az_deg: 10.0               # azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg or fraction of A]
    lift_t: 81.4                    # when the lift actually latched [s]
    lift_remaining_m: 27.0          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_082.0_s: "blended in"       # +1.00° of shift, curvature margin 1.17 vs 0.82 required
  droop_profile:
    az_00_20_pct: 2.25              # kite below the path's elevation centre [deg], over 1816 samples; the path itself sits 0.44 half-spans down there and the kite -0.13° under it
    az_20_40_pct: 1.39              # kite below the path's elevation centre [deg], over 1873 samples; the path itself sits 0.21 half-spans down there and the kite -0.51° under it
    az_40_60_pct: 1.34              # kite below the path's elevation centre [deg], over 1605 samples; the path itself sits 0.05 half-spans down there and the kite -1.18° under it
    az_60_80_pct: 1.81              # kite below the path's elevation centre [deg], over 1494 samples; the path itself sits 0.06 half-spans down there and the kite -1.52° under it
    az_80_100_pct: 0.64             # kite below the path's elevation centre [deg], over 2359 samples; the path itself sits 0.00 half-spans down there and the kite -0.67° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.0              # rigid lift the path in the air actually carries — el_offset_final once it has been delivered [deg]
    commanded_az_amp_deg: 19.69     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 10.52  # mean commanded pattern height [deg]
    wing_deg: 1.0                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 16.5            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 18.64         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 6.52     # reach margin: flew 20.30° against the 13.79° required by min_span_frac = 0.70, +47 %
    azimuth_reach_neg_deg: 6.61     # reach margin: flew 20.39° against the 13.79° required by min_span_frac = 0.70, +48 %
    elevation_span_deg: 5.31        # reach margin: flew 12.68° against the 7.36° required by min_span_frac = 0.70, +72 %
    tightest: "elevation span"      # the size criterion with the least room, +5.31° (+72 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 49.7                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 42.6               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 20.31  # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 5.5             # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 1                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0408               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 7200.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 1.00 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
