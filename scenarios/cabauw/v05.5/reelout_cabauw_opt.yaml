      t_044.9_s: 19225              # 19% of the reeling window
      t_058.9_s: 20890              # 20% of the reeling window
      t_074.1_s: 22129              # 24% of the reeling window
    measured_W: 18641               # mean reel-out power the run harvested [W]
    ratio: 0.98                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # startup_retry_el_offsets entry the startup solve converged from after a 422; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.6             # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.429              # optimizer's l_dp [m]; rel_depower equivalent 0.267 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_031.1_s: 1.424              # optimizer's l_dp [m]; rel_depower equivalent 0.266 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_044.9_s: 1.42               # optimizer's l_dp [m]; rel_depower equivalent 0.265 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_058.9_s: 1.422              # optimizer's l_dp [m]; rel_depower equivalent 0.265 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_074.1_s: 1.428              # optimizer's l_dp [m]; rel_depower equivalent 0.267 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.4              # centre azimuth of the path [deg]
    az_amplitude_deg: 20.7          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 26.0             # centre elevation of the path [deg]
    el_height_deg: 12.7             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 15.19    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.525        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    c1_pattern: 0.2508              # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own under fly_opt_depower), not depower_setpoint's [1/m]
    gain_scale_flown: 0.97          # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 0.95              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.41                # curvature margin at reelout_l_max [-]
    c1_final: 0.1655                # turn-rate gain at depower_final [1/m]
    margin_final: 1.59              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.8         # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 81.9                   # wall time the simulation was frozen waiting for replies [s]
    installed: 4                    # new paths actually flown
    cycle_wall:
      t_031.1_s: 4.2                # wall time from the first request to the verdict (installed), every retry included, at L = 188 m [s]
      t_044.9_s: 17.4               # wall time from the first request to the verdict (installed), every retry included, at L = 232 m [s]
      t_058.9_s: 54.9               # wall time from the first request to the verdict (installed), every retry included, at L = 277 m [s]
      t_074.1_s: 6.5                # wall time from the first request to the verdict (installed), every retry included, at L = 326 m [s]
    blend_retries: 2                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_031.1_s: "installed — margin 1.00 (phase 5: 1.32 at 380 m), clearance 65.2 m, 17105 W predicted" # at L = 188 m
      t_044.9_s: "installed — margin 1.03 (phase 5: 1.10 at 380 m), clearance 85.6 m, 19225 W predicted" # at L = 232 m
      t_058.9_s: "installed — margin 0.92 (phase 5: 0.83 at 380 m), clearance 109.8 m, 20890 W predicted" # at L = 277 m
      t_074.1_s: "installed — margin 1.05 (phase 5: 0.80 at 380 m), clearance 129.9 m, 22129 W predicted" # at L = 326 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 2.41                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [1.98, 2.25, 2.42, 3.13, 2.28] # the learnt correction per band, crossing first [deg]
    lift_deg: 3.0                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t: 82.8                    # when the lift actually latched [s]
    lift_remaining_m: 25.6          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_035.1_s: "blended in"       # +0.63° of shift (mean over the bands), curvature margin 1.13 vs 0.82 required
      t_048.9_s: "blended in"       # +0.51° of shift (mean over the bands), curvature margin 0.88 vs 0.82 required
      t_062.9_s: "blended in"       # +0.18° of shift (mean over the bands), curvature margin 0.94 vs 0.82 required
      t_078.1_s: "blended in"       # +0.03° of shift (mean over the bands), curvature margin 1.08 vs 0.82 required
      t_082.8_s: "blended in"       # +3.00° of shift (mean over the bands), curvature margin 1.15 vs 0.82 required
      t_117.3_s: "held back"        # +1.08° of shift (mean over the bands), curvature margin 0.72 vs 0.82 required
    laps:
      lap_1: -1.2                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.20°, correction became [+0.53 +0.62 +0.75 +0.75 +0.51]° (crossing … lobe)
      lap_2: -0.92                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.54°, correction became [+0.54 +0.93 +1.53 +1.67 +1.05]° (crossing … lobe)
      lap_3: -0.28                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.38°, correction became [+0.50 +0.99 +1.75 +2.06 +1.32]° (crossing … lobe)
      lap_4: 0.0                    # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.26°, correction became [+0.48 +0.97 +1.71 +2.14 +1.45]° (crossing … lobe)
      lap_6: -1.04                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -2.31°, correction became [+1.97 +2.25 +2.50 +3.14 +2.28]° (crossing … lobe)
      lap_7: 0.06                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -2.30°, correction became [+1.98 +2.25 +2.42 +3.13 +2.28]° (crossing … lobe)
    lap_profiles:
      lap_1: "-1.02 -1.27 -1.56 -1.62 -0.86" # error vs the optimizer's curve per band, crossing first; 221/206/176/181/338 samples, correction now [+0.53 +0.62 +0.75 +0.75 +0.51]° (crossing … lobe)
      lap_2: "+0.14 -0.65 -1.74 -2.26 -0.62" # error vs the optimizer's curve per band, crossing first; 239/258/201/198/345 samples, correction now [+0.54 +0.93 +1.53 +1.67 +1.05]° (crossing … lobe)
      lap_3: "+0.30 -0.16 -0.62 -1.31 +0.01" # error vs the optimizer's curve per band, crossing first; 250/281/199/196/333 samples, correction now [+0.50 +0.99 +1.75 +2.06 +1.32]° (crossing … lobe)
      lap_4: "+0.25 -0.02 -0.04 -0.71 +0.25" # error vs the optimizer's curve per band, crossing first; 281/330/244/185/327 samples, correction now [+0.48 +0.97 +1.71 +2.14 +1.45]° (crossing … lobe)
      lap_6: "-1.42 -1.38 -0.71 -1.39 -0.49" # error vs the optimizer's curve per band, crossing first; 459/485/420/241/512 samples, correction now [+1.97 +2.25 +2.50 +3.14 +2.28]° (crossing … lobe)
      lap_7: "+0.05 -0.12 +0.19 -0.40 +0.35" # error vs the optimizer's curve per band, crossing first; 459/485/420/242/512 samples, correction now [+1.98 +2.25 +2.42 +3.13 +2.28]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 4.7               # kite below the path's elevation centre [deg], over 2334 samples; the path itself sits 0.71 half-spans down there and the kite -1.10° under it
    az_20_40_pct: 3.97              # kite below the path's elevation centre [deg], over 2552 samples; the path itself sits 0.45 half-spans down there and the kite -1.69° under it
    az_40_60_pct: 2.23              # kite below the path's elevation centre [deg], over 2100 samples; the path itself sits 0.01 half-spans down there and the kite -2.15° under it
    az_60_80_pct: 2.73              # kite below the path's elevation centre [deg], over 1541 samples; the path itself sits -0.04 half-spans down there and the kite -2.89° under it
    az_80_100_pct: 1.63             # kite below the path's elevation centre [deg], over 2862 samples; the path itself sits 0.02 half-spans down there and the kite -1.50° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 4.35             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [3.48, 3.97, 4.71, 5.14, 4.45] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 19.68     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 10.7   # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 15.3            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
