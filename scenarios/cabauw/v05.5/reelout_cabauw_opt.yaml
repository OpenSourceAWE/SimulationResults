      lap_2: "+0.69 +0.13 -0.49 -0.93 +0.24" # error vs the optimizer's curve per band, crossing first; 224/239/203/175/339 samples, correction now [+0.13 +0.60 +1.35 +1.66 +1.14]° (crossing … lobe)
      lap_3: "+0.44 +0.07 -0.33 -0.51 +0.40" # error vs the optimizer's curve per band, crossing first; 230/279/220/191/352 samples, correction now [+0.03 +0.56 +1.41 +1.70 +1.14]° (crossing … lobe)
      lap_4: "+0.12 +0.04 +0.10 -0.08 +0.35" # error vs the optimizer's curve per band, crossing first; 260/316/265/233/364 samples, correction now [+0.08 +0.54 +1.27 +1.56 +1.13]° (crossing … lobe)
      lap_6: "-0.32 -0.23 -0.28 -0.73 -0.32" # error vs the optimizer's curve per band, crossing first; 375/466/410/357/512 samples, correction now [+0.46 +0.79 +1.51 +2.06 +1.63]° (crossing … lobe)
  droop_profile:
