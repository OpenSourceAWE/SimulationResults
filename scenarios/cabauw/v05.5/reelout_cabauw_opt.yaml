    azimuth_reach_pos_deg: 6.55     # reach margin: flew 20.33° against the 13.77° required by min_span_frac = 0.70, +48 %
    azimuth_reach_neg_deg: 6.54     # reach margin: flew 20.31° against the 13.77° required by min_span_frac = 0.70, +47 %
    elevation_span_deg: 4.25        # reach margin: flew 11.74° against the 7.49° required by min_span_frac = 0.70, +57 %
