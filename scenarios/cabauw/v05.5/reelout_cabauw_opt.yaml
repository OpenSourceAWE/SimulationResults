      t_032.2_s: 17290              # 19% of the reeling window
      t_046.1_s: 19415              # 19% of the reeling window
      t_060.4_s: 21172              # 21% of the reeling window
      t_076.0_s: 22417              # 20% of the reeling window
    measured_W: 18535               # mean reel-out power the run harvested [W]
    ratio: 0.97                     # measured / predicted, against the weighted prediction
  guess:
