  time: "17:46:19"                  # wall-clock time the run finished
  wind_speed_gnd: 5.5               # wind speed at 6 m sent to the optimizer [m/s]
  power_ratio: 0.97                 # measured / predicted reel-out power [-]
  success_criteria: "all 10 passed" # pass/fail verdict vs V3Kite's success criteria
  cross_track_rms_deg: 1.51         # RMS cross-track error, settled window [deg]
  total_wall_time: 91.1             # the whole script, start to this summary [s]
  realtime_factor: 3.68             # sim_time / wall_time, excluding time frozen for re-optimization
