    final_deg: 1.29                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [0.46, 0.79, 1.51, 2.06, 1.63] # the learnt correction per band, crossing first [deg]
    seed_deg: [0.25, 0.7, 1.39, 1.64, 1.14] # the correction the run started from, remembered per project and wind speed after el_bias_seed_laps laps of the previous run; zeros = none
