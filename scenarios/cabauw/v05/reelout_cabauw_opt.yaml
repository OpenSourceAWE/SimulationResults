    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 7.01               # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.15               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.25               # crest factor: peak / mean reel-out power over the reeling window
    duration: 83.0                  # reeling window length [s]
    n_samples: 7473                 # sample count in the reeling window
    energy_kJ: 1150.4               # energy over the reeling window [kJ]
    energy_run_kJ: 1148.6           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 7473                 # sample count in the reeling window
  ringing:
    n_peaks: 4                      # ring peaks detected above peak_floor
    period: 3.81                    # mean peak-to-peak ring period [s]
    zeta: 0.136                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.37             # first ring peak's amplitude above the local trend [m/s]
    duration: 20.0                  # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 3.03        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 2.86      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 14102              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 10830      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 10830              # 19% of the reeling window
      t_032.4_s: 12499              # 18% of the reeling window
      t_047.1_s: 14037              # 19% of the reeling window
      t_062.6_s: 15377              # 20% of the reeling window
      t_078.9_s: 16508              # 21% of the reeling window
      t_095.9_s: 17343              # 5% of the reeling window
    measured_W: 13855               # mean reel-out power the run harvested [W]
    ratio: 0.98                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # offset of the seed the startup solve converged from after a 422 — a startup_retry_el_offsets entry, or a whole degree walked outward past them when the failure cache rejected the listed ones; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.6             # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.439              # optimizer's l_dp [m]; rel_depower equivalent 0.269 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_032.4_s: 1.431              # optimizer's l_dp [m]; rel_depower equivalent 0.267 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_047.1_s: 1.426              # optimizer's l_dp [m]; rel_depower equivalent 0.266 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_062.6_s: 1.423              # optimizer's l_dp [m]; rel_depower equivalent 0.266 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_078.9_s: 1.42               # optimizer's l_dp [m]; rel_depower equivalent 0.265 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_095.9_s: 1.424              # optimizer's l_dp [m]; rel_depower equivalent 0.266 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.2687             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_032.4_s: 0.2672             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_047.1_s: 0.2663             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_062.6_s: 0.2656             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_078.9_s: 0.265              # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_095.9_s: 0.2658             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.6              # centre azimuth of the path [deg]
    az_amplitude_deg: 21.5          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 25.4             # centre elevation of the path [deg]
    el_height_deg: 13.6             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 14.66    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.394        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    c1_pattern: 0.2506              # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own under fly_opt_depower), not depower_setpoint's [1/m]
    gain_scale_flown: 0.979         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 1.05              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.67                # curvature margin at reelout_l_max [-]
    c1_final: 0.1655                # turn-rate gain at depower_final [1/m]
    margin_final: 1.77              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.6         # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 5                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 24.1                   # wall time the simulation was frozen waiting for replies [s]
    installed: 5                    # new paths actually flown
    cycle_wall:
      t_032.4_s: 5.6                # wall time from the first request to the verdict (installed), every retry included, at L = 187 m [s]
      t_047.1_s: 4.5                # wall time from the first request to the verdict (installed), every retry included, at L = 229 m [s]
      t_062.6_s: 5.0                # wall time from the first request to the verdict (installed), every retry included, at L = 274 m [s]
      t_078.9_s: 4.5                # wall time from the first request to the verdict (installed), every retry included, at L = 321 m [s]
      t_095.9_s: 4.5                # wall time from the first request to the verdict (installed), every retry included, at L = 372 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_032.4_s: "installed — margin 0.99 (phase 5: 1.31 at 380 m), clearance 63.3 m, size x0.91, 12499 W predicted" # at L = 187 m
      t_047.1_s: "installed — margin 1.03 (phase 5: 1.12 at 380 m), clearance 80.2 m, size x0.93, 14037 W predicted" # at L = 229 m
      t_062.6_s: "installed — margin 1.05 (phase 5: 0.96 at 380 m), clearance 98.4 m, size x0.92, 15377 W predicted" # at L = 274 m
      t_078.9_s: "installed — margin 1.05 (phase 5: 0.81 at 380 m), clearance 118.1 m, size x0.93, 16508 W predicted" # at L = 321 m
      t_095.9_s: "installed — margin 0.89 (lobe lift at 75 %) (phase 5: 0.60 at 380 m), clearance 142.3 m, size x0.85, 17343 W predicted" # at L = 372 m
  el_lift:
    lift_deg: 1.0                   # el_offset_final, the fixed lift of the path once reel-out ends [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.0                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the units el_offset_wing_az/_blend are read in
    wing_az_deg: 10.0               # azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg or fraction of A]
    lift_t: 90.7                    # when the lift actually latched [s]
    lift_remaining_m: 23.8          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_090.7_s: "blended in"       # +1.00° of shift, curvature margin 1.18 vs 0.82 required
  droop_profile:
    az_00_20_pct: 1.72              # kite below the path's elevation centre [deg], over 1790 samples; the path itself sits 0.36 half-spans down there and the kite -0.24° under it
    az_20_40_pct: 1.84              # kite below the path's elevation centre [deg], over 1893 samples; the path itself sits 0.28 half-spans down there and the kite -0.72° under it
    az_40_60_pct: 2.18              # kite below the path's elevation centre [deg], over 1824 samples; the path itself sits 0.17 half-spans down there and the kite -1.46° under it
    az_60_80_pct: 2.78              # kite below the path's elevation centre [deg], over 1678 samples; the path itself sits 0.17 half-spans down there and the kite -1.98° under it
    az_80_100_pct: 1.49             # kite below the path's elevation centre [deg], over 2676 samples; the path itself sits 0.11 half-spans down there and the kite -1.00° under it
    centre_to_lobe_deg: 1.06        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.0              # rigid lift the path in the air actually carries — el_offset_final once it has been delivered [deg]
    commanded_az_amp_deg: 16.91     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 9.53   # mean commanded pattern height [deg]
    wing_deg: 1.0                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 16.1            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 18.13         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 6.29     # reach margin: flew 18.13° against the 11.84° required by min_span_frac = 0.70, +53 %
    azimuth_reach_neg_deg: 6.2      # reach margin: flew 18.04° against the 11.84° required by min_span_frac = 0.70, +52 %
    elevation_span_deg: 3.56        # reach margin: flew 10.23° against the 6.67° required by min_span_frac = 0.70, +53 %
    tightest: "elevation span"      # the size criterion with the least room, +3.56° (+53 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 47.9                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 42.3               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 19.46  # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 5.0             # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 1                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0408               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 7900.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
