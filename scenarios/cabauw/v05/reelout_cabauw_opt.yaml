      max: 14.7                     # weakest lobe, positive side [deg]
    elevation_span_deg: 16.6        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 10.5    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 104    # flown span as % of the B commanded where it was flown
