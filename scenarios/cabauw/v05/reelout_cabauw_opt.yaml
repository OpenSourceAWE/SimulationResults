      t_091.4_s: "blended in (25 % of the mean, 0 % of the spread)" # +0.75° of shift (mean over the bands), curvature margin 0.83 vs 0.82 required
      t_095.4_s: "blended in (75 % of the mean, 0 % of the spread)" # +1.69° of shift (mean over the bands), curvature margin 0.83 vs 0.82 required
      t_099.4_s: "blended in"       # +0.56° of shift (mean over the bands), curvature margin 0.82 vs 0.82 required
    laps:
      lap_1: -1.22                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.22°, correction became [+0.47 +0.62 +0.79 +0.81 +0.54]° (crossing … lobe)
      lap_2: -0.84                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.46°, correction became [+0.48 +0.90 +1.50 +1.64 +1.03]° (crossing … lobe)
      lap_3: -0.1                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.16°, correction became [+0.42 +0.91 +1.66 +1.87 +1.17]° (crossing … lobe)
      lap_4: 0.12                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.02°, correction became [+0.32 +0.79 +1.61 +1.97 +1.25]° (crossing … lobe)
      lap_6: -0.76                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.85°, correction became [+1.06 +1.63 +2.48 +3.17 +1.95]° (crossing … lobe)
    lap_profiles:
      lap_1: "-0.87 -1.28 -1.64 -1.77 -0.89" # error vs the optimizer's curve per band, crossing first; 247/234/189/197/347 samples, correction now [+0.47 +0.62 +0.79 +0.81 +0.54]° (crossing … lobe)
      lap_2: "+0.16 -0.61 -1.61 -2.06 -0.55" # error vs the optimizer's curve per band, crossing first; 263/285/223/212/362 samples, correction now [+0.48 +0.90 +1.50 +1.64 +1.03]° (crossing … lobe)
      lap_3: "+0.35 -0.04 -0.54 -0.92 +0.21" # error vs the optimizer's curve per band, crossing first; 306/344/244/206/386 samples, correction now [+0.42 +0.91 +1.66 +1.87 +1.17]° (crossing … lobe)
      lap_4: "+0.40 +0.23 -0.07 -0.76 +0.39" # error vs the optimizer's curve per band, crossing first; 285/358/266/185/365 samples, correction now [+0.32 +0.79 +1.61 +1.97 +1.25]° (crossing … lobe)
      lap_6: "-0.62 -0.91 -0.90 -1.68 -0.23" # error vs the optimizer's curve per band, crossing first; 358/420/293/179/409 samples, correction now [+1.06 +1.63 +2.48 +3.17 +1.95]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 3.03              # kite below the path's elevation centre [deg], over 2047 samples; the path itself sits 0.54 half-spans down there and the kite -0.53° under it
    az_20_40_pct: 2.96              # kite below the path's elevation centre [deg], over 2329 samples; the path itself sits 0.37 half-spans down there and the kite -1.29° under it
