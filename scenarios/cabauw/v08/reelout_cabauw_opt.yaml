  realtime_factor: 4.12             # sim_time / wall_time, excluding time frozen for re-optimization
  ms_per_step: 2.7                  # wall time per step, excluding time frozen for re-optimization [ms]
  steps: 9721                       # step count
  dt: 0.011111111111111112          # simulation timestep [s]
  vsm_interval: 10                  # VSM aerodynamic update interval [steps]
summary:
