      t_031.2_s: 1.717              # optimizer's l_dp [m]; rel_depower equivalent 0.324 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_048.0_s: 1.739              # optimizer's l_dp [m]; rel_depower equivalent 0.329 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
