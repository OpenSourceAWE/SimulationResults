  time: "18:05:19"                  # wall-clock time the run finished
  wind_speed_gnd: 8.0               # wind speed at 6 m sent to the optimizer [m/s]
  power_ratio: 0.93                 # measured / predicted reel-out power [-]
  success_criteria: "all 10 passed" # pass/fail verdict vs V3Kite's success criteria
  cross_track_rms_deg: 1.45         # RMS cross-track error, settled window [deg]
  total_wall_time: 58.7             # the whole script, start to this summary [s]
