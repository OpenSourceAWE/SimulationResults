      t_048.0_s: 24100              # 35% of the reeling window
      t_072.5_s: 24163              # 21% of the reeling window
    measured_W: 21728               # mean reel-out power the run harvested [W]
    ratio: 0.91                     # measured / predicted, against the weighted prediction
