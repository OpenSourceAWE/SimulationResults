    el_min_final_deg: 14.05         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 8.17     # reach margin: flew 21.84° against the 13.67° required by min_span_frac = 0.70, +60 %
    azimuth_reach_neg_deg: 7.67     # reach margin: flew 21.35° against the 13.67° required by min_span_frac = 0.70, +56 %
    elevation_span_deg: 7.93        # reach margin: flew 22.12° against the 14.19° required by min_span_frac = 0.70, +56 %
