      t_031.5_s: 1.727              # optimizer's l_dp [m]; rel_depower equivalent 0.326 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_046.9_s: 1.746              # optimizer's l_dp [m]; rel_depower equivalent 0.330 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_064.4_s: 1.755              # optimizer's l_dp [m]; rel_depower equivalent 0.332 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_086.5_s: 1.785              # optimizer's l_dp [m]; rel_depower equivalent 0.338 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.3207             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_031.5_s: 0.3264             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_046.9_s: 0.3303             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_064.4_s: 0.332              # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_086.5_s: 0.3381             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.0              # centre azimuth of the path [deg]
    az_amplitude_deg: 21.9          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 28.1             # centre elevation of the path [deg]
    el_height_deg: 22.1             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 75               # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 22.03    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.365        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    c1_pattern: 0.1944              # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own under fly_opt_depower), not depower_setpoint's [1/m]
    gain_scale_flown: 1.263         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 0.82              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.09                # curvature margin at reelout_l_max [-]
    c1_final: 0.1655                # turn-rate gain at depower_final [1/m]
    margin_final: 1.77              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.8         # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 21.6                   # wall time the simulation was frozen waiting for replies [s]
    installed: 4                    # new paths actually flown
    cycle_wall:
      t_031.5_s: 4.1                # wall time from the first request to the verdict (installed), every retry included, at L = 197 m [s]
      t_046.9_s: 4.5                # wall time from the first request to the verdict (installed), every retry included, at L = 249 m [s]
      t_064.4_s: 4.0                # wall time from the first request to the verdict (installed), every retry included, at L = 308 m [s]
      t_086.5_s: 9.0                # wall time from the first request to the verdict (installed), every retry included, at L = 380 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_031.5_s: "installed — margin 0.96 (phase 5: 1.63 at 380 m), clearance 53.4 m, size x0.93, 23279 W predicted" # at L = 197 m
      t_046.9_s: "installed — margin 1.09 (phase 5: 1.49 at 380 m), clearance 65.2 m, size x0.97, 23434 W predicted" # at L = 249 m
      t_064.4_s: "installed — margin 1.05 (phase 5: 1.17 at 380 m), clearance 76.6 m, size x1.11, 23413 W predicted" # at L = 308 m
      t_086.5_s: "installed — margin 0.85 (lobe lift at 75 %) (phase 5: 0.80 at 380 m), clearance 95.2 m, size x0.42, 22182 W predicted" # at L = 380 m
  el_lift:
    lift_deg: 1.0                   # el_offset_final, the fixed lift of the path once reel-out ends [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.0                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the units el_offset_wing_az/_blend are read in
    wing_az_deg: 10.0               # azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg or fraction of A]
    lift_t: 77.9                    # when the lift actually latched [s]
    lift_remaining_m: 26.7          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_077.9_s: "blended in"       # +1.00° of shift, curvature margin 1.21 vs 0.82 required
  droop_profile:
    az_00_20_pct: 1.84              # kite below the path's elevation centre [deg], over 1709 samples; the path itself sits 0.21 half-spans down there and the kite -0.04° under it
    az_20_40_pct: 1.36              # kite below the path's elevation centre [deg], over 1873 samples; the path itself sits 0.10 half-spans down there and the kite -0.40° under it
    az_40_60_pct: 1.5               # kite below the path's elevation centre [deg], over 1249 samples; the path itself sits 0.03 half-spans down there and the kite -1.12° under it
    az_60_80_pct: 2.36              # kite below the path's elevation centre [deg], over 1104 samples; the path itself sits 0.10 half-spans down there and the kite -1.31° under it
    az_80_100_pct: 0.07             # kite below the path's elevation centre [deg], over 2127 samples; the path itself sits -0.04 half-spans down there and the kite -0.39° under it
    centre_to_lobe_deg: 0.52        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.0              # rigid lift the path in the air actually carries — el_offset_final once it has been delivered [deg]
    commanded_az_amp_deg: 20.22     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 20.03  # mean commanded pattern height [deg]
    wing_deg: 1.0                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 13.4            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 14.77         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 6.93     # reach margin: flew 21.08° against the 14.16° required by min_span_frac = 0.70, +49 %
    azimuth_reach_neg_deg: 7.08     # reach margin: flew 21.24° against the 14.16° required by min_span_frac = 0.70, +50 %
    elevation_span_deg: 5.69        # reach margin: flew 19.72° against the 14.02° required by min_span_frac = 0.70, +41 %
    tightest: "elevation span"      # the size criterion with the least room, +5.69° (+41 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 44.1                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 41.1               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 11.04  # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 8.0             # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 1                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0408               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 7900.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
