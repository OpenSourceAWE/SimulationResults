    mean: 15.2                      # mean time per full figure of eight, over 3 laps [s]
    slowest: 17.7                   # longest time for one full figure of eight — lap 3 [s]
  cross_track_deg:
    rms: 1.03                       # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 0.81                      # mean cross-track error vs the unlifted optimizer path [deg]
    max: 4.94                       # max cross-track error vs the unlifted optimizer path [deg]
  elevation_deg:
    min_settled: 13.8               # min elevation, settled window [deg]
    min_whole_run: 12.8             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 87          # peak heading rate [deg/s]
  extent:
