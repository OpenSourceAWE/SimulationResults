    mean: 15.7                      # mean time per full figure of eight, over 5 laps [s]
    slowest: 23.2                   # longest time for one full figure of eight — lap 4 [s]
  cross_track_deg:
    rms: 1.12                       # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 0.87                      # mean cross-track error vs the unlifted optimizer path [deg]
    max: 4.99                       # max cross-track error vs the unlifted optimizer path [deg]
  elevation_deg:
