      t_072.5_s: "installed — margin 0.94 (droop spread at 50 %, lobe lift at 0 %) (phase 5: 0.97 at 380 m), clearance 89.6 m, 24163 W predicted" # at L = 334 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 2.19                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [1.95, 2.13, 2.53, 2.93, 1.39] # the learnt correction per band, crossing first [deg]
    lift_deg: 3.0                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t: 78.2                    # when the lift actually latched [s]
    lift_remaining_m: 26.8          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_035.2_s: "blended in"       # +0.65° of shift (mean over the bands), curvature margin 0.87 vs 0.82 required
      t_052.0_s: "blended in (100 % of the mean, 0 % of the spread)" # +0.41° of shift (mean over the bands), curvature margin 0.84 vs 0.82 required
      t_056.0_s: "held back"        # +0.00° of shift (mean over the bands), curvature margin 0.59 vs 0.82 required
      t_064.4_s: "blended in (100 % of the mean, 25 % of the spread)" # +0.00° of shift (mean over the bands), curvature margin 0.82 vs 0.82 required
      t_068.5_s: "blended in (100 % of the mean, 0 % of the spread)" # +0.14° of shift (mean over the bands), curvature margin 0.85 vs 0.82 required
      t_072.5_s: "carried by an install (50 % of the spread)" # +0.00° of shift (mean over the bands), curvature margin 0.94 vs 0.82 required
      t_076.5_s: "blended in (100 % of the mean, 50 % of the spread)" # -0.00° of shift (mean over the bands), curvature margin 0.83 vs 0.82 required
      t_080.5_s: "blended in (75 % of the mean, 0 % of the spread)" # +2.25° of shift (mean over the bands), curvature margin 0.82 vs 0.82 required
      t_084.6_s: "blended in (100 % of the mean, 25 % of the spread)" # +0.75° of shift (mean over the bands), curvature margin 0.82 vs 0.82 required
    laps:
      lap_1: -1.2                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.20°, correction became [+0.55 +0.69 +0.86 +0.74 +0.43]° (crossing … lobe)
      lap_2: -0.58                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.21°, correction became [+0.41 +0.89 +1.74 +1.52 +0.73]° (crossing … lobe)
      lap_3: -0.1                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.99°, correction became [+0.43 +1.02 +1.93 +1.71 +0.87]° (crossing … lobe)
      lap_5: -0.88                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.94°, correction became [+1.95 +2.13 +2.53 +2.93 +1.39]° (crossing … lobe)
    lap_profiles:
      lap_1: "-1.05 -1.39 -1.85 -1.59 -0.66" # error vs the optimizer's curve per band, crossing first; 256/214/171/159/325 samples, correction now [+0.55 +0.69 +0.86 +0.74 +0.43]° (crossing … lobe)
      lap_2: "+0.48 -0.37 -2.17 -1.90 -0.09" # error vs the optimizer's curve per band, crossing first; 289/412/199/210/401 samples, correction now [+0.41 +0.89 +1.74 +1.52 +0.73]° (crossing … lobe)
      lap_3: "+0.21 -0.26 -0.84 -0.73 +0.26" # error vs the optimizer's curve per band, crossing first; 513/323/198/223/494 samples, correction now [+0.43 +1.02 +1.93 +1.71 +0.87]° (crossing … lobe)
      lap_5: "-1.53 -1.16 -0.60 -1.74 +0.07" # error vs the optimizer's curve per band, crossing first; 522/481/312/254/632 samples, correction now [+1.95 +2.13 +2.53 +2.93 +1.39]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 3.34              # kite below the path's elevation centre [deg], over 2501 samples; the path itself sits 0.22 half-spans down there and the kite -0.90° under it
    az_20_40_pct: 3.4               # kite below the path's elevation centre [deg], over 2057 samples; the path itself sits 0.19 half-spans down there and the kite -1.44° under it
    az_40_60_pct: 3.48              # kite below the path's elevation centre [deg], over 1213 samples; the path itself sits 0.12 half-spans down there and the kite -2.22° under it
    az_60_80_pct: 4.92              # kite below the path's elevation centre [deg], over 1157 samples; the path itself sits 0.25 half-spans down there and the kite -2.39° under it
    az_80_100_pct: 0.87             # kite below the path's elevation centre [deg], over 2414 samples; the path itself sits 0.02 half-spans down there and the kite -0.65° under it
    centre_to_lobe_deg: 1.58        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 4.19             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [3.57, 4.06, 4.79, 4.61, 3.93] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 19.53     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 20.27  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
