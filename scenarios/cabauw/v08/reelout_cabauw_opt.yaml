      min: -16.2                    # weakest lobe, negative side [deg]
      max: 13.2                     # weakest lobe, positive side [deg]
    elevation_span_deg: 22.8        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 17.2    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 105    # flown span as % of the B commanded where it was flown
