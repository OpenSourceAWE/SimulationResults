      t_048.0_s: 5.6                # wall time from the first request to the verdict (installed), every retry included, at L = 251 m [s]
      t_072.5_s: 51.3               # wall time from the first request to the verdict (installed), every retry included, at L = 334 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
