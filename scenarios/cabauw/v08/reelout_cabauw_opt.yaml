    mean: 6862                      # mean tether force, settled window [N]
    std: 488                        # std tether force, settled window [N]
    cv_pct: 7.1                     # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.32              # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 0 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0043         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.46     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.284   # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.32    # peak steering commanded
    rate_limited_pct_time: 3        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
  v_app_phase4:
    duration: 67.3                  # phase-4 window length [s]
    mean_m_s: 34.72                 # mean apparent wind speed [m/s]
    min_m_s: 31.88                  # min apparent wind speed [m/s]
    max_m_s: 39.07                  # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: 28.6             # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 5.8                # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.12               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.14               # crest factor: peak / mean reel-out power over the reeling window
    duration: 69.4                  # reeling window length [s]
    n_samples: 6242                 # sample count in the reeling window
    energy_kJ: 1509.6               # energy over the reeling window [kJ]
    energy_run_kJ: 1509.5           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 6242                 # sample count in the reeling window
  ringing:
    n_peaks: 7                      # ring peaks detected above peak_floor
    period: 2.16                    # mean peak-to-peak ring period [s]
    zeta: 0.057                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.38             # first ring peak's amplitude above the local trend [m/s]
    duration: 14.9                  # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 3.5         # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 3.33      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 23662              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 20837      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 20837              # 20% of the reeling window
      t_029.8_s: 24404              # 18% of the reeling window
      t_042.2_s: 24038              # 24% of the reeling window
      t_059.1_s: 24639              # 33% of the reeling window
      t_082.3_s: 24139              # 4% of the reeling window
    measured_W: 21766               # mean reel-out power the run harvested [W]
    ratio: 0.92                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 30.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # offset of the seed the startup solve converged from after a 422 — a startup_retry_el_offsets entry, or a whole degree walked outward past them when the failure cache rejected the listed ones; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.724              # optimizer's l_dp [m]; rel_depower equivalent 0.326 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_029.8_s: 1.718              # optimizer's l_dp [m]; rel_depower equivalent 0.325 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_042.2_s: 1.727              # optimizer's l_dp [m]; rel_depower equivalent 0.326 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_059.1_s: 1.735              # optimizer's l_dp [m]; rel_depower equivalent 0.328 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_082.3_s: 1.769              # optimizer's l_dp [m]; rel_depower equivalent 0.335 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.3259             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_029.8_s: 0.3247             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_042.2_s: 0.3265             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_059.1_s: 0.328              # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_082.3_s: 0.3349             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: -0.0             # centre azimuth of the path [deg]
    az_amplitude_deg: 22.9          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 27.9             # centre elevation of the path [deg]
    el_height_deg: 17.3             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 21.5     # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.383        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    c1_pattern: 0.191               # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own under fly_opt_depower), not depower_setpoint's [1/m]
    gain_scale_flown: 1.287         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 0.82              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.09                # curvature margin at reelout_l_max [-]
    c1_final: 0.1676                # turn-rate gain at depower_final [1/m]
    margin_final: 1.8               # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.81        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
    final_fallback_t: 91.7          # when phase 5's path fell back to an earlier install (final_margin_min) [s]
    final_fallback_to_t: 42.2       # install time of the path it fell back to; 0 = the startup path [s]
    margin_final_fallback: 1.84     # phase-5 margin of that path, carrying the current lift: the one phase 5 flies [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 64.9                   # wall time the simulation was frozen waiting for replies [s]
    cache_hits: 1                   # optimizer steps, startup included, served from the solution or failure cache (OptChain) without asking the server
    cache_misses: 5                 # optimizer steps sent to the server
    cache_rebuilds: 1               # server sessions rebuilt from the cache before a miss
    replayed_from: ""               # scenario whose optimizer results were flown instead of asking the optimizer (REPLAY_PATHS); empty for a normal run
    installed: 4                    # new paths actually flown
    cycle_wall:
      t_029.8_s: 36.5               # wall time from the first request to the verdict (installed), every retry included, at L = 195 m [s]
      t_042.2_s: 8.6                # wall time from the first request to the verdict (installed), every retry included, at L = 238 m [s]
      t_059.1_s: 13.6               # wall time from the first request to the verdict (installed), every retry included, at L = 296 m [s]
      t_082.3_s: 15.1               # wall time from the first request to the verdict (installed), every retry included, at L = 375 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_029.8_s: "installed — margin 0.91 (phase 5: 1.54 at 380 m), clearance 57.3 m, size x0.82, 24404 W predicted" # at L = 195 m
      t_042.2_s: "installed — margin 1.31 (phase 5: 1.84 at 380 m), clearance 59.7 m, size x1.25, 24038 W predicted" # at L = 238 m
      t_059.1_s: "installed — margin 1.24 (phase 5: 1.41 at 380 m), clearance 73.0 m, size x1.13, 24639 W predicted" # at L = 296 m
      t_082.3_s: "installed — margin 0.87 (phase 5: 0.81 at 380 m), clearance 104.8 m, size x0.50, 24139 W predicted" # at L = 375 m
  el_lift:
    lift_deg: 1.0                   # el_offset_final, the fixed lift of the path once reel-out ends [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.0                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the units el_offset_wing_az/_blend are read in
    wing_az_deg: 10.0               # azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg or fraction of A]
    lift_t: 75.6                    # when the lift actually latched [s]
    lift_remaining_m: 27.7          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_075.6_s: "blended in"       # +1.00° of shift, curvature margin 1.51 vs 0.82 required
  droop_profile:
    az_00_20_pct: 5.54              # kite below the path's elevation centre [deg], over 1983 samples; the path itself sits 0.53 half-spans down there and the kite -0.87° under it
    az_20_40_pct: 2.1               # kite below the path's elevation centre [deg], over 2203 samples; the path itself sits 0.13 half-spans down there and the kite -0.92° under it
    az_40_60_pct: 1.56              # kite below the path's elevation centre [deg], over 1386 samples; the path itself sits -0.01 half-spans down there and the kite -1.72° under it
    az_60_80_pct: 2.13              # kite below the path's elevation centre [deg], over 1072 samples; the path itself sits 0.06 half-spans down there and the kite -1.71° under it
    az_80_100_pct: -0.35            # kite below the path's elevation centre [deg], over 2117 samples; the path itself sits -0.09 half-spans down there and the kite -0.48° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.0              # rigid lift the path in the air actually carries — el_offset_final once it has been delivered [deg]
    commanded_az_amp_deg: 20.74     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 17.0   # mean commanded pattern height [deg]
    wing_deg: 1.0                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 12.0            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 12.56         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 7.53     # reach margin: flew 22.05° against the 14.52° required by min_span_frac = 0.70, +52 %
    azimuth_reach_neg_deg: 5.75     # reach margin: flew 20.27° against the 14.52° required by min_span_frac = 0.70, +40 %
    elevation_span_deg: 5.97        # reach margin: flew 17.87° against the 11.90° required by min_span_frac = 0.70, +50 %
    tightest: "azimuth reach neg"   # the size criterion with the least room, +5.75° (+40 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 49.5                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 34.9               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 11.02  # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 8.0             # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 1                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0408               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 7200.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 1.00 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
