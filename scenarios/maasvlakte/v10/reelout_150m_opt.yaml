    fastest: 14.4                   # shortest time for one full figure of eight — lap 1, starting at t = 18.2 s [s]
    mean: 16.9                      # mean time per full figure of eight, over 5 laps [s]
    slowest: 20.4                   # longest time for one full figure of eight — lap 4 [s]
  cross_track_deg:
    rms: 2.22                       # RMS cross-track error [deg]
    mean: 1.64                      # mean cross-track error [deg]
    max: 7.49                       # max cross-track error [deg]
  elevation_deg:
    min_settled: 10.4               # min elevation, settled window [deg]
    min_whole_run: 10.4             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 93          # peak heading rate [deg/s]
  extent:
