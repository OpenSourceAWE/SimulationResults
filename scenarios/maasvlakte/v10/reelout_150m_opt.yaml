      t_050.1_s: 25048              # 23% of the reeling window
      t_067.3_s: 25073              # 27% of the reeling window
      t_087.7_s: 23240              # 4% of the reeling window
    measured_W: 20264               # mean reel-out power the run harvested [W]
    ratio: 0.82                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: -1.0 # startup_retry_el_offsets entry the startup solve converged from after a 422; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.572              # optimizer's l_dp [m]; rel_depower equivalent 0.295 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_032.5_s: 1.574              # optimizer's l_dp [m]; rel_depower equivalent 0.296 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_050.1_s: 1.59               # optimizer's l_dp [m]; rel_depower equivalent 0.299 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_067.3_s: 1.579              # optimizer's l_dp [m]; rel_depower equivalent 0.297 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_087.7_s: 1.607              # optimizer's l_dp [m]; rel_depower equivalent 0.302 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.2954             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_032.5_s: 0.2958             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_050.1_s: 0.2989             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_067.3_s: 0.2968             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_087.7_s: 0.3024             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.2              # centre azimuth of the path [deg]
    az_amplitude_deg: 23.4          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 25.9             # centre elevation of the path [deg]
    el_height_deg: 16.9             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 50               # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 17.73    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.383        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    c1_pattern: 0.2217              # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own under fly_opt_depower), not depower_setpoint's [1/m]
    gain_scale_flown: 1.097         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 0.87              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.21                # curvature margin at reelout_l_max [-]
    c1_final: 0.1655                # turn-rate gain at depower_final [1/m]
    margin_final: 1.54              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.74        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 18.6                   # wall time the simulation was frozen waiting for replies [s]
    installed: 4                    # new paths actually flown
    cycle_wall:
      t_032.5_s: 4.7                # wall time from the first request to the verdict (installed), every retry included, at L = 199 m [s]
      t_050.1_s: 4.5                # wall time from the first request to the verdict (installed), every retry included, at L = 256 m [s]
      t_067.3_s: 4.5                # wall time from the first request to the verdict (installed), every retry included, at L = 311 m [s]
      t_087.7_s: 5.1                # wall time from the first request to the verdict (installed), every retry included, at L = 375 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_032.5_s: "installed — margin 1.18 (phase 5: 1.68 at 380 m), clearance 47.9 m, 24829 W predicted" # at L = 199 m
      t_050.1_s: "installed — margin 1.05 (phase 5: 1.19 at 380 m), clearance 59.5 m, 25048 W predicted" # at L = 256 m
      t_067.3_s: "installed — margin 1.26 (phase 5: 1.16 at 380 m), clearance 73.9 m, 25073 W predicted" # at L = 311 m
      t_087.7_s: "installed — margin 0.94 (droop spread at 25 %, lobe lift at 0 %) (phase 5: 0.74 at 380 m), clearance 91.4 m, 23240 W predicted" # at L = 375 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 0.92                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [0.55, 0.73, 1.13, 1.34, 0.84] # the learnt correction per band, crossing first [deg]
    lift_deg: 3.0                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t: 80.9                    # when the lift actually latched [s]
    lift_remaining_m: 25.7          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_036.5_s: "blended in"       # +0.52° of shift (mean over the bands), curvature margin 0.99 vs 0.82 required
      t_054.1_s: "blended in"       # +0.18° of shift (mean over the bands), curvature margin 0.94 vs 0.82 required
      t_071.3_s: "blended in"       # +0.04° of shift (mean over the bands), curvature margin 1.23 vs 0.82 required
      t_080.9_s: "blended in"       # +3.00° of shift (mean over the bands), curvature margin 1.26 vs 0.82 required
      t_087.7_s: "carried by an install (25 % of the spread)" # +0.00° of shift (mean over the bands), curvature margin 0.94 vs 0.82 required
    laps:
      lap_1: -0.95                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.95°, correction became [-0.23 +0.20 +0.78 +1.09 +0.74]° (crossing … lobe)
      lap_2: -0.39                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.96°, correction became [-0.59 +0.15 +1.17 +1.69 +1.07]° (crossing … lobe)
      lap_3: -0.01                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.73°, correction became [-0.57 +0.15 +1.29 +1.71 +1.11]° (crossing … lobe)
      lap_5: -0.12                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.88°, correction became [+0.55 +0.73 +1.13 +1.34 +0.84]° (crossing … lobe)
    lap_profiles:
      lap_1: "+0.69 -0.45 -1.68 -2.51 -1.21" # error vs the optimizer's curve per band, crossing first; 271/241/213/200/367 samples, correction now [-0.23 +0.20 +0.78 +1.09 +0.74]° (crossing … lobe)
      lap_2: "+1.10 +0.03 -0.98 -1.76 -0.21" # error vs the optimizer's curve per band, crossing first; 233/292/320/269/468 samples, correction now [-0.59 +0.15 +1.17 +1.69 +1.07]° (crossing … lobe)
      lap_3: "+0.30 -0.01 -0.51 -0.52 +0.36" # error vs the optimizer's curve per band, crossing first; 263/309/255/243/480 samples, correction now [-0.57 +0.15 +1.29 +1.71 +1.11]° (crossing … lobe)
      lap_5: "-1.09 -0.58 +0.12 +0.19 +0.46" # error vs the optimizer's curve per band, crossing first; 257/235/223/239/406 samples, correction now [+0.55 +0.73 +1.13 +1.34 +0.84]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: -1.05             # kite below the path's elevation centre [deg], over 1541 samples; the path itself sits -0.06 half-spans down there and the kite 0.21° under it
    az_20_40_pct: -0.0              # kite below the path's elevation centre [deg], over 1598 samples; the path itself sits -0.04 half-spans down there and the kite -0.57° under it
    az_40_60_pct: 2.19              # kite below the path's elevation centre [deg], over 1398 samples; the path itself sits 0.09 half-spans down there and the kite -1.60° under it
    az_60_80_pct: 3.18              # kite below the path's elevation centre [deg], over 1315 samples; the path itself sits 0.16 half-spans down there and the kite -2.11° under it
    az_80_100_pct: 2.37             # kite below the path's elevation centre [deg], over 2276 samples; the path itself sits 0.23 half-spans down there and the kite -0.86° under it
    centre_to_lobe_deg: 4.23        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 3.74             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [3.41, 3.59, 3.87, 3.98, 3.83] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 20.39     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 13.62  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 10.4            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 12.16         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 7.45     # reach margin: flew 21.72° against the 14.27° required by min_span_frac = 0.70, +52 %
    azimuth_reach_neg_deg: 7.01     # reach margin: flew 21.28° against the 14.27° required by min_span_frac = 0.70, +49 %
    elevation_span_deg: 5.61        # reach margin: flew 15.15° against the 9.53° required by min_span_frac = 0.70, +59 %
    tightest: "elevation span"      # the size criterion with the least room, +5.61° (+59 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 45.1                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 37.0               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 9.5    # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 10.0            # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.039                      # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.039                # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 8000.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
