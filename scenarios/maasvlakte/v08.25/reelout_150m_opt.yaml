      max: 16.4                     # weakest lobe, positive side [deg]
    elevation_span_deg: 20.4        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 9.7     # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 96     # flown span as % of the B commanded where it was flown
