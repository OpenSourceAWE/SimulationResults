      lap_2: "+0.76 +0.31 -0.11 -0.48 +0.21" # error vs the optimizer's curve per band, crossing first; 206/218/185/180/294 samples, correction now [+0.09 +0.37 +0.89 +1.17 +0.84]° (crossing … lobe)
      lap_3: "+0.54 +0.18 -0.25 -0.49 +0.13" # error vs the optimizer's curve per band, crossing first; 224/262/219/206/345 samples, correction now [-0.09 +0.29 +0.94 +1.25 +0.90]° (crossing … lobe)
      lap_4: "+0.03 +0.01 -0.14 -0.20 +0.25" # error vs the optimizer's curve per band, crossing first; 262/297/260/239/373 samples, correction now [-0.03 +0.30 +0.94 +1.22 +0.90]° (crossing … lobe)
      lap_6: "-0.67 -0.67 -0.78 -0.85 -0.00" # error vs the optimizer's curve per band, crossing first; 347/386/288/276/431 samples, correction now [+0.68 +0.98 +1.63 +1.84 +1.16]° (crossing … lobe)
  droop_profile:
