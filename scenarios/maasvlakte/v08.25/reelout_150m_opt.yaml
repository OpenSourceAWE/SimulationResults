  wall_time: 44.9                   # wall-clock time [s]
  total_wall_time: 61.3             # the whole script: package loading, init, settling, the startup solve and the run, up to this summary — the archive copy and any plots follow it [s]
  optimization_time: 32.8           # wall time waiting for the optimizer: the startup solve (10.7 s) plus every blocking re-optimization (traj_opt.reopt.blocked) [s]
  max_optimization_time: 10.7       # longest wall time to compute a new figure of eight, retries included: the startup solve; the slowest re-optimization took 6.0 s [s]
