    az_60_80_pct: 1.76              # kite below the path's elevation centre [deg], over 1527 samples; the path itself sits 0.00 half-spans down there and the kite -1.69° under it
    az_80_100_pct: 1.28             # kite below the path's elevation centre [deg], over 2418 samples; the path itself sits 0.10 half-spans down there and the kite -0.79° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 3.67             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
