      t_044.0_s: 5.5                # wall time from the first request to the verdict (installed), every retry included, at L = 237 m [s]
      t_058.7_s: 5.0                # wall time from the first request to the verdict (installed), every retry included, at L = 285 m [s]
      t_074.8_s: 5.0                # wall time from the first request to the verdict (installed), every retry included, at L = 337 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_030.8_s: "installed — margin 0.97 (phase 5: 1.25 at 380 m), clearance 48.8 m, 20434 W predicted" # at L = 193 m
      t_044.0_s: "installed — margin 1.03 (phase 5: 1.09 at 380 m), clearance 53.4 m, 20844 W predicted" # at L = 237 m
      t_058.7_s: "installed — margin 1.04 (phase 5: 0.91 at 380 m), clearance 61.3 m, 20840 W predicted" # at L = 285 m
      t_074.8_s: "installed — margin 1.02 (phase 5: 0.75 at 380 m), clearance 74.1 m, 20666 W predicted" # at L = 337 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 1.41                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [0.64, 1.08, 1.84, 2.13, 1.37] # the learnt correction per band, crossing first [deg]
    lift_deg: 3.0                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t: 80.1                    # when the lift actually latched [s]
    lift_remaining_m: 26.0          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_034.8_s: "blended in"       # +0.44° of shift (mean over the bands), curvature margin 1.09 vs 0.82 required
      t_048.0_s: "blended in"       # +0.26° of shift (mean over the bands), curvature margin 1.09 vs 0.82 required
      t_062.7_s: "blended in"       # +0.12° of shift (mean over the bands), curvature margin 1.02 vs 0.82 required
      t_078.8_s: "blended in"       # +0.03° of shift (mean over the bands), curvature margin 1.06 vs 0.82 required
      t_082.8_s: "blended in"       # +3.00° of shift (mean over the bands), curvature margin 1.08 vs 0.82 required
      t_110.4_s: "held back"        # +0.56° of shift (mean over the bands), curvature margin 0.55 vs 0.82 required
    laps:
      lap_1: -0.82                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.82°, correction became [+0.68 +0.60 +0.43 +0.30 +0.20]° (crossing … lobe)
      lap_2: -0.53                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.94°, correction became [+0.45 +0.67 +0.84 +0.92 +0.63]° (crossing … lobe)
      lap_3: -0.26                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.95°, correction became [+0.20 +0.58 +1.11 +1.30 +0.94]° (crossing … lobe)
      lap_4: -0.03                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.86°, correction became [+0.13 +0.55 +1.19 +1.39 +1.00]° (crossing … lobe)
      lap_6: -0.5                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.32°, correction became [+0.64 +1.08 +1.84 +2.13 +1.37]° (crossing … lobe)
    lap_profiles:
      lap_1: "-1.40 -1.22 -0.83 -0.61 -0.34" # error vs the optimizer's curve per band, crossing first; 210/200/170/180/345 samples, correction now [+0.68 +0.60 +0.43 +0.30 +0.20]° (crossing … lobe)
      lap_2: "+0.58 -0.24 -0.87 -1.44 -0.64" # error vs the optimizer's curve per band, crossing first; 210/220/188/207/362 samples, correction now [+0.45 +0.67 +0.84 +0.92 +0.63]° (crossing … lobe)
      lap_3: "+0.69 +0.13 -0.66 -1.05 -0.36" # error vs the optimizer's curve per band, crossing first; 231/249/213/241/388 samples, correction now [+0.20 +0.58 +1.11 +1.30 +0.94]° (crossing … lobe)
      lap_4: "+0.34 +0.06 -0.34 -0.47 +0.14" # error vs the optimizer's curve per band, crossing first; 254/289/245/249/408 samples, correction now [+0.13 +0.55 +1.19 +1.39 +1.00]° (crossing … lobe)
      lap_6: "-0.42 -0.53 -0.75 -1.00 -0.08" # error vs the optimizer's curve per band, crossing first; 328/388/266/251/422 samples, correction now [+0.64 +1.08 +1.84 +2.13 +1.37]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 2.2               # kite below the path's elevation centre [deg], over 1698 samples; the path itself sits 0.40 half-spans down there and the kite -0.37° under it
    az_20_40_pct: 1.9               # kite below the path's elevation centre [deg], over 1895 samples; the path itself sits 0.23 half-spans down there and the kite -0.87° under it
    az_40_60_pct: 1.36              # kite below the path's elevation centre [deg], over 1482 samples; the path itself sits -0.03 half-spans down there and the kite -1.49° under it
    az_60_80_pct: 2.0               # kite below the path's elevation centre [deg], over 1518 samples; the path itself sits 0.03 half-spans down there and the kite -1.82° under it
    az_80_100_pct: 1.58             # kite below the path's elevation centre [deg], over 2547 samples; the path itself sits 0.16 half-spans down there and the kite -0.88° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 3.85             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [3.13, 3.55, 4.19, 4.39, 4.0] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 17.25     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 9.72   # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 10.2            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 12.45         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 5.94     # reach margin: flew 18.02° against the 12.08° required by min_span_frac = 0.70, +49 %
    azimuth_reach_neg_deg: 5.97     # reach margin: flew 18.04° against the 12.08° required by min_span_frac = 0.70, +49 %
    elevation_span_deg: 3.66        # reach margin: flew 10.46° against the 6.80° required by min_span_frac = 0.70, +54 %
    tightest: "elevation span"      # the size criterion with the least room, +3.66° (+54 %) — what the NEXT lift has to spend
