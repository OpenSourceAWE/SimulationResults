# Run summary for output/reelout_150m_opt.arrow, written by examples/simple_reelout.jl at the end of the run.
success_criteria: "all 10 passed"   # pass/fail verdict vs V3Kite's success criteria
simulation:
  script: "simple_opt_reelout.jl"   # script that produced this run
  project: "system_reelout_maasvlakte.yaml" # system project flown
  rel_turbulence: 0.0               # turbulence level in [0, 1] passed to init
  wind_speed: 8.25                  # mean wind speed in m/s passed to init
  time: "04:40:11"                  # wall-clock time the run finished
  date: "2026-10-31"                # wall-clock date the run finished
  hostname: "framework"             # machine the run executed on
  git_hash: "2f5af60"               # RobustKiteControllers.jl commit hash
  git_status: "dirty"               # RobustKiteControllers.jl working tree: clean or dirty
fig8_metrics:
  settled_from: 16.3                # sim time the scoring window begins [s]
  settle_time: 14.3                 # time after t_start to converge [s]
  laps: 3.0                         # figure-eight laps completed
  lap_time:
    fastest: 18.4                   # shortest time for one full figure of eight — lap 2, starting at t = 37.2 s [s]
    mean: 20.4                      # mean time per full figure of eight, over 3 laps [s]
    slowest: 22.4                   # longest time for one full figure of eight — lap 3 [s]
  cross_track_deg:
    rms: 0.8                        # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 0.59                      # mean cross-track error vs the unlifted optimizer path [deg]
    max: 4.94                       # max cross-track error vs the unlifted optimizer path [deg]
  elevation_deg:
    min_settled: 13.3               # min elevation, settled window [deg]
    min_whole_run: 13.3             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 60          # peak heading rate [deg/s]
  extent:
    azimuth_deg:
      min: -25.9                    # flown azimuth reach, negative side [deg]
      max: 25.2                     # flown azimuth reach, positive side [deg]
    azimuth_pct_of_amplitude:
      min: 96                       # negative reach as % of the pattern's ±A
      max: 103                      # positive reach as % of the pattern's ±A
    worst_lobe_deg:
      min: -20.9                    # weakest lobe, negative side [deg]
      max: 21.1                     # weakest lobe, positive side [deg]
    elevation_span_deg: 26.3        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 18.4    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 97     # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 6264                      # mean tether force, settled window [N]
    std: 722                        # std tether force, settled window [N]
    cv_pct: 11.5                    # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.139             # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 0 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0024         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.25     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.132   # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.139   # peak steering commanded
    rate_limited_pct_time: 0        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.19   # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
  v_app_phase4:
    duration: 70.4                  # phase-4 window length [s]
    mean_m_s: 27.17                 # mean apparent wind speed [m/s]
    min_m_s: 22.57                  # min apparent wind speed [m/s]
    max_m_s: 30.48                  # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: 0.6              # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 3.23               # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.18               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.25               # crest factor: peak / mean reel-out power over the reeling window
    duration: 64.3                  # reeling window length [s]
    n_samples: 5790                 # sample count in the reeling window
    energy_kJ: 1318.9               # energy over the reeling window [kJ]
    energy_run_kJ: 1435.5           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 6485                 # sample count in the reeling window
  ringing:
    n_peaks: 5                      # ring peaks detected above peak_floor
    period: 3.43                    # mean peak-to-peak ring period [s]
    zeta: 0.099                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.36             # first ring peak's amplitude above the local trend [m/s]
    duration: 20.0                  # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 3.5         # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 3.26      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 22214              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 19245      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 19245              # 34% of the reeling window
      t_037.1_s: 23627              # 29% of the reeling window
      t_055.5_s: 23893              # 37% of the reeling window
    measured_W: 20501               # mean reel-out power the run harvested [W]
    ratio: 0.92                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 32.0                     # width of the guess lemniscate, fitted into the startup box; azimuth spans ±a [deg]
    b_deg: 14.0                     # height of the guess, peak to peak, fitted into the startup box [deg]
    el_center_deg: 30.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # offset of the seed the startup solve converged from after a 422 — a startup_retry_el_offsets entry, or a whole degree walked outward past them when the failure cache rejected the listed ones; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.5             # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.488              # optimizer's l_dp [m]; rel_depower equivalent 0.258 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_037.1_s: 1.483              # optimizer's l_dp [m]; rel_depower equivalent 0.257 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_055.5_s: 1.465              # optimizer's l_dp [m]; rel_depower equivalent 0.253 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.2577             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
      t_037.1_s: 0.2566             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
      t_055.5_s: 0.2529             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.0              # centre azimuth of the path [deg]
    az_amplitude_deg: 30.8          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 28.7             # centre elevation of the path [deg]
    el_height_deg: 23.0             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 13.04    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.572        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 30.57 # reel-out per lap ASSUMED for the startup request, fitted to the wind; the only request with no reply to measure it off [m]
    c1_pattern: 0.301               # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own), not depower_setpoint's [1/m]
    gain_scale_flown: 0.916         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 1.55              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 3.93                # curvature margin at reelout_l_max [-]
    c1_final: 0.166                 # turn-rate gain at depower_final [1/m]
    margin_final: 2.11              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 1.72        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    requests: 3                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 206.5                  # wall time the simulation was frozen waiting for replies [s]
    cache_hits: 0                   # optimizer steps, startup included, served from the solution or failure cache (OptChain) without asking the server
    cache_misses: 5                 # optimizer steps sent to the server
    cache_rebuilds: 0               # server sessions rebuilt from the cache before a miss
    replayed_from: ""               # scenario whose optimizer results were flown instead of asking the optimizer (`replay_paths`); empty for a normal run
    installed: 2                    # new paths actually flown
    cycle_wall:
      t_037.1_s: 30.7               # wall time from the first request to the verdict (installed), every retry included, at L = 217 m [s]
      t_055.5_s: 21.6               # wall time from the first request to the verdict (installed), every retry included, at L = 279 m [s]
      t_083.4_s: 154.7              # wall time from the first request to the verdict (failed), every retry included, at L = 373 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    challenges: 0                   # cold challenger solves run against an accepted reply that grew by more than challenge_growth while predicting less than the previous install
    challenges_won: 0               # challengers installed instead of the reply they challenged
    events:
      t_037.1_s: "installed — margin 1.70 (phase 5: 1.63 at 380 m), clearance 53.3 m, size x0.67, 23627 W predicted" # at L = 217 m
      t_055.5_s: "installed — margin 2.35 (phase 5: 1.72 at 380 m), clearance 67.3 m, size x1.09, 23893 W predicted" # at L = 279 m
      t_083.4_s: "failed"           # at L = 373 m
  el_lift:
    lift_deg: 1.0                   # el_offset_final, the fixed lift of the path once reel-out ends [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 0.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the units el_offset_wing_az/_blend are read in
    wing_az_deg: 10.0               # azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg or fraction of A]
    lift_t: 77.3                    # when the lift actually latched [s]
    lift_remaining_m: 27.4          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_077.3_s: "blended in"       # +1.00° of shift, curvature margin 3.02 vs 0.82 required
  droop_profile:
    az_00_20_pct: -1.36             # kite below the path's elevation centre [deg], over 1765 samples; the path itself sits 0.05 half-spans down there and the kite 2.25° under it
    az_20_40_pct: -8.98             # kite below the path's elevation centre [deg], over 1871 samples; the path itself sits -0.26 half-spans down there and the kite 7.50° under it
    az_40_60_pct: -22.07            # kite below the path's elevation centre [deg], over 2981 samples; the path itself sits -0.62 half-spans down there and the kite 18.08° under it
    az_60_80_pct: -0.08             # kite below the path's elevation centre [deg], over 898 samples; the path itself sits -0.05 half-spans down there and the kite -0.36° under it
    az_80_100_pct: -1.21            # kite below the path's elevation centre [deg], over 1522 samples; the path itself sits -0.15 half-spans down there and the kite -0.18° under it
    centre_to_lobe_deg: 1.28        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.0              # rigid lift the path in the air actually carries — el_offset_final once it has been delivered [deg]
    commanded_az_amp_deg: 24.76     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 16.69  # mean commanded pattern height [deg]
    wing_deg: 0.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 13.3            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 38.41         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 8.29     # reach margin: flew 25.62° against the 17.33° required by min_span_frac = 0.70, +48 %
    azimuth_reach_neg_deg: 6.4      # reach margin: flew 23.73° against the 17.33° required by min_span_frac = 0.70, +37 %
    elevation_span_deg: 4.49        # reach margin: flew 16.17° against the 11.68° required by min_span_frac = 0.70, +38 %
    tightest: "elevation span"      # the size criterion with the least room, +4.49° (+38 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 44.4                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 38.1               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 11.53  # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 8.25            # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    k_v_flown: 0.0408               # k_v the run actually flew
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 7200.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 1.00 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
performance:
  sim_time: 117.0                   # simulated time [s]
  wall_time: 228.8                  # wall-clock time [s]
  total_wall_time: 255.4            # the whole script: package loading, init, settling, the startup solve and the run, up to this summary — the archive copy and any plots follow it [s]
  optimization_time: 224.8          # wall time waiting for the optimizer: the startup solve (18.3 s) plus every blocking re-optimization (traj_opt.reopt.blocked) [s]
  max_optimization_time: 154.7      # longest wall time to compute a new figure of eight, retries included: the re-optimization at t = 83.4 s (failed, L = 373 m); the startup solve took 18.3 s [s]
  realtime_factor: 5.25             # sim_time / wall_time, excluding time frozen for re-optimization
  ms_per_step: 2.1                  # wall time per step, excluding time frozen for re-optimization [ms]
  steps: 10530                      # step count
  dt: 0.011111111111111112          # simulation timestep [s]
  vsm_interval: 5                   # VSM aerodynamic update interval [steps]
summary:
  date: "2026-10-31"                # wall-clock date the run finished
  time: "04:40:11"                  # wall-clock time the run finished
  wind_speed_gnd: 8.25              # wind speed at 6 m sent to the optimizer [m/s]
  power_ratio: 0.92                 # measured / predicted reel-out power [-]
  success_criteria: "all 10 passed" # pass/fail verdict vs V3Kite's success criteria
  cross_track_rms_deg: 0.8          # RMS cross-track error, settled window [deg]
  total_wall_time: 255.4            # the whole script, start to this summary [s]
  realtime_factor: 5.25             # sim_time / wall_time, excluding time frozen for re-optimization
  optimization_requests: 3          # solves that completed, accepted or rejected
  optimizations_installed: 2        # new paths actually flown
  fastest_fig8: 18.4                # shortest time for flying one full figure of eight [s]
  max_optimization_time: 154.7      # longest wall time to compute a new figure of eight, retries included [s]
  av_power_ro: 20712                # mean reel-out power over phase four [W]
  min_power_ro: 11260               # min reel-out power over phase four, last 2 s excluded [W]
  max_power_ro: 25554               # max reel-out power over phase four [W]
  min_force_ro: 4101                # min tether force over phase four, last 2 s excluded [N]
  av_force_ro: 6265                 # mean tether force over phase four [N]
  max_force_ro: 7373                # max tether force over phase four [N]
  v_ro_min: 2.41                    # min reel-out speed over phase four, last 2 s excluded [m/s]
  v_ro_av: 3.28                     # mean reel-out speed over phase four [m/s]
  v_ro_max: 3.5                     # max reel-out speed over phase four [m/s]
  av_depower_ro: 0.256              # mean KCU depower over phase four [-]
  max_depower_final: 0.35           # highest depower the force limiter asked for, from the stop latch through phase 5; the phase-5 floor itself when it never engaged or is off (depower_final_max == depower_final) [-]
  gain_scale_final_peak: 1.661      # heading_p factor phase 5 flew with at the limiter's peak, c1(depower_setpoint)/c1(flown), read at 0.35 [-]
