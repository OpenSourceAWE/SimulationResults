performance:
  sim_time: 120.1                   # simulated time [s]
  wall_time: 62.3                   # wall-clock time [s]
  total_wall_time: 75.5             # the whole script: package loading, init, settling, the startup solve and the run, up to this summary — the archive copy and any plots follow it [s]
  optimization_time: 39.2           # wall time waiting for the optimizer: the startup solve (9.0 s) plus every blocking re-optimization (traj_opt.reopt.blocked) [s]
  max_optimization_time: 11.0       # longest wall time to compute a new figure of eight, retries included: the re-optimization at t = 71.5 s (installed, L = 327 m); the startup solve took 9.0 s [s]
  realtime_factor: 3.73             # sim_time / wall_time, excluding time frozen for re-optimization
  ms_per_step: 3.0                  # wall time per step, excluding time frozen for re-optimization [ms]
  steps: 10809                      # step count
  dt: 0.011111111111111112          # simulation timestep [s]
  vsm_interval: 10                  # VSM aerodynamic update interval [steps]
summary:
  date: "2026-09-21"                # wall-clock date the run finished
  time: "18:47:21"                  # wall-clock time the run finished
  wind_speed_gnd: 8.25              # wind speed at 6 m sent to the optimizer [m/s]
  power_ratio: 0.96                 # measured / predicted reel-out power [-]
  success_criteria: "all 10 passed" # pass/fail verdict vs V3Kite's success criteria
