    fastest: 13.3                   # shortest time for one full figure of eight — lap 1, starting at t = 18.9 s [s]
    mean: 13.9                      # mean time per full figure of eight, over 4 laps [s]
    slowest: 14.6                   # longest time for one full figure of eight — lap 4 [s]
  cross_track_deg:
    rms: 0.96                       # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 0.8                       # mean cross-track error vs the unlifted optimizer path [deg]
    max: 4.95                       # max cross-track error vs the unlifted optimizer path [deg]
  elevation_deg:
    min_settled: 12.9               # min elevation, settled window [deg]
    min_whole_run: 11.5             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 90          # peak heading rate [deg/s]
  extent:
