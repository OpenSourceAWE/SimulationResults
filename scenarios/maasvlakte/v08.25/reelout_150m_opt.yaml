  power:
    cf_power_ro: 1.28               # crest factor: peak / mean reel-out power over the reeling window
    duration: 73.3                  # reeling window length [s]
    n_samples: 6596                 # sample count in the reeling window
    energy_kJ: 1441.5               # energy over the reeling window [kJ]
    energy_run_kJ: 1439.2           # energy over the whole run [kJ]
  winch_state:
