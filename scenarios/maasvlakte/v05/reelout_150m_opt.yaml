  date: "2026-09-20"                # wall-clock date the run finished
  hostname: "framework"             # machine the run executed on
  git_hash: "7c18d4e"               # SimpleKiteControllers.jl commit hash
  git_status: "dirty"               # SimpleKiteControllers.jl working tree: clean or dirty
