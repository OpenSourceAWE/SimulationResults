    slowest: 25.5                   # longest time for one full figure of eight — lap 6 [s]
  cross_track_deg:
    rms: 0.99                       # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 0.79                      # mean cross-track error vs the unlifted optimizer path [deg]
    max: 4.92                       # max cross-track error vs the unlifted optimizer path [deg]
