      t_045.4_s: 22168              # 25% of the reeling window
      t_063.1_s: 22117              # 28% of the reeling window
      t_083.6_s: 21131              # 6% of the reeling window
    measured_W: 20673               # mean reel-out power the run harvested [W]
    ratio: 0.95                     # measured / predicted, against the weighted prediction
