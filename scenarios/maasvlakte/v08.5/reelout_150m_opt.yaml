# Run summary for output/reelout_150m_opt.arrow, written by examples/simple_reelout.jl at the end of the run.
success_criteria: "all 10 passed"   # pass/fail verdict vs V3Kite's success criteria
simulation:
  script: "simple_opt_reelout.jl"   # script that produced this run
  project: "system_reelout_150m.yaml" # system project flown
  rel_turbulence: 0.0               # turbulence level in [0, 1] passed to init
  wind_speed: 8.5                   # mean wind speed in m/s passed to init
  time: "16:22:05"                  # wall-clock time the run finished
  date: "2026-09-19"                # wall-clock date the run finished
  hostname: "ufryzen"               # machine the run executed on
  git_hash: "8c9dc1e"               # SimpleKiteControllers.jl commit hash
  git_status: "clean"               # SimpleKiteControllers.jl working tree: clean or dirty
fig8_metrics:
  settled_from: 18.4                # sim time the scoring window begins [s]
  settle_time: 16.4                 # time after t_start to converge [s]
  laps: 6.0                         # figure-eight laps completed
  lap_time:
    fastest: 12.3                   # shortest time for one full figure of eight — lap 1, starting at t = 18.5 s [s]
    mean: 16.2                      # mean time per full figure of eight, over 6 laps [s]
    slowest: 20.4                   # longest time for one full figure of eight — lap 4 [s]
  cross_track_deg:
    rms: 1.84                       # RMS cross-track error [deg]
    mean: 1.43                      # mean cross-track error [deg]
    max: 4.91                       # max cross-track error [deg]
  elevation_deg:
    min_settled: 11.0               # min elevation, settled window [deg]
    min_whole_run: 11.0             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 106         # peak heading rate [deg/s]
  extent:
    azimuth_deg:
      min: -20.2                    # flown azimuth reach, negative side [deg]
      max: 19.1                     # flown azimuth reach, positive side [deg]
    azimuth_pct_of_amplitude:
      min: 106                      # negative reach as % of the pattern's ±A
      max: 108                      # positive reach as % of the pattern's ±A
    worst_lobe_deg:
      min: -12.2                    # weakest lobe, negative side [deg]
      max: 12.6                     # weakest lobe, positive side [deg]
    elevation_span_deg: 22.9        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 10.9    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 111    # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 5694                      # mean tether force, settled window [N]
    std: 1242                       # std tether force, settled window [N]
    cv_pct: 21.8                    # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.32              # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 7 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0048         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.52     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.318   # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.32    # peak steering commanded
    rate_limited_pct_time: 5        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
