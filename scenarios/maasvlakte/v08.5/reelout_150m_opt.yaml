  optimization_time: 71.0           # wall time waiting for the optimizer: the startup solve (13.6 s) plus every blocking re-optimization (traj_opt.reopt.blocked) [s]
  max_optimization_time: 25.1       # longest wall time to compute a new figure of eight, retries included: the re-optimization at t = 64.0 s (installed, L = 310 m); the startup solve took 13.6 s [s]
