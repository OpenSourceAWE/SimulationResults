    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.423              # optimizer's l_dp [m]; rel_depower equivalent 0.266 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_030.8_s: 1.431              # optimizer's l_dp [m]; rel_depower equivalent 0.267 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_045.4_s: 1.429              # optimizer's l_dp [m]; rel_depower equivalent 0.267 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_063.1_s: 1.426              # optimizer's l_dp [m]; rel_depower equivalent 0.266 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_083.6_s: 1.466              # optimizer's l_dp [m]; rel_depower equivalent 0.274 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.2656             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_030.8_s: 0.2672             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_045.4_s: 0.2667             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_063.1_s: 0.2662             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_083.6_s: 0.2743             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: -0.2             # centre azimuth of the path [deg]
    az_amplitude_deg: 18.9          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 24.6             # centre elevation of the path [deg]
    el_height_deg: 13.3             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 15.76    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.402        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    c1_pattern: 0.2522              # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own under fly_opt_depower), not depower_setpoint's [1/m]
    gain_scale_flown: 0.964         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 0.83              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.1                 # curvature margin at reelout_l_max [-]
    c1_final: 0.1655                # turn-rate gain at depower_final [1/m]
    margin_final: 1.32              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.59        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 24.2                   # wall time the simulation was frozen waiting for replies [s]
    installed: 4                    # new paths actually flown
    cycle_wall:
      t_030.8_s: 5.3                # wall time from the first request to the verdict (installed), every retry included, at L = 194 m [s]
      t_045.4_s: 9.1                # wall time from the first request to the verdict (installed), every retry included, at L = 244 m [s]
      t_063.1_s: 6.0                # wall time from the first request to the verdict (installed), every retry included, at L = 303 m [s]
      t_083.6_s: 4.5                # wall time from the first request to the verdict (installed), every retry included, at L = 370 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_030.8_s: "installed — margin 0.98 (phase 5: 1.27 at 380 m), clearance 48.7 m, 21973 W predicted" # at L = 194 m
      t_045.4_s: "installed — margin 1.03 (phase 5: 1.06 at 380 m), clearance 56.3 m, 22168 W predicted" # at L = 244 m
      t_063.1_s: "installed — margin 1.03 (phase 5: 0.85 at 380 m), clearance 63.5 m, 22117 W predicted" # at L = 303 m
      t_083.6_s: "installed — margin 0.84 (phase 5: 0.59 at 380 m), clearance 118.6 m, 21131 W predicted" # at L = 370 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 1.65                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [0.97, 1.36, 1.85, 2.39, 1.65] # the learnt correction per band, crossing first [deg]
    lift_deg: 3.0                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t: 78.4                    # when the lift actually latched [s]
    lift_remaining_m: 27.1          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_034.8_s: "blended in"       # +0.41° of shift (mean over the bands), curvature margin 1.09 vs 0.82 required
      t_049.4_s: "blended in"       # +0.24° of shift (mean over the bands), curvature margin 1.09 vs 0.82 required
      t_067.2_s: "blended in"       # +0.13° of shift (mean over the bands), curvature margin 1.07 vs 0.82 required
      t_078.4_s: "blended in"       # +3.00° of shift (mean over the bands), curvature margin 1.20 vs 0.82 required
      t_100.2_s: "held back"        # +0.58° of shift (mean over the bands), curvature margin 0.55 vs 0.82 required
    laps:
      lap_1: -0.77                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.77°, correction became [+0.67 +0.62 +0.39 +0.23 +0.16]° (crossing … lobe)
      lap_2: -0.52                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.91°, correction became [+0.29 +0.58 +0.82 +0.91 +0.66]° (crossing … lobe)
      lap_3: -0.27                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.93°, correction became [+0.16 +0.58 +1.04 +1.21 +0.93]° (crossing … lobe)
      lap_5: -0.63                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.44°, correction became [+0.68 +0.92 +1.30 +2.00 +1.91]° (crossing … lobe)
      lap_6: -0.18                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.52°, correction became [+0.97 +1.36 +1.85 +2.39 +1.65]° (crossing … lobe)
    lap_profiles:
      lap_1: "-1.34 -1.31 -0.75 -0.44 -0.30" # error vs the optimizer's curve per band, crossing first; 206/200/170/180/350 samples, correction now [+0.67 +0.62 +0.39 +0.23 +0.16]° (crossing … lobe)
      lap_2: "+0.91 -0.02 -0.93 -1.54 -0.81" # error vs the optimizer's curve per band, crossing first; 227/234/221/239/388 samples, correction now [+0.29 +0.58 +0.82 +0.91 +0.66]° (crossing … lobe)
      lap_3: "+0.49 -0.06 -0.54 -0.83 -0.34" # error vs the optimizer's curve per band, crossing first; 273/301/290/293/444 samples, correction now [+0.16 +0.58 +1.04 +1.21 +0.93]° (crossing … lobe)
      lap_5: "-0.46 -0.37 -0.20 -0.96 -0.91" # error vs the optimizer's curve per band, crossing first; 241/268/252/254/481 samples, correction now [+0.68 +0.92 +1.30 +2.00 +1.91]° (crossing … lobe)
      lap_6: "-0.21 -0.50 -0.54 -0.72 +0.54" # error vs the optimizer's curve per band, crossing first; 281/307/247/148/388 samples, correction now [+0.97 +1.36 +1.85 +2.39 +1.65]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 2.59              # kite below the path's elevation centre [deg], over 1552 samples; the path itself sits 0.47 half-spans down there and the kite -0.41° under it
    az_20_40_pct: 2.16              # kite below the path's elevation centre [deg], over 1703 samples; the path itself sits 0.28 half-spans down there and the kite -0.95° under it
    az_40_60_pct: 1.61              # kite below the path's elevation centre [deg], over 1581 samples; the path itself sits 0.06 half-spans down there and the kite -1.40° under it
    az_60_80_pct: 2.23              # kite below the path's elevation centre [deg], over 1482 samples; the path itself sits 0.10 half-spans down there and the kite -1.81° under it
    az_80_100_pct: 2.03             # kite below the path's elevation centre [deg], over 2599 samples; the path itself sits 0.19 half-spans down there and the kite -1.20° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 3.78             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [3.16, 3.58, 4.04, 4.21, 3.93] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 18.2      # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 10.04  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 11.0            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 14.82         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 6.85     # reach margin: flew 19.60° against the 12.74° required by min_span_frac = 0.70, +54 %
    azimuth_reach_neg_deg: 6.56     # reach margin: flew 19.31° against the 12.74° required by min_span_frac = 0.70, +52 %
    elevation_span_deg: 4.15        # reach margin: flew 11.17° against the 7.03° required by min_span_frac = 0.70, +59 %
    tightest: "elevation span"      # the size criterion with the least room, +4.15° (+59 %) — what the NEXT lift has to spend
