    mean: 4196                      # mean tether force, settled window [N]
    std: 712                        # std tether force, settled window [N]
    cv_pct: 17.0                    # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.32              # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 7 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0044         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.47     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.319   # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.32    # peak steering commanded
    rate_limited_pct_time: 6        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
