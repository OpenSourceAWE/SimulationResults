  optimization_time: 29.2           # wall time waiting for the optimizer: the startup solve (9.6 s) plus every blocking re-optimization (traj_opt.reopt.blocked) [s]
  max_optimization_time: 9.6        # longest wall time to compute a new figure of eight, retries included: the startup solve; the slowest re-optimization took 5.0 s [s]
