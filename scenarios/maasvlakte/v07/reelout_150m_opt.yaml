  force:
    cf_force_ro: 1.43               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.19               # crest factor: peak / mean reel-out power over the reeling window
    duration: 86.3                  # reeling window length [s]
    n_samples: 7767                 # sample count in the reeling window
    energy_kJ: 1044.8               # energy over the reeling window [kJ]
    energy_run_kJ: 1044.6           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 7767                 # sample count in the reeling window
  ringing:
    n_peaks: 5                      # ring peaks detected above peak_floor
    period: 2.34                    # mean peak-to-peak ring period [s]
    zeta: 0.058                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.4              # first ring peak's amplitude above the local trend [m/s]
    duration: 20.0                  # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 2.98        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 2.7       # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 12079              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 10905      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 10905              # 17% of the reeling window
      t_031.6_s: 11893              # 15% of the reeling window
      t_044.8_s: 12319              # 16% of the reeling window
      t_058.7_s: 12486              # 17% of the reeling window
      t_072.9_s: 12484              # 17% of the reeling window
      t_087.8_s: 12400              # 18% of the reeling window
    measured_W: 12106               # mean reel-out power the run harvested [W]
    ratio: 1.0                      # measured / predicted, against the weighted prediction
  guess:
