  project: "system_reelout_maasvlakte.yaml" # system project flown
  rel_turbulence: "default"         # turbulence level in [0, 1] passed to init
  wind_speed: 7.0                   # mean wind speed in m/s passed to init
  time: "22:44:30"                  # wall-clock time the run finished
  date: "2026-09-25"                # wall-clock date the run finished
  hostname: "framework"             # machine the run executed on
  git_hash: "fac6e5c"               # SimpleKiteControllers.jl commit hash
  git_status: "dirty"               # SimpleKiteControllers.jl working tree: clean or dirty
