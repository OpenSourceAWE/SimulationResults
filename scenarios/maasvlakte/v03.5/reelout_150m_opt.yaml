    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 23883                # sample count in the reeling window
  ringing:
    n_peaks: 3                      # ring peaks detected above peak_floor
    period: 2.98                    # mean peak-to-peak ring period [s]
    zeta: 0.008                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.03             # first ring peak's amplitude above the local trend [m/s]
    duration: 20.0                  # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 1.12        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 1.01      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 704                # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 516        # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 516                # 17% of the reeling window
      t_065.0_s: 554                # 15% of the reeling window
      t_104.5_s: 673                # 15% of the reeling window
      t_145.5_s: 783                # 17% of the reeling window
      t_191.1_s: 832                # 18% of the reeling window
      t_240.1_s: 839                # 17% of the reeling window
    measured_W: 852                 # mean reel-out power the run harvested [W]
    ratio: 1.21                     # measured / predicted, against the weighted prediction
    free_speed_reference_W: 778     # mean reel-out power an OPTIMAL path could harvest with ANY winch in [f_min, f_max], solved after the run at 6 lengths and weighted by time spent at each. An UPPER BOUND, not a prediction of this k_v law, and never flown [W]
    free_speed_points:
      L_116.3_m: 260                # free_speed solve [W]
      L_169.0_m: 794                # free_speed solve [W]
      L_221.8_m: 878                # free_speed solve [W]
      L_274.5_m: 887                # free_speed solve [W]
      L_327.3_m: 869                # free_speed solve [W]
      L_380.0_m: 824                # free_speed solve [W]
    free_speed_ratio: 1.09          # measured / free_speed_reference_W; above 1 means the run harvests more than the optimizer's own upper bound, which no winch law can explain
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # offset of the seed the startup solve converged from after a 422 — a startup_retry_el_offsets entry, or a whole degree walked outward past them when the failure cache rejected the listed ones; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.6             # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.562              # optimizer's l_dp [m]; rel_depower equivalent 0.293 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_065.0_s: 1.565              # optimizer's l_dp [m]; rel_depower equivalent 0.294 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_104.5_s: 1.551              # optimizer's l_dp [m]; rel_depower equivalent 0.291 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_145.5_s: 1.53               # optimizer's l_dp [m]; rel_depower equivalent 0.287 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_191.1_s: 1.522              # optimizer's l_dp [m]; rel_depower equivalent 0.285 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_240.1_s: 1.522              # optimizer's l_dp [m]; rel_depower equivalent 0.285 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.2935             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_065.0_s: 0.2939             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_104.5_s: 0.2913             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_145.5_s: 0.287              # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_191.1_s: 0.2855             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_240.1_s: 0.2854             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: -0.0             # centre azimuth of the path [deg]
    az_amplitude_deg: 26.1          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 28.1             # centre elevation of the path [deg]
    el_height_deg: 16.4             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 13.88    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.366        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    c1_pattern: 0.2427              # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own under fly_opt_depower), not depower_setpoint's [1/m]
    gain_scale_flown: 1.136         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 1.13              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.87                # curvature margin at reelout_l_max [-]
    c1_final: 0.166                 # turn-rate gain at depower_final [1/m]
    margin_final: 1.93              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.8         # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
    final_fallback_t: 293.9         # when phase 5's path fell back to an earlier install (final_margin_min) [s]
    final_fallback_to_t: 65.0       # install time of the path it fell back to; 0 = the startup path [s]
    margin_final_fallback: 1.72     # phase-5 margin of that path, carrying the current lift: the one phase 5 flies [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 5                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 23.6                   # wall time the simulation was frozen waiting for replies [s]
    cache_hits: 1                   # optimizer steps, startup included, served from the solution or failure cache (OptChain) without asking the server
    cache_misses: 5                 # optimizer steps sent to the server
    cache_rebuilds: 1               # server sessions rebuilt from the cache before a miss
    replayed_from: ""               # scenario whose optimizer results were flown instead of asking the optimizer (`replay_paths`); empty for a normal run
    installed: 5                    # new paths actually flown
    cycle_wall:
      t_065.0_s: 13.0               # wall time from the first request to the verdict (installed), every retry included, at L = 155 m [s]
      t_104.5_s: 5.0                # wall time from the first request to the verdict (installed), every retry included, at L = 190 m [s]
      t_145.5_s: 5.0                # wall time from the first request to the verdict (installed), every retry included, at L = 232 m [s]
      t_191.1_s: 4.5                # wall time from the first request to the verdict (installed), every retry included, at L = 281 m [s]
      t_240.1_s: 4.5                # wall time from the first request to the verdict (installed), every retry included, at L = 335 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_065.0_s: "installed — margin 1.02 (phase 5: 1.72 at 380 m), clearance 50.2 m, size x1.01, 554 W predicted" # at L = 155 m
      t_104.5_s: "installed — margin 1.10 (phase 5: 1.48 at 380 m), clearance 56.6 m, size x0.95, 673 W predicted" # at L = 190 m
      t_145.5_s: "installed — margin 1.11 (phase 5: 1.19 at 380 m), clearance 63.1 m, size x0.95, 783 W predicted" # at L = 232 m
      t_191.1_s: "installed — margin 1.10 (phase 5: 0.97 at 380 m), clearance 71.0 m, size x0.91, 832 W predicted" # at L = 281 m
      t_240.1_s: "installed — margin 1.09 (phase 5: 0.80 at 380 m), clearance 79.1 m, size x0.85, 839 W predicted" # at L = 335 m
  el_lift:
    lift_deg: 1.0                   # el_offset_final, the fixed lift of the path once reel-out ends [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.0                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the units el_offset_wing_az/_blend are read in
    wing_az_deg: 10.0               # azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg or fraction of A]
    lift_t: 275.9                   # when the lift actually latched [s]
    lift_remaining_m: 6.8           # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_275.9_s: "blended in"       # +1.00° of shift, curvature margin 1.22 vs 0.82 required
  droop_profile:
    az_00_20_pct: 6.28              # kite below the path's elevation centre [deg], over 6351 samples; the path itself sits 0.68 half-spans down there and the kite -2.38° under it
    az_20_40_pct: 4.74              # kite below the path's elevation centre [deg], over 6384 samples; the path itself sits 0.41 half-spans down there and the kite -2.35° under it
    az_40_60_pct: 2.84              # kite below the path's elevation centre [deg], over 5101 samples; the path itself sits 0.09 half-spans down there and the kite -2.54° under it
    az_60_80_pct: 3.36              # kite below the path's elevation centre [deg], over 3873 samples; the path itself sits 0.05 half-spans down there and the kite -3.11° under it
    az_80_100_pct: 1.53             # kite below the path's elevation centre [deg], over 3748 samples; the path itself sits 0.11 half-spans down there and the kite -1.35° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.0              # rigid lift the path in the air actually carries — el_offset_final once it has been delivered [deg]
    commanded_az_amp_deg: 23.62     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 11.57  # mean commanded pattern height [deg]
    wing_deg: 1.0                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 8.5             # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 10.28         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 6.89     # reach margin: flew 23.43° against the 16.54° required by min_span_frac = 0.70, +42 %
    azimuth_reach_neg_deg: 5.13     # reach margin: flew 21.67° against the 16.54° required by min_span_frac = 0.70, +31 %
    elevation_span_deg: 2.38        # reach margin: flew 10.48° against the 8.10° required by min_span_frac = 0.70, +29 %
    tightest: "elevation span"      # the size criterion with the least room, +2.38° (+29 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 51.1                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 17.5               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 12.49  # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 3.5             # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0408               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 525.0                  # minimum winch force sent [N]
    f_max_N: 7200.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 1.00 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
