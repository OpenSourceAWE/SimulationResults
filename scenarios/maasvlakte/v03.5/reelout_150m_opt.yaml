    fastest: 39.5                   # shortest time for one full figure of eight — lap 1, starting at t = 33.3 s [s]
    mean: 46.4                      # mean time per full figure of eight, over 4 laps [s]
    slowest: 51.9                   # longest time for one full figure of eight — lap 4 [s]
  cross_track_deg:
    rms: 0.7                        # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 0.5                       # mean cross-track error vs the unlifted optimizer path [deg]
    max: 5.0                        # max cross-track error vs the unlifted optimizer path [deg]
  elevation_deg:
    min_settled: 8.9                # min elevation, settled window [deg]
    min_whole_run: 8.9              # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 58          # peak heading rate [deg/s]
  extent:
