      max: 23.1                     # flown azimuth reach, positive side [deg]
    azimuth_pct_of_amplitude:
      min: 98                       # negative reach as % of the pattern's ±A
      max: 102                      # positive reach as % of the pattern's ±A
    worst_lobe_deg:
      min: -19.4                    # weakest lobe, negative side [deg]
      max: 19.6                     # weakest lobe, positive side [deg]
    elevation_span_deg: 15.9        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 9.2     # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 96     # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 846                       # mean tether force, settled window [N]
    std: 175                        # std tether force, settled window [N]
    cv_pct: 20.6                    # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.32              # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 8 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0096         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.14     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.32    # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.32    # peak steering commanded
    rate_limited_pct_time: 10       # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
