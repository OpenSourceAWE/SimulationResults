      max: 23.4                     # flown azimuth reach, positive side [deg]
    azimuth_pct_of_amplitude:
      min: 92                       # negative reach as % of the pattern's ±A
      max: 99                       # positive reach as % of the pattern's ±A
    worst_lobe_deg:
      min: -16.1                    # weakest lobe, negative side [deg]
      max: 17.7                     # weakest lobe, positive side [deg]
    elevation_span_deg: 23.1        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 11.2    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 91     # flown span as % of the B commanded where it was flown
