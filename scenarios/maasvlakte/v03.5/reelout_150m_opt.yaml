    fastest: 33.6                   # shortest time for one full figure of eight — lap 1, starting at t = 31.5 s [s]
    mean: 42.8                      # mean time per full figure of eight, over 6 laps [s]
    slowest: 49.0                   # longest time for one full figure of eight — lap 5 [s]
  cross_track_deg:
    rms: 1.89                       # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 1.76                      # mean cross-track error vs the unlifted optimizer path [deg]
    max: 4.99                       # max cross-track error vs the unlifted optimizer path [deg]
  elevation_deg:
    min_settled: 10.2               # min elevation, settled window [deg]
    min_whole_run: 8.5              # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 56          # peak heading rate [deg/s]
  extent:
