  droop_profile:
    az_00_20_pct: 4.93              # kite below the path's elevation centre [deg], over 6032 samples; the path itself sits 0.66 half-spans down there and the kite -1.30° under it
    az_20_40_pct: 3.47              # kite below the path's elevation centre [deg], over 6521 samples; the path itself sits 0.38 half-spans down there and the kite -1.41° under it
    az_40_60_pct: 2.15              # kite below the path's elevation centre [deg], over 6517 samples; the path itself sits 0.11 half-spans down there and the kite -1.67° under it
    az_60_80_pct: 1.86              # kite below the path's elevation centre [deg], over 4963 samples; the path itself sits -0.05 half-spans down there and the kite -2.11° under it
    az_80_100_pct: 0.87             # kite below the path's elevation centre [deg], over 5172 samples; the path itself sits 0.01 half-spans down there and the kite -1.06° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.0              # rigid lift the path in the air actually carries — el_offset_final once it has been delivered [deg]
    commanded_az_amp_deg: 23.14     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 11.46  # mean commanded pattern height [deg]
    wing_deg: 1.0                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 8.9             # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 9.11          # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 7.09     # reach margin: flew 23.29° against the 16.20° required by min_span_frac = 0.70, +44 %
    azimuth_reach_neg_deg: 6.36     # reach margin: flew 22.56° against the 16.20° required by min_span_frac = 0.70, +39 %
    elevation_span_deg: 2.21        # reach margin: flew 10.23° against the 8.02° required by min_span_frac = 0.70, +28 %
