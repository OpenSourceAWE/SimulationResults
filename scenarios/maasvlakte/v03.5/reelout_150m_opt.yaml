    duration: 190.1                 # phase-4 window length [s]
    mean_m_s: 10.75                 # mean apparent wind speed [m/s]
    min_m_s: 8.89                   # min apparent wind speed [m/s]
    max_m_s: 16.22                  # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: -60.2            # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 195.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 4.62               # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.63               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 2.02               # crest factor: peak / mean reel-out power over the reeling window
    duration: 201.1                 # reeling window length [s]
    n_samples: 18095                # sample count in the reeling window
    energy_kJ: 197.6                # energy over the reeling window [kJ]
    energy_run_kJ: 182.7            # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 18095                # sample count in the reeling window
  ringing:
    n_peaks: 1                      # ring peaks detected above peak_floor
    period: NaN                     # mean peak-to-peak ring period [s]
    zeta: NaN                       # damping ratio from the peak log decrement
    overshoot_m_s: 0.08             # first ring peak's amplitude above the local trend [m/s]
    duration: 20.0                  # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 1.21        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 1.11      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 810                # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 749        # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 749                # 25% of the reeling window
      t_072.8_s: 776                # 22% of the reeling window
      t_117.5_s: 846                # 25% of the reeling window
      t_167.1_s: 862                # 26% of the reeling window
      t_220.2_s: 839                # 2% of the reeling window
    measured_W: 983                 # mean reel-out power the run harvested [W]
    ratio: 1.21                     # measured / predicted, against the weighted prediction
    free_speed_reference_W: 904     # mean reel-out power an OPTIMAL path could harvest with ANY winch in [f_min, f_max], solved after the run at 6 lengths and weighted by time spent at each. An UPPER BOUND, not a prediction of this k_v law, and never flown [W]
    free_speed_points:
      L_158.3_m: 736                # free_speed solve [W]
      L_202.7_m: 907                # free_speed solve [W]
      L_247.0_m: 949                # free_speed solve [W]
      L_291.3_m: 940                # free_speed solve [W]
      L_335.7_m: 922                # free_speed solve [W]
      L_380.0_m: 890                # free_speed solve [W]
    free_speed_ratio: 1.09          # measured / free_speed_reference_W; above 1 means the run harvests more than the optimizer's own upper bound, which no winch law can explain
  guess:
    a_deg: 25.2                     # width of the guess lemniscate, fitted into the startup box; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak, fitted into the startup box [deg]
    el_center_deg: 25.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # offset of the seed the startup solve converged from after a 422 — a startup_retry_el_offsets entry, or a whole degree walked outward past them when the failure cache rejected the listed ones; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.6             # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.537              # optimizer's l_dp [m]; rel_depower equivalent 0.281 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_072.8_s: 1.539              # optimizer's l_dp [m]; rel_depower equivalent 0.282 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_117.5_s: 1.522              # optimizer's l_dp [m]; rel_depower equivalent 0.279 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_167.1_s: 1.519              # optimizer's l_dp [m]; rel_depower equivalent 0.279 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_220.2_s: 1.521              # optimizer's l_dp [m]; rel_depower equivalent 0.279 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.2814             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
      t_072.8_s: 0.2818             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
      t_117.5_s: 0.2792             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
      t_167.1_s: 0.2787             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
      t_220.2_s: 0.2789             # the same reply as V3Kite rel_depower, converted with the depower conversion in force at run time; what a replot's u_d panel draws [-]
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: -0.0             # centre azimuth of the path [deg]
    az_amplitude_deg: 25.6          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 20.7             # centre elevation of the path [deg]
    el_height_deg: 11.7             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 13.16    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.355        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 21.13 # reel-out per lap ASSUMED for the startup request, fitted to the wind; the only request with no reply to measure it off [m]
    c1_pattern: 0.2629              # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own), not depower_setpoint's [1/m]
    gain_scale_flown: 1.049         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 1.2               # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.34                # curvature margin at reelout_l_max [-]
    c1_final: 0.166                 # turn-rate gain at depower_final [1/m]
    margin_final: 1.46              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.71        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 0.0                    # wall time the simulation was frozen waiting for replies [s]
    cache_hits: 5                   # optimizer steps, startup included, served from the solution or failure cache (OptChain) without asking the server
    cache_misses: 0                 # optimizer steps sent to the server
    cache_rebuilds: 0               # server sessions rebuilt from the cache before a miss
    replayed_from: ""               # scenario whose optimizer results were flown instead of asking the optimizer (`replay_paths`); empty for a normal run
    installed: 4                    # new paths actually flown
    cycle_wall:
      t_072.8_s: 0.8                # wall time from the first request to the verdict (installed), every retry included, at L = 212 m [s]
      t_117.5_s: 0.0                # wall time from the first request to the verdict (installed), every retry included, at L = 261 m [s]
      t_167.1_s: 0.0                # wall time from the first request to the verdict (installed), every retry included, at L = 318 m [s]
      t_220.2_s: 0.0                # wall time from the first request to the verdict (installed), every retry included, at L = 378 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    challenges: 0                   # cold challenger solves run against an accepted reply that grew by more than challenge_growth while predicting less than the previous install
    challenges_won: 0               # challengers installed instead of the reply they challenged
    events:
      t_072.8_s: "installed — margin 1.10 (phase 5: 1.25 at 380 m), clearance 53.0 m, size x0.93, 776 W predicted" # at L = 212 m
      t_117.5_s: "installed — margin 1.12 (phase 5: 1.02 at 380 m), clearance 59.2 m, size x0.96, 846 W predicted" # at L = 261 m
      t_167.1_s: "installed — margin 1.12 (phase 5: 0.83 at 380 m), clearance 66.5 m, size x0.85, 862 W predicted" # at L = 318 m
      t_220.2_s: "installed — margin 1.13 (phase 5: 0.71 at 380 m), clearance 85.3 m, size x0.88, 839 W predicted" # at L = 378 m
  el_lift:
    lift_deg: 1.5                   # el_offset_final, the fixed lift of the path once reel-out ends [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 0.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the units el_offset_wing_az/_blend are read in
    wing_az_deg: 10.0               # azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg or fraction of A]
    lift_t: 214.2                   # when the lift actually latched [s]
    lift_remaining_m: 9.3           # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_214.2_s: "blended in"       # +1.50° of shift, curvature margin 1.27 vs 0.82 required
  droop_profile:
    az_00_20_pct: 2.92              # kite below the path's elevation centre [deg], over 3575 samples; the path itself sits 0.60 half-spans down there and the kite -0.28° under it
    az_20_40_pct: 2.43              # kite below the path's elevation centre [deg], over 4132 samples; the path itself sits 0.45 half-spans down there and the kite -0.51° under it
    az_40_60_pct: 1.78              # kite below the path's elevation centre [deg], over 4384 samples; the path itself sits 0.22 half-spans down there and the kite -0.87° under it
    az_60_80_pct: 1.14              # kite below the path's elevation centre [deg], over 3867 samples; the path itself sits -0.02 half-spans down there and the kite -1.26° under it
    az_80_100_pct: 0.22             # kite below the path's elevation centre [deg], over 3850 samples; the path itself sits -0.14 half-spans down there and the kite -0.83° under it
    centre_to_lobe_deg: 0.0         # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.5              # rigid lift the path in the air actually carries — el_offset_final once it has been delivered [deg]
    commanded_az_amp_deg: 22.29     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 8.94   # mean commanded pattern height [deg]
    wing_deg: 0.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 8.9             # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 8.88          # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 7.05     # reach margin: flew 22.65° against the 15.60° required by min_span_frac = 0.70, +45 %
    azimuth_reach_neg_deg: 6.21     # reach margin: flew 21.81° against the 15.60° required by min_span_frac = 0.70, +40 %
    elevation_span_deg: 2.37        # reach margin: flew 8.63° against the 6.26° required by min_span_frac = 0.70, +38 %
    tightest: "elevation span"      # the size criterion with the least room, +2.37° (+38 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 50.0                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 27.4               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 10.59  # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 3.5             # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    k_v_flown: 0.0408               # k_v the run actually flew
    f_min_N: 525.0                  # minimum winch force sent [N]
    f_max_N: 7200.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 1.00 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
