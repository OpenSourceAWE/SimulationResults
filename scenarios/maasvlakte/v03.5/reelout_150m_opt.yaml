      t_105.9_s: "installed — margin 1.00 (phase 5: 1.51 at 380 m), clearance 53.8 m, size x0.97, 671 W predicted" # at L = 184 m
      t_149.9_s: "installed — margin 1.03 (phase 5: 1.25 at 380 m), clearance 60.0 m, size x0.93, 768 W predicted" # at L = 226 m
      t_197.1_s: "installed — margin 1.05 (phase 5: 1.04 at 380 m), clearance 65.9 m, size x0.94, 838 W predicted" # at L = 274 m
      t_247.8_s: "installed — margin 1.05 (phase 5: 0.87 at 380 m), clearance 73.2 m, size x0.85, 851 W predicted" # at L = 329 m
  el_lift:
    lift_deg: 1.0                   # el_offset_final, the fixed lift of the path once reel-out ends [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.0                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the units el_offset_wing_az/_blend are read in
    wing_az_deg: 10.0               # azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg or fraction of A]
    lift_t: 289.9                   # when the lift actually latched [s]
    lift_remaining_m: 6.5           # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
