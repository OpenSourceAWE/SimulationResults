  force:
    cf_force_ro: 1.83               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 2.28               # crest factor: peak / mean reel-out power over the reeling window
    duration: 265.4                 # reeling window length [s]
    n_samples: 23883                # sample count in the reeling window
    energy_kJ: 226.1                # energy over the reeling window [kJ]
    energy_run_kJ: 212.7            # energy over the whole run [kJ]
  winch_state:
