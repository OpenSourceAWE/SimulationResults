      t_065.2_s: 5.2                # wall time from the first request to the verdict (installed), every retry included, at L = 150 m [s]
      t_105.9_s: 6.0                # wall time from the first request to the verdict (installed), every retry included, at L = 184 m [s]
      t_149.9_s: 5.5                # wall time from the first request to the verdict (installed), every retry included, at L = 226 m [s]
      t_197.1_s: 6.5                # wall time from the first request to the verdict (installed), every retry included, at L = 274 m [s]
      t_247.8_s: 5.5                # wall time from the first request to the verdict (installed), every retry included, at L = 329 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
