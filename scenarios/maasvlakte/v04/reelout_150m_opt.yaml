    fastest: 25.9                   # shortest time for one full figure of eight — lap 1, starting at t = 26.3 s [s]
    mean: 34.5                      # mean time per full figure of eight, over 7 laps [s]
    slowest: 44.8                   # longest time for one full figure of eight — lap 7 [s]
  cross_track_deg:
    rms: 1.16                       # RMS cross-track error vs the unlifted optimizer path [deg]
    mean: 0.84                      # mean cross-track error vs the unlifted optimizer path [deg]
    max: 4.97                       # max cross-track error vs the unlifted optimizer path [deg]
  elevation_deg:
    min_settled: 10.1               # min elevation, settled window [deg]
    min_whole_run: 10.1             # min elevation, whole run [deg]
