      min: -16.7                    # weakest lobe, negative side [deg]
      max: 16.4                     # weakest lobe, positive side [deg]
    elevation_span_deg: 23.6        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 9.7     # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 95     # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 1099                      # mean tether force, settled window [N]
    std: 248                        # std tether force, settled window [N]
    cv_pct: 22.5                    # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.32              # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 11 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0094         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.16     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.32    # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.32    # peak steering commanded
    rate_limited_pct_time: 4        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
