      t_066.5_s: 1.408              # optimizer's l_dp [m]; rel_depower equivalent 0.263 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_079.8_s: 1.406              # optimizer's l_dp [m]; rel_depower equivalent 0.262 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
