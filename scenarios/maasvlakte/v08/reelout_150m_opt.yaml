    commanded_el_height_deg: 8.72   # mean commanded pattern height [deg]
    wing_deg: 1.0                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 8.6             # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 8.56          # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 4.91     # reach margin: flew 15.26° against the 10.35° required by min_span_frac = 0.70, +47 %
    azimuth_reach_neg_deg: 5.26     # reach margin: flew 15.61° against the 10.35° required by min_span_frac = 0.70, +51 %
    elevation_span_deg: 3.16        # reach margin: flew 9.27° against the 6.10° required by min_span_frac = 0.70, +52 %
    tightest: "elevation span"      # the size criterion with the least room, +3.16° (+52 %) — what the NEXT lift has to spend
  clearance:
