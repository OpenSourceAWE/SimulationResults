      t_090.3_s: "blended in (100 % of the mean, 50 % of the spread)" # -0.00° of shift (mean over the bands), curvature margin 0.83 vs 0.82 required
    laps:
      lap_1: -1.08                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.08°, correction became [+0.60 +0.61 +0.66 +0.61 +0.40]° (crossing … lobe)
      lap_2: -0.46                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.01°, correction became [+0.59 +0.76 +1.00 +1.12 +0.70]° (crossing … lobe)
      lap_3: -0.19                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.99°, correction became [+0.55 +0.77 +1.18 +1.38 +0.89]° (crossing … lobe)
