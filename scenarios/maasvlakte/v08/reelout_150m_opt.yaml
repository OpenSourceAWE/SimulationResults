      t_041.7_s: 5.5                # wall time from the first request to the verdict (installed), every retry included, at L = 227 m [s]
      t_053.9_s: 6.1                # wall time from the first request to the verdict (installed), every retry included, at L = 266 m [s]
      t_066.5_s: 7.1                # wall time from the first request to the verdict (installed), every retry included, at L = 307 m [s]
      t_079.8_s: 6.0                # wall time from the first request to the verdict (installed), every retry included, at L = 349 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
