      lap_2: "+0.08 -0.34 -0.72 -1.29 -0.29" # error vs the optimizer's curve per band, crossing first; 208/211/173/175/306 samples, correction now [+0.59 +0.76 +1.00 +1.12 +0.70]° (crossing … lobe)
      lap_3: "+0.17 -0.04 -0.45 -0.87 -0.01" # error vs the optimizer's curve per band, crossing first; 211/213/192/158/295 samples, correction now [+0.55 +0.77 +1.18 +1.38 +0.89]° (crossing … lobe)
      lap_4: "+0.33 +0.06 -0.32 -0.42 +0.34" # error vs the optimizer's curve per band, crossing first; 234/244/207/163/302 samples, correction now [+0.44 +0.74 +1.27 +1.41 +0.90]° (crossing … lobe)
      lap_5: "-0.20 -0.30 -0.40 -0.44 +0.36" # error vs the optimizer's curve per band, crossing first; 230/239/207/173/257 samples, correction now [+0.60 +0.89 +1.38 +1.47 +0.92]° (crossing … lobe)
