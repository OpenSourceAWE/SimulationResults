      t_078.2_s: "blended in (100 % of the mean, 25 % of the spread)" # +0.00° of shift (mean over the bands), curvature margin 0.84 vs 0.82 required
      t_082.2_s: "blended in (100 % of the mean, 25 % of the spread)" # +3.10° of shift (mean over the bands), curvature margin 0.83 vs 0.82 required
