      t_031.1_s: 1.479              # optimizer's l_dp [m]; rel_depower equivalent 0.277 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_047.6_s: 1.486              # optimizer's l_dp [m]; rel_depower equivalent 0.278 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_067.1_s: 1.469              # optimizer's l_dp [m]; rel_depower equivalent 0.275 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    depower_optimized_rel:
      t_000.0_s: 0.2751             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_031.1_s: 0.2769             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_047.6_s: 0.2782             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
      t_067.1_s: 0.2749             # the same reply as V3Kite rel_depower, converted with the AWETRIM_V3KITE_DEPOWER_OFFSET in force at run time; what a replot's u_d panel draws [-]
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: -0.6             # centre azimuth of the path [deg]
    az_amplitude_deg: 21.4          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 24.6             # centre elevation of the path [deg]
    el_height_deg: 13.6             # elevation span of the path, peak to peak [deg]
    lobe_lift_pct: 100              # share of el_offset_wing the STARTUP install carried; held back on the same rungs as a mid-run install when the full lift fails the curvature gate
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 16.99    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.595        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    c1_pattern: 0.242               # turn-rate gain the startup gate and requests read the path at: at the depower the pattern is FLOWN at (the optimizer's own under fly_opt_depower), not depower_setpoint's [1/m]
    gain_scale_flown: 1.005         # heading_p factor phases 3-4 flew with, c1(depower_setpoint)/c1(flown) for the startup reply; 1.0 when the optimizer's depower is the setpoint [-]
    margin_start: 0.83              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.11                # curvature margin at reelout_l_max [-]
    c1_final: 0.1655                # turn-rate gain at depower_final [1/m]
    margin_final: 1.39              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 1.05        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 3                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked: 12.6                   # wall time the simulation was frozen waiting for replies [s]
    installed: 3                    # new paths actually flown
    cycle_wall:
      t_031.1_s: 5.3                # wall time from the first request to the verdict (installed), every retry included, at L = 195 m [s]
      t_047.6_s: 4.1                # wall time from the first request to the verdict (installed), every retry included, at L = 251 m [s]
      t_067.1_s: 4.0                # wall time from the first request to the verdict (installed), every retry included, at L = 315 m [s]
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_031.1_s: "installed — margin 1.18 (phase 5: 1.58 at 380 m), clearance 49.1 m, 23638 W predicted" # at L = 195 m
      t_047.6_s: "installed — margin 1.20 (phase 5: 1.26 at 380 m), clearance 54.7 m, 23768 W predicted" # at L = 251 m
      t_067.1_s: "installed — margin 1.27 (phase 5: 1.05 at 380 m), clearance 70.2 m, 23726 W predicted" # at L = 315 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 0.77                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [0.2, 0.48, 0.97, 1.25, 0.96] # the learnt correction per band, crossing first [deg]
    lift_deg: 3.0                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead: 8.0                  # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t: 79.1                    # when the lift actually latched [s]
    lift_remaining_m: 25.3          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_035.2_s: "blended in"       # +0.50° of shift (mean over the bands), curvature margin 1.26 vs 0.82 required
      t_051.6_s: "blended in"       # +0.26° of shift (mean over the bands), curvature margin 1.26 vs 0.82 required
      t_071.1_s: "blended in"       # +0.01° of shift (mean over the bands), curvature margin 1.30 vs 0.82 required
      t_079.1_s: "blended in"       # +3.00° of shift (mean over the bands), curvature margin 1.43 vs 0.82 required
    laps:
      lap_1: -0.94                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.94°, correction became [+0.49 +0.59 +0.57 +0.51 +0.35]° (crossing … lobe)
      lap_2: -0.49                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.98°, correction became [+0.29 +0.59 +0.98 +1.12 +0.80]° (crossing … lobe)
      lap_3: -0.01                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.76°, correction became [+0.20 +0.48 +0.97 +1.25 +0.96]° (crossing … lobe)
    lap_profiles:
      lap_1: "-0.91 -1.27 -1.16 -1.09 -0.59" # error vs the optimizer's curve per band, crossing first; 206/208/185/185/360 samples, correction now [+0.49 +0.59 +0.57 +0.51 +0.35]° (crossing … lobe)
      lap_2: "+0.53 -0.02 -0.92 -1.47 -0.68" # error vs the optimizer's curve per band, crossing first; 295/262/260/244/417 samples, correction now [+0.29 +0.59 +0.98 +1.12 +0.80]° (crossing … lobe)
      lap_3: "+0.32 +0.22 -0.06 -0.51 -0.09" # error vs the optimizer's curve per band, crossing first; 355/325/307/292/476 samples, correction now [+0.20 +0.48 +0.97 +1.25 +0.96]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 1.32              # kite below the path's elevation centre [deg], over 1898 samples; the path itself sits 0.15 half-spans down there and the kite -0.39° under it
    az_20_40_pct: 0.55              # kite below the path's elevation centre [deg], over 1678 samples; the path itself sits -0.03 half-spans down there and the kite -0.71° under it
    az_40_60_pct: 1.13              # kite below the path's elevation centre [deg], over 1441 samples; the path itself sits -0.02 half-spans down there and the kite -1.27° under it
    az_60_80_pct: 1.49              # kite below the path's elevation centre [deg], over 1378 samples; the path itself sits -0.03 half-spans down there and the kite -1.63° under it
    az_80_100_pct: 0.83             # kite below the path's elevation centre [deg], over 2117 samples; the path itself sits -0.01 half-spans down there and the kite -0.84° under it
    centre_to_lobe_deg: 0.17        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 3.77             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [3.2, 3.48, 3.97, 4.25, 3.96] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 23.01     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 12.69  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 10.8            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 14.24         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 8.15     # reach margin: flew 24.26° against the 16.11° required by min_span_frac = 0.70, +51 %
    azimuth_reach_neg_deg: 7.89     # reach margin: flew 24.00° against the 16.11° required by min_span_frac = 0.70, +49 %
    elevation_span_deg: 5.71        # reach margin: flew 14.59° against the 8.88° required by min_span_frac = 0.70, +64 %
    tightest: "elevation span"      # the size criterion with the least room, +5.71° (+64 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 46.0                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 39.6               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 9.5    # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 9.0             # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0408               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 8000.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
