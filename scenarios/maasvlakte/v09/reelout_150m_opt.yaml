    steady_v_reelout_m_s: 3.23      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 23628              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 23290      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 23290              # 20% of the reeling window
      t_031.1_s: 23638              # 23% of the reeling window
      t_047.6_s: 23768              # 27% of the reeling window
      t_067.1_s: 23726              # 29% of the reeling window
    measured_W: 20837               # mean reel-out power the run harvested [W]
    ratio: 0.88                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 30.0             # centre elevation of the guess the startup path was solved from; guess_el_center_high at and above guess_el_center_wind_ref, plus the retry offset below [deg]
    el_center_retry_offset_deg: 0.0 # startup_retry_el_offsets entry the startup solve converged from after a 422; 0 means the shipped guess converged [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
