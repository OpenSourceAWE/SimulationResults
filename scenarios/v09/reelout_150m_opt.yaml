      lap_2: "+0.37 -0.04 -0.62 -1.13 -0.44" # error vs the optimizer's curve per band, crossing first; 160/164/141/151/263 samples, correction now [+0.33 +0.52 +0.83 +0.97 +0.66]° (crossing … lobe)
      lap_3: "+0.29 +0.01 -0.46 -0.74 -0.04" # error vs the optimizer's curve per band, crossing first; 168/179/155/144/251 samples, correction now [+0.25 +0.52 +1.00 +1.20 +0.82]° (crossing … lobe)
      lap_4: "+0.14 -0.04 -0.35 -0.70 +0.14" # error vs the optimizer's curve per band, crossing first; 178/191/166/136/236 samples, correction now [+0.24 +0.54 +1.12 +1.37 +0.92]° (crossing … lobe)
      lap_5: "+0.14 +0.02 -0.28 -0.72 +0.20" # error vs the optimizer's curve per band, crossing first; 187/201/181/119/240 samples, correction now [+0.23 +0.55 +1.20 +1.53 +1.02]° (crossing … lobe)
