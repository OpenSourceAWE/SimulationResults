      lap_2: "+0.20 -0.22 -0.77 -1.15 -0.45" # error vs the optimizer's curve per band, crossing first; 171/175/143/159/270 samples, correction now [+0.49 +0.67 +0.95 +1.04 +0.70]° (crossing … lobe)
