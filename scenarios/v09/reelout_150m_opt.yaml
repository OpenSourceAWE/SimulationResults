    steady_v_reelout_m_s: 3.3       # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 23859              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 23398      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 23398              # 18% of the reeling window
      t_037.6_s: 24002              # 20% of the reeling window
      t_051.7_s: 24111              # 25% of the reeling window
      t_069.3_s: 24076              # 31% of the reeling window
      t_091.4_s: 22351              # 5% of the reeling window
    measured_W: 22069               # mean reel-out power the run harvested [W]
    ratio: 0.92                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.466              # optimizer's l_dp [m]; rel_depower equivalent 0.272 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_037.6_s: 1.474              # optimizer's l_dp [m]; rel_depower equivalent 0.274 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_051.7_s: 1.473              # optimizer's l_dp [m]; rel_depower equivalent 0.274 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_069.3_s: 1.457              # optimizer's l_dp [m]; rel_depower equivalent 0.270 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_091.4_s: 1.518              # optimizer's l_dp [m]; rel_depower equivalent 0.283 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: -0.9             # centre azimuth of the path [deg]
    az_amplitude_deg: 21.6          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 24.4             # centre elevation of the path [deg]
    el_height_deg: 13.6             # elevation span of the path, peak to peak [deg]
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 15.04    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.391        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    margin_start: 0.92              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.34                # curvature margin at reelout_l_max [-]
    c1_final: 0.1919                # turn-rate gain at depower_final [1/m]
    margin_final: 1.58              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.71        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked_s: 21.7                 # wall time the simulation was frozen waiting for replies [s]
    installed: 4                    # new paths actually flown
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_037.6_s: "installed — margin 1.30 (phase 5: 1.81 at 380 m), clearance 47.6 m, 24002 W predicted" # at L = 190 m
      t_051.7_s: "installed — margin 1.47 (phase 5: 1.63 at 380 m), clearance 53.0 m, 24111 W predicted" # at L = 238 m
      t_069.3_s: "installed — margin 1.48 (phase 5: 1.31 at 380 m), clearance 64.2 m, 24076 W predicted" # at L = 298 m
      t_091.4_s: "installed — margin 1.01 (phase 5: 0.71 at 380 m), clearance 115.4 m, 22351 W predicted" # at L = 373 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 1.51                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [0.9, 1.19, 1.79, 2.23, 1.41] # the learnt correction per band, crossing first [deg]
    lift_deg: 1.5                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead_s: 8.0                # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t_s: 85.2                  # when the lift actually latched [s]
    lift_remaining_m: 27.7          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_041.6_s: "blended in"       # +0.47° of shift (mean over the bands), curvature margin 1.39 vs 0.82 required
      t_055.7_s: "blended in"       # +0.17° of shift (mean over the bands), curvature margin 1.61 vs 0.82 required
      t_073.4_s: "blended in"       # -0.04° of shift (mean over the bands), curvature margin 1.56 vs 0.82 required
      t_085.2_s: "blended in"       # +1.50° of shift (mean over the bands), curvature margin 1.78 vs 0.82 required
    laps:
      lap_1: -0.89                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.89°, correction became [+0.33 +0.42 +0.56 +0.60 +0.42]° (crossing … lobe)
      lap_2: -0.3                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.76°, correction became [+0.18 +0.40 +0.83 +1.03 +0.72]° (crossing … lobe)
      lap_3: 0.12                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.49°, correction became [+0.00 +0.28 +0.81 +1.07 +0.78]° (crossing … lobe)
      lap_5: -0.85                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.44°, correction became [+0.90 +1.19 +1.79 +2.23 +1.41]° (crossing … lobe)
    lap_profiles:
      lap_1: "-0.63 -0.84 -1.16 -1.31 -0.72" # error vs the optimizer's curve per band, crossing first; 201/186/167/161/295 samples, correction now [+0.33 +0.42 +0.56 +0.60 +0.42]° (crossing … lobe)
      lap_2: "+0.40 +0.04 -0.63 -1.10 -0.37" # error vs the optimizer's curve per band, crossing first; 267/239/220/219/322 samples, correction now [+0.18 +0.40 +0.83 +1.03 +0.72]° (crossing … lobe)
      lap_3: "+0.47 +0.28 -0.08 -0.33 +0.11" # error vs the optimizer's curve per band, crossing first; 348/313/278/262/388 samples, correction now [+0.00 +0.28 +0.81 +1.07 +0.78]° (crossing … lobe)
      lap_5: "-0.86 -0.92 -1.01 -1.48 -0.31" # error vs the optimizer's curve per band, crossing first; 263/299/241/241/398 samples, correction now [+0.90 +1.19 +1.79 +2.23 +1.41]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 1.61              # kite below the path's elevation centre [deg], over 1691 samples; the path itself sits 0.28 half-spans down there and the kite -0.17° under it
    az_20_40_pct: 1.05              # kite below the path's elevation centre [deg], over 1601 samples; the path itself sits 0.12 half-spans down there and the kite -0.61° under it
    az_40_60_pct: 1.13              # kite below the path's elevation centre [deg], over 1329 samples; the path itself sits 0.01 half-spans down there and the kite -1.25° under it
    az_60_80_pct: 1.84              # kite below the path's elevation centre [deg], over 1261 samples; the path itself sits 0.06 half-spans down there and the kite -1.66° under it
    az_80_100_pct: 1.05             # kite below the path's elevation centre [deg], over 1897 samples; the path itself sits 0.05 half-spans down there and the kite -0.82° under it
    centre_to_lobe_deg: 0.23        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 2.09             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [1.5, 1.78, 2.31, 2.57, 2.28] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 21.42     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 12.11  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 12.1            # lowest elevation over the whole run — set in phase 4, so a phase-5 lift does not move it [deg]
    el_min_final_deg: 14.34         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 6.36     # reach margin: flew 21.36° against the 14.99° required by min_span_frac = 0.70, +42 %
    azimuth_reach_neg_deg: 6.59     # reach margin: flew 21.58° against the 14.99° required by min_span_frac = 0.70, +44 %
    elevation_span_deg: 3.44        # reach margin: flew 11.92° against the 8.47° required by min_span_frac = 0.70, +41 %
    tightest: "elevation span"      # the size criterion with the least room, +3.44° (+41 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 45.3                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 46.2               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 9.5    # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 9.0             # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0408               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 8000.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 1e-03/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
