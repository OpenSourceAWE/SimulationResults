  project: "system_reelout_150m.yaml" # system project flown
  rel_turbulence: 0.0               # turbulence level in [0, 1] passed to init
  wind_speed: 10.0                  # mean wind speed in m/s passed to init
  time: "23:08:43"                  # wall-clock time the run finished
  date: "2026-08-20"                # wall-clock date the run finished
  hostname: "ufryzen"               # machine the run executed on
  git_hash: "4bcb715"               # SimpleKiteControllers.jl commit hash
  git_status: "dirty"               # SimpleKiteControllers.jl working tree: clean or dirty
