      max: 17.8                     # weakest lobe, positive side [deg]
    elevation_span_deg: 23.5        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 13.6    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 105    # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 6489                      # mean tether force, settled window [N]
    std: 629                        # std tether force, settled window [N]
    cv_pct: 9.7                     # coefficient of variation [%]
