    az_80_100_pct: 1.93             # kite below the path's elevation centre [deg], over 1643 samples; the path itself sits 0.23 half-spans down there and the kite -1.15° under it
    centre_to_lobe_deg: 0.57        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
