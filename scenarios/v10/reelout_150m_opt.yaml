      lap_2: -0.21                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.67°, correction became [+0.27 +0.42 +0.69 +0.90 +0.63]° (crossing … lobe)
      lap_3: -0.23                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.80°, correction became [+0.25 +0.46 +0.90 +1.16 +0.81]° (crossing … lobe)
      lap_5: -0.71                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.42°, correction became [+0.88 +1.19 +1.99 +2.29 +1.38]° (crossing … lobe)
      lap_6: -1.42                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -2.90°, correction became [+2.80 +3.06 +3.68 +3.79 +2.48]° (crossing … lobe)
    lap_profiles:
      lap_1: "-0.95 -0.94 -1.03 -1.27 -0.55" # error vs the optimizer's curve per band, crossing first; 166/170/147/132/260 samples, correction now [+0.47 +0.47 +0.51 +0.57 +0.36]° (crossing … lobe)
      lap_2: "+0.46 +0.08 -0.38 -0.89 -0.34" # error vs the optimizer's curve per band, crossing first; 167/171/155/153/270 samples, correction now [+0.27 +0.42 +0.69 +0.90 +0.63]° (crossing … lobe)
      lap_3: "+0.11 -0.06 -0.50 -0.82 -0.09" # error vs the optimizer's curve per band, crossing first; 185/188/183/133/230 samples, correction now [+0.25 +0.46 +0.90 +1.16 +0.81]° (crossing … lobe)
      lap_5: "-0.59 -0.70 -1.18 -1.43 -0.23" # error vs the optimizer's curve per band, crossing first; 154/166/150/103/258 samples, correction now [+0.88 +1.19 +1.99 +2.29 +1.38]° (crossing … lobe)
      lap_6: "-1.91 -1.88 -1.79 -1.88 -0.62" # error vs the optimizer's curve per band, crossing first; 147/157/130/106/306 samples, correction now [+2.80 +3.06 +3.68 +3.79 +2.48]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 2.47              # kite below the path's elevation centre [deg], over 1092 samples; the path itself sits 0.37 half-spans down there and the kite -0.85° under it
    az_20_40_pct: 2.48              # kite below the path's elevation centre [deg], over 1112 samples; the path itself sits 0.33 half-spans down there and the kite -1.15° under it
    az_40_60_pct: 2.49              # kite below the path's elevation centre [deg], over 1010 samples; the path itself sits 0.20 half-spans down there and the kite -1.78° under it
