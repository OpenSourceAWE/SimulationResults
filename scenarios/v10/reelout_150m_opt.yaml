    steady_v_reelout_m_s: 3.29      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 23927              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 23235      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 23235              # 27% of the reeling window
      t_040.9_s: 24118              # 24% of the reeling window
      t_057.1_s: 24228              # 29% of the reeling window
      t_076.8_s: 24213              # 20% of the reeling window
    measured_W: 20866               # mean reel-out power the run harvested [W]
    ratio: 0.87                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.537              # optimizer's l_dp [m]; rel_depower equivalent 0.286 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_040.9_s: 1.592              # optimizer's l_dp [m]; rel_depower equivalent 0.297 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_057.1_s: 1.583              # optimizer's l_dp [m]; rel_depower equivalent 0.296 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_076.8_s: 1.575              # optimizer's l_dp [m]; rel_depower equivalent 0.294 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: -0.0             # centre azimuth of the path [deg]
    az_amplitude_deg: 29.1          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 27.8             # centre elevation of the path [deg]
    el_height_deg: 17.9             # elevation span of the path, peak to peak [deg]
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.2       # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 14.18    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.517        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    margin_start: 0.82              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.08                # curvature margin at reelout_l_max [-]
    c1_final: 0.1919                # turn-rate gain at depower_final [1/m]
    margin_final: 1.4               # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 1.72        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 3                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked_s: 13.6                 # wall time the simulation was frozen waiting for replies [s]
    installed: 3                    # new paths actually flown
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_040.9_s: "installed — margin 1.40 (phase 5: 1.78 at 380 m), clearance 49.7 m, 24118 W predicted" # at L = 208 m
      t_057.1_s: "installed — margin 1.70 (phase 5: 1.72 at 380 m), clearance 57.8 m, 24228 W predicted" # at L = 261 m
      t_076.8_s: "installed — margin 2.13 (phase 5: 1.72 at 380 m), clearance 76.5 m, 24213 W predicted" # at L = 326 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 0.49                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [-0.3, 0.11, 0.82, 1.1, 0.69] # the learnt correction per band, crossing first [deg]
    lift_deg: 1.5                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead_s: 8.0                # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t_s: 85.6                  # when the lift actually latched [s]
    lift_remaining_m: 25.3          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_044.9_s: "blended in"       # +0.14° of shift (mean over the bands), curvature margin 1.31 vs 0.82 required
      t_061.1_s: "blended in"       # +0.10° of shift (mean over the bands), curvature margin 1.71 vs 0.82 required
      t_080.8_s: "blended in"       # +0.24° of shift (mean over the bands), curvature margin 2.17 vs 0.82 required
      t_085.6_s: "blended in"       # +1.50° of shift (mean over the bands), curvature margin 2.24 vs 0.82 required
    laps:
      lap_1: -0.49                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.49°, correction became [-0.59 -0.31 +0.39 +0.76 +0.45]° (crossing … lobe)
      lap_2: -0.21                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.40°, correction became [-0.81 -0.28 +0.57 +1.03 +0.70]° (crossing … lobe)
      lap_3: -0.43                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.66°, correction became [-0.30 +0.11 +0.82 +1.10 +0.69]° (crossing … lobe)
    lap_profiles:
      lap_1: "+1.29 +0.70 -0.91 -1.84 -0.65" # error vs the optimizer's curve per band, crossing first; 175/241/478/250/398 samples, correction now [-0.59 -0.31 +0.39 +0.76 +0.45]° (crossing … lobe)
      lap_2: "+0.70 -0.06 -0.51 -0.91 -0.22" # error vs the optimizer's curve per band, crossing first; 241/262/268/252/433 samples, correction now [-0.81 -0.28 +0.57 +1.03 +0.70]° (crossing … lobe)
      lap_3: "-0.85 -0.75 -0.68 -0.47 +0.30" # error vs the optimizer's curve per band, crossing first; 352/361/310/274/473 samples, correction now [-0.30 +0.11 +0.82 +1.10 +0.69]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: -3.8              # kite below the path's elevation centre [deg], over 992 samples; the path itself sits -0.39 half-spans down there and the kite 0.59° under it
    az_20_40_pct: -3.38             # kite below the path's elevation centre [deg], over 1056 samples; the path itself sits -0.40 half-spans down there and the kite 0.02° under it
    az_40_60_pct: 0.54              # kite below the path's elevation centre [deg], over 1263 samples; the path itself sits -0.05 half-spans down there and the kite -1.00° under it
    az_60_80_pct: 2.97              # kite below the path's elevation centre [deg], over 1026 samples; the path itself sits 0.18 half-spans down there and the kite -1.54° under it
    az_80_100_pct: 2.23             # kite below the path's elevation centre [deg], over 1623 samples; the path itself sits 0.21 half-spans down there and the kite -0.53° under it
    centre_to_lobe_deg: 6.77        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 1.99             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [1.2, 1.61, 2.32, 2.6, 2.19] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 25.73     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 16.54  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 11.2            # lowest elevation over the whole run — set in phase 4, so a phase-5 lift does not move it [deg]
    el_min_final_deg: "n/a"         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 8.44     # reach margin: flew 26.46° against the 18.01° required by min_span_frac = 0.70, +47 %
    azimuth_reach_neg_deg: 8.38     # reach margin: flew 26.39° against the 18.01° required by min_span_frac = 0.70, +47 %
    elevation_span_deg: 5.78        # reach margin: flew 17.36° against the 11.58° required by min_span_frac = 0.70, +50 %
    tightest: "elevation span"      # the size criterion with the least room, +5.78° (+50 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 48.3                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 45.6               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 9.5    # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 10.0            # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0408                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.0408               # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 8000.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 1e-03/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
