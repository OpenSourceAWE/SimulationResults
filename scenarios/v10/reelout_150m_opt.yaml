  optimization_time_s: 46.7         # wall time waiting for the optimizer: the startup solve (9.0 s) plus every blocking re-optimization (traj_opt.reopt.blocked_s) [s]
  realtime_factor: 3.18             # sim_time / wall_time, excluding time frozen for re-optimization
