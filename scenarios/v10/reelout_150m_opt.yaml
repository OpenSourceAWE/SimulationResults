    max: 4.9                        # max cross-track error [deg]
  elevation_deg:
    min_settled: 10.4               # min elevation, settled window [deg]
    min_whole_run: 10.4             # min elevation, whole run [deg]
  peak_turn_rate_deg_s: 127         # peak heading rate [deg/s]
  extent:
    azimuth_deg:
      min: -17.3                    # flown azimuth reach, negative side [deg]
      max: 15.2                     # flown azimuth reach, positive side [deg]
    azimuth_pct_of_amplitude:
      min: 106                      # negative reach as % of the pattern's ±A
      max: 102                      # positive reach as % of the pattern's ±A
    worst_lobe_deg:
      min: -12.5                    # weakest lobe, negative side [deg]
      max: 11.4                     # weakest lobe, positive side [deg]
    elevation_span_deg: 19.7        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 9.5     # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 102    # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 7886                      # mean tether force, settled window [N]
    std: 482                        # std tether force, settled window [N]
    cv_pct: 6.1                     # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.306             # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 0 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.005          # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.97     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.227   # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.306   # peak steering commanded
    rate_limited_pct_time: 5        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
  success_criteria: "all 9 passed"  # pass/fail verdict vs V3Kite's success criteria
reelout:
