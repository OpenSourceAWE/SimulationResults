      max: 18.8                     # weakest lobe, positive side [deg]
    elevation_span_deg: 25.0        # flown elevation span over the whole settled window — the pattern DESCENDS as the tether grows, so this is mostly that descent [deg]
    elevation_span_lap_deg: 14.4    # flown elevation span per lobe, which is the pattern's own height [deg]
    elevation_span_pct_of_b: 119    # flown span as % of the B commanded where it was flown
  tether_force_N:
    mean: 6244                      # mean tether force, settled window [N]
    std: 724                        # std tether force, settled window [N]
    cv_pct: 11.6                    # coefficient of variation [%]
  steering:
    peak_abs_u_s: 0.261             # peak |rel_steering| commanded
    pct_time_within_2pct_of_peak: 0 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0029         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 0.32     # high-frequency std of heading rate [deg/s]
  tape:
    delivered_peak_abs_u_s: 0.237   # peak steering the KCU tape delivered
    commanded_peak_abs_u_s: 0.261   # peak steering commanded
    rate_limited_pct_time: 0        # % of time the tape's rate limit was hit
    rate_limited_peak_per_s: 0.2    # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
  v_app_phase4:
    duration_s: 72.4                # phase-4 window length [s]
    mean_m_s: 31.9                  # mean apparent wind speed [m/s]
    min_m_s: 27.92                  # min apparent wind speed [m/s]
    max_m_s: 34.5                   # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: 18.1             # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 5.52               # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.17               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.24               # crest factor: peak / mean reel-out power over the reeling window
    duration_s: 74.5                # reeling window length [s]
    n_samples: 6701                 # sample count in the reeling window
    energy_kJ: 1501.2               # energy over the reeling window [kJ]
    energy_run_kJ: 1498.4           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 6701                 # sample count in the reeling window
  ringing:
    n_peaks: 7                      # ring peaks detected above peak_floor
    period_s: 2.6                   # mean peak-to-peak ring period [s]
    zeta: 0.079                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.54             # first ring peak's amplitude above the local trend [m/s]
    duration_s: 20.0                # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 3.46        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 3.13      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 24561              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 22180      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 22180              # 21% of the reeling window
      t_031.6_s: 24350              # 18% of the reeling window
      t_045.3_s: 25300              # 20% of the reeling window
      t_059.9_s: 25516              # 24% of the reeling window
      t_077.7_s: 25559              # 17% of the reeling window
    measured_W: 20163               # mean reel-out power the run harvested [W]
    ratio: 0.82                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.594              # optimizer's l_dp [m]; rel_depower equivalent 0.300 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_031.6_s: 1.602              # optimizer's l_dp [m]; rel_depower equivalent 0.301 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_045.3_s: 1.591              # optimizer's l_dp [m]; rel_depower equivalent 0.299 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_059.9_s: 1.577              # optimizer's l_dp [m]; rel_depower equivalent 0.296 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_077.7_s: 1.568              # optimizer's l_dp [m]; rel_depower equivalent 0.295 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.2              # centre azimuth of the path [deg]
    az_amplitude_deg: 24.0          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 27.5             # centre elevation of the path [deg]
    el_height_deg: 14.8             # elevation span of the path, peak to peak [deg]
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 15.87    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.504        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    margin_start: 1.03              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.6                 # curvature margin at reelout_l_max [-]
    c1_final: 0.1655                # turn-rate gain at depower_final [1/m]
    margin_final: 1.69              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.86        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked_s: 16.6                 # wall time the simulation was frozen waiting for replies [s]
    installed: 4                    # new paths actually flown
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_031.6_s: "installed — margin 1.19 (phase 5: 1.57 at 380 m), clearance 53.2 m, 24350 W predicted" # at L = 196 m
      t_045.3_s: "installed — margin 0.97 (phase 5: 1.05 at 380 m), clearance 59.0 m, 25300 W predicted" # at L = 241 m
      t_059.9_s: "installed — margin 0.97 (phase 5: 0.87 at 380 m), clearance 80.2 m, 25516 W predicted" # at L = 288 m
      t_077.7_s: "installed — margin 1.15 (phase 5: 0.86 at 380 m), clearance 92.8 m, 25559 W predicted" # at L = 345 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 1.56                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [1.14, 1.56, 2.07, 1.91, 1.12] # the learnt correction per band, crossing first [deg]
    lift_deg: 3.0                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead_s: 8.0                # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t_s: 80.8                  # when the lift actually latched [s]
    lift_remaining_m: 25.7          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_035.6_s: "blended in"       # +0.95° of shift (mean over the bands), curvature margin 0.87 vs 0.82 required
      t_049.3_s: "blended in"       # +0.43° of shift (mean over the bands), curvature margin 0.82 vs 0.82 required
      t_064.0_s: "blended in"       # +0.11° of shift (mean over the bands), curvature margin 0.96 vs 0.82 required
      t_081.7_s: "blended in"       # +3.08° of shift (mean over the bands), curvature margin 1.07 vs 0.82 required
    laps:
      lap_1: -1.78                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.78°, correction became [+0.66 +0.89 +1.20 +1.26 +0.76]° (crossing … lobe)
      lap_2: -0.76                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.69°, correction became [+0.95 +1.25 +1.74 +1.87 +1.11]° (crossing … lobe)
      lap_3: -0.11                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.42°, correction became [+1.08 +1.47 +1.88 +1.88 +1.12]° (crossing … lobe)
      lap_4: -0.06                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.49°, correction became [+1.14 +1.56 +2.07 +1.91 +1.12]° (crossing … lobe)
    lap_profiles:
      lap_1: "-1.24 -1.82 -2.50 -2.83 -1.15" # error vs the optimizer's curve per band, crossing first; 224/206/203/203/401 samples, correction now [+0.66 +0.89 +1.20 +1.26 +0.76]° (crossing … lobe)
      lap_2: "-0.46 -0.76 -1.21 -1.70 -0.14" # error vs the optimizer's curve per band, crossing first; 221/222/193/224/374 samples, correction now [+0.95 +1.25 +1.74 +1.87 +1.11]° (crossing … lobe)
      lap_3: "-0.10 -0.55 -0.46 -0.45 +0.50" # error vs the optimizer's curve per band, crossing first; 262/270/184/194/407 samples, correction now [+1.08 +1.47 +1.88 +1.88 +1.12]° (crossing … lobe)
      lap_4: "+0.07 -0.27 -0.64 -0.44 +0.53" # error vs the optimizer's curve per band, crossing first; 340/317/229/277/435 samples, correction now [+1.14 +1.56 +2.07 +1.91 +1.12]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 2.27              # kite below the path's elevation centre [deg], over 1597 samples; the path itself sits 0.21 half-spans down there and the kite -1.00° under it
    az_20_40_pct: 1.96              # kite below the path's elevation centre [deg], over 1620 samples; the path itself sits 0.04 half-spans down there and the kite -1.68° under it
    az_40_60_pct: 2.29              # kite below the path's elevation centre [deg], over 1175 samples; the path itself sits -0.04 half-spans down there and the kite -2.45° under it
    az_60_80_pct: 3.39              # kite below the path's elevation centre [deg], over 1383 samples; the path itself sits 0.12 half-spans down there and the kite -2.67° under it
    az_80_100_pct: 1.98             # kite below the path's elevation centre [deg], over 2362 samples; the path itself sits 0.20 half-spans down there and the kite -0.89° under it
    centre_to_lobe_deg: 1.13        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 4.56             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [4.14, 4.56, 5.07, 4.91, 4.12] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 20.69     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 12.22  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 10.0            # lowest elevation over the whole run — usually set in PHASE 5 at 4 m/s and up, so el_offset_final does move it; the entry sets it below that [deg]
    el_min_final_deg: 14.16         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 7.43     # reach margin: flew 21.91° against the 14.48° required by min_span_frac = 0.70, +51 %
    azimuth_reach_neg_deg: 6.42     # reach margin: flew 20.90° against the 14.48° required by min_span_frac = 0.70, +44 %
    elevation_span_deg: 5.95        # reach margin: flew 14.50° against the 8.55° required by min_span_frac = 0.70, +70 %
    tightest: "elevation span"      # the size criterion with the least room, +5.95° (+70 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 51.5                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 40.0               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 9.5    # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 10.0            # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.039                      # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.039                # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 8000.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 3e-02/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
performance:
