      t_067.0_s: "blended in"       # +0.14° of shift (mean over the bands), curvature margin 1.17 vs 0.82 required
      t_081.6_s: "blended in"       # +0.10° of shift (mean over the bands), curvature margin 1.36 vs 0.82 required
      t_085.6_s: "blended in"       # +1.50° of shift (mean over the bands), curvature margin 1.42 vs 0.82 required
    laps:
      lap_1: -0.84                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.84°, correction became [+0.29 +0.50 +0.64 +0.55 +0.31]° (crossing … lobe)
      lap_2: -0.33                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.78°, correction became [+0.06 +0.39 +0.94 +1.08 +0.64]° (crossing … lobe)
      lap_3: -0.23                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.84°, correction became [+0.11 +0.47 +1.14 +1.33 +0.79]° (crossing … lobe)
      lap_4: -0.13                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.84°, correction became [+0.29 +0.62 +1.29 +1.37 +0.79]° (crossing … lobe)
    lap_profiles:
      lap_1: "-0.45 -1.08 -1.38 -1.22 -0.45" # error vs the optimizer's curve per band, crossing first; 208/208/159/153/297 samples, correction now [+0.29 +0.50 +0.64 +0.55 +0.31]° (crossing … lobe)
      lap_2: "+0.61 +0.21 -0.76 -1.34 -0.36" # error vs the optimizer's curve per band, crossing first; 189/229/217/203/312 samples, correction now [+0.06 +0.39 +0.94 +1.08 +0.64]° (crossing … lobe)
      lap_3: "+0.04 -0.12 -0.60 -0.87 +0.09" # error vs the optimizer's curve per band, crossing first; 214/231/190/192/331 samples, correction now [+0.11 +0.47 +1.14 +1.33 +0.79]° (crossing … lobe)
      lap_4: "-0.25 -0.25 -0.52 -0.42 +0.41" # error vs the optimizer's curve per band, crossing first; 282/280/191/196/358 samples, correction now [+0.29 +0.62 +1.29 +1.37 +0.79]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: -0.47             # kite below the path's elevation centre [deg], over 1197 samples; the path itself sits -0.07 half-spans down there and the kite -0.19° under it
    az_20_40_pct: 0.81              # kite below the path's elevation centre [deg], over 1193 samples; the path itself sits 0.05 half-spans down there and the kite -0.64° under it
    az_40_60_pct: 1.96              # kite below the path's elevation centre [deg], over 912 samples; the path itself sits 0.07 half-spans down there and the kite -1.47° under it
    az_60_80_pct: 2.87              # kite below the path's elevation centre [deg], over 901 samples; the path itself sits 0.18 half-spans down there and the kite -1.67° under it
    az_80_100_pct: 1.78             # kite below the path's elevation centre [deg], over 1558 samples; the path itself sits 0.20 half-spans down there and the kite -0.50° under it
    centre_to_lobe_deg: 3.35        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 2.37             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [1.79, 2.12, 2.79, 2.87, 2.29] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 18.56     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 13.71  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 10.9            # lowest elevation over the whole run — set in phase 4, so a phase-5 lift does not move it [deg]
    el_min_final_deg: "n/a"         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 6.37     # reach margin: flew 19.36° against the 12.99° required by min_span_frac = 0.70, +49 %
    azimuth_reach_neg_deg: 6.56     # reach margin: flew 19.56° against the 12.99° required by min_span_frac = 0.70, +50 %
    elevation_span_deg: 5.64        # reach margin: flew 15.23° against the 9.60° required by min_span_frac = 0.70, +59 %
