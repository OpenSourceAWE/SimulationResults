    duration_s: 47.2                # phase-4 window length [s]
    mean_m_s: 33.11                 # mean apparent wind speed [m/s]
    min_m_s: 29.79                  # min apparent wind speed [m/s]
    max_m_s: 41.81                  # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: 22.6             # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 6.48               # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.5                # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.48               # crest factor: peak / mean reel-out power over the reeling window
    duration_s: 48.4                # reeling window length [s]
    n_samples: 4353                 # sample count in the reeling window
    energy_kJ: 1883.5               # energy over the reeling window [kJ]
    energy_run_kJ: 1879.1           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 4353                 # sample count in the reeling window
  ringing:
    n_peaks: 10                     # ring peaks detected above peak_floor
    period_s: 1.99                  # mean peak-to-peak ring period [s]
    zeta: 0.064                     # damping ratio from the peak log decrement
    overshoot_m_s: 1.4              # first ring peak's amplitude above the local trend [m/s]
    duration_s: 16.8                # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 6.45        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 4.75      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 39792              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 35699      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 35699              # 24% of the reeling window
      t_036.7_s: 39550              # 21% of the reeling window
      t_046.8_s: 41095              # 21% of the reeling window
      t_056.9_s: 41950              # 25% of the reeling window
      t_069.0_s: 42065              # 9% of the reeling window
    measured_W: 38942               # mean reel-out power the run harvested [W]
    ratio: 0.98                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.419              # optimizer's l_dp [m]; rel_depower equivalent 0.269 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_036.7_s: 1.415              # optimizer's l_dp [m]; rel_depower equivalent 0.268 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_046.8_s: 1.412              # optimizer's l_dp [m]; rel_depower equivalent 0.267 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_056.9_s: 1.411              # optimizer's l_dp [m]; rel_depower equivalent 0.267 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_056.9_s_2: 1.41             # optimizer's l_dp [m]; rel_depower equivalent 0.267 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_069.0_s: 1.415              # optimizer's l_dp [m]; rel_depower equivalent 0.268 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.6              # centre azimuth of the path [deg]
    az_amplitude_deg: 18.7          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 23.2             # centre elevation of the path [deg]
    el_height_deg: 13.6             # elevation span of the path, peak to peak [deg]
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.2       # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 13.53    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.36         # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    margin_start: 0.92              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.33                # curvature margin at reelout_l_max [-]
    c1_final: 0.1919                # turn-rate gain at depower_final [1/m]
    margin_final: 1.6               # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.61        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked_s: 37.7                 # wall time the simulation was frozen waiting for replies [s]
    installed: 4                    # new paths actually flown
    blend_retries: 1                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_036.7_s: "installed — margin 1.06 (phase 5: 1.37 at 380 m), clearance 45.1 m, 39550 W predicted" # at L = 203 m
      t_046.8_s: "installed — margin 1.03 (phase 5: 1.07 at 380 m), clearance 56.4 m, 41095 W predicted" # at L = 254 m
      t_056.9_s: "installed — margin 1.10 (phase 5: 0.95 at 380 m), clearance 66.4 m, 41950 W predicted" # at L = 305 m
      t_069.0_s: "installed — margin 0.85 (droop spread at 50 %, lobe lift at 0 %) (phase 5: 0.61 at 380 m), clearance 84.7 m, 42065 W predicted" # at L = 366 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 3.08                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [2.6, 2.89, 3.6, 3.75, 2.53] # the learnt correction per band, crossing first [deg]
    lift_deg: 1.5                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead_s: 8.0                # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t_s: 63.8                  # when the lift actually latched [s]
    lift_remaining_m: 40.3          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_040.7_s: "blended in"       # +0.44° of shift (mean over the bands), curvature margin 1.17 vs 0.82 required
      t_050.8_s: "blended in"       # +0.11° of shift (mean over the bands), curvature margin 1.08 vs 0.82 required
      t_060.9_s: "blended in"       # +0.13° of shift (mean over the bands), curvature margin 1.06 vs 0.82 required
      t_065.0_s: "blended in"       # +1.50° of shift (mean over the bands), curvature margin 1.11 vs 0.82 required
      t_069.0_s: "carried by an install (50 % of the spread)" # +0.00° of shift (mean over the bands), curvature margin 0.85 vs 0.82 required
      t_073.0_s: "held back"        # -0.00° of shift (mean over the bands), curvature margin 0.60 vs 0.82 required
    laps:
      lap_1: -0.83                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.83°, correction became [+0.38 +0.40 +0.48 +0.55 +0.38]° (crossing … lobe)
      lap_2: -0.21                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.65°, correction became [+0.28 +0.41 +0.69 +0.80 +0.59]° (crossing … lobe)
      lap_3: -0.22                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.76°, correction became [+0.23 +0.43 +0.87 +1.10 +0.77]° (crossing … lobe)
      lap_5: -0.82                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.49°, correction became [+0.94 +1.23 +2.08 +2.36 +1.47]° (crossing … lobe)
      lap_6: -1.27                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -2.83°, correction became [+2.60 +2.89 +3.60 +3.75 +2.53]° (crossing … lobe)
    lap_profiles:
      lap_1: "-0.76 -0.81 -0.97 -1.23 -0.63" # error vs the optimizer's curve per band, crossing first; 177/192/157/132/272 samples, correction now [+0.38 +0.40 +0.48 +0.55 +0.38]° (crossing … lobe)
      lap_2: "+0.24 +0.01 -0.47 -0.65 -0.25" # error vs the optimizer's curve per band, crossing first; 172/176/150/158/255 samples, correction now [+0.28 +0.41 +0.69 +0.80 +0.59]° (crossing … lobe)
      lap_3: "+0.16 -0.01 -0.46 -0.85 -0.11" # error vs the optimizer's curve per band, crossing first; 184/190/171/146/221 samples, correction now [+0.23 +0.43 +0.87 +1.10 +0.77]° (crossing … lobe)
      lap_5: "-0.69 -0.75 -1.32 -1.56 -0.36" # error vs the optimizer's curve per band, crossing first; 142/164/147/99/257 samples, correction now [+0.94 +1.23 +2.08 +2.36 +1.47]° (crossing … lobe)
      lap_6: "-1.65 -1.65 -1.64 -1.75 -0.61" # error vs the optimizer's curve per band, crossing first; 139/150/121/104/305 samples, correction now [+2.60 +2.89 +3.60 +3.75 +2.53]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 2.44              # kite below the path's elevation centre [deg], over 1086 samples; the path itself sits 0.36 half-spans down there and the kite -0.79° under it
    az_20_40_pct: 2.22              # kite below the path's elevation centre [deg], over 1159 samples; the path itself sits 0.27 half-spans down there and the kite -1.08° under it
    az_40_60_pct: 2.35              # kite below the path's elevation centre [deg], over 1000 samples; the path itself sits 0.18 half-spans down there and the kite -1.74° under it
    az_60_80_pct: 2.68              # kite below the path's elevation centre [deg], over 830 samples; the path itself sits 0.16 half-spans down there and the kite -2.13° under it
    az_80_100_pct: 1.76             # kite below the path's elevation centre [deg], over 1654 samples; the path itself sits 0.19 half-spans down there and the kite -1.18° under it
    centre_to_lobe_deg: 0.24        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 2.18             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [1.96, 2.06, 2.28, 2.39, 2.23] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 14.65     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 9.88   # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 8.2             # lowest elevation over the whole run — set in phase 4, so a phase-5 lift does not move it [deg]
    el_min_final_deg: 8.23          # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 5.41     # reach margin: flew 15.66° against the 10.25° required by min_span_frac = 0.70, +53 %
    azimuth_reach_neg_deg: 6.11     # reach margin: flew 16.37° against the 10.25° required by min_span_frac = 0.70, +60 %
    elevation_span_deg: 2.91        # reach margin: flew 9.83° against the 6.91° required by min_span_frac = 0.70, +42 %
    tightest: "elevation span"      # the size criterion with the least room, +2.91° (+42 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 42.3                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 43.8               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 9.5    # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 10.0            # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0558                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    f_min_N: 350.0                  # minimum winch force sent [N]
    f_max_N: 8000.0                 # maximum winch force sent [N]
performance:
