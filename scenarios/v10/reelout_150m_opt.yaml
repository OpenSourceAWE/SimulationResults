    az_center_deg: 0.5              # centre azimuth of the path [deg]
    az_amplitude_deg: 17.6          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 23.8             # centre elevation of the path [deg]
    el_height_deg: 11.9             # elevation span of the path, peak to peak [deg]
    downloops: true                 # traversal direction the optimizer solved for
