    rate_limited_peak_per_s: 0.177  # peak tape rate reached [1/s]
    rate_limit_per_s: 0.2           # KCU's configured rate limit [1/s]
reelout:
  v_app_phase4:
    duration_s: 71.4                # phase-4 window length [s]
    mean_m_s: 32.29                 # mean apparent wind speed [m/s]
    min_m_s: 29.78                  # min apparent wind speed [m/s]
    max_m_s: 34.26                  # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: 19.6             # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 5.51               # figure-eight laps completed by the time reel-out ended
  force:
    cf_force_ro: 1.18               # crest factor: peak / mean tether force over the reeling window
  power:
    cf_power_ro: 1.2                # crest factor: peak / mean reel-out power over the reeling window
    duration_s: 73.1                # reeling window length [s]
    n_samples: 6577                 # sample count in the reeling window
    energy_kJ: 1546.4               # energy over the reeling window [kJ]
    energy_run_kJ: 1543.3           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 6577                 # sample count in the reeling window
  ringing:
    n_peaks: 7                      # ring peaks detected above peak_floor
    period_s: 2.57                  # mean peak-to-peak ring period [s]
    zeta: 0.076                     # damping ratio from the peak log decrement
    overshoot_m_s: 0.57             # first ring peak's amplitude above the local trend [m/s]
    duration_s: 16.9                # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 3.56        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 3.18      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 25131              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 23181      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 23181              # 18% of the reeling window
      t_036.8_s: 25390              # 19% of the reeling window
      t_050.5_s: 25606              # 20% of the reeling window
      t_065.0_s: 25619              # 21% of the reeling window
      t_080.6_s: 25622              # 22% of the reeling window
    measured_W: 21161               # mean reel-out power the run harvested [W]
    ratio: 0.84                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.592              # optimizer's l_dp [m]; rel_depower equivalent 0.297 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_036.8_s: 1.578              # optimizer's l_dp [m]; rel_depower equivalent 0.295 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_050.5_s: 1.585              # optimizer's l_dp [m]; rel_depower equivalent 0.296 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_065.0_s: 1.582              # optimizer's l_dp [m]; rel_depower equivalent 0.295 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_080.6_s: 1.573              # optimizer's l_dp [m]; rel_depower equivalent 0.294 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
    k_v_optimized:
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: -0.2             # centre azimuth of the path [deg]
    az_amplitude_deg: 21.4          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 26.5             # centre elevation of the path [deg]
    el_height_deg: 15.1             # elevation span of the path, peak to peak [deg]
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.25      # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 13.83    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.495        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 0.0  # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    margin_start: 0.83              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.1                 # curvature margin at reelout_l_max [-]
    c1_final: 0.1919                # turn-rate gain at depower_final [1/m]
    margin_final: 1.41              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 1.13        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked_s: 16.1                 # wall time the simulation was frozen waiting for replies [s]
    installed: 4                    # new paths actually flown
    blend_retries: 0                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_036.8_s: "installed — margin 1.38 (phase 5: 1.92 at 380 m), clearance 48.3 m, 25390 W predicted" # at L = 190 m
      t_050.5_s: "installed — margin 1.57 (phase 5: 1.77 at 380 m), clearance 51.4 m, 25606 W predicted" # at L = 235 m
      t_065.0_s: "installed — margin 1.29 (phase 5: 1.20 at 380 m), clearance 66.2 m, 25619 W predicted" # at L = 282 m
      t_080.6_s: "installed — margin 1.43 (phase 5: 1.13 at 380 m), clearance 81.6 m, 25622 W predicted" # at L = 333 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 0.82                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [0.14, 0.51, 1.25, 1.36, 0.84] # the learnt correction per band, crossing first [deg]
    lift_deg: 1.5                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead_s: 8.0                # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t_s: 87.3                  # when the lift actually latched [s]
    lift_remaining_m: 25.3          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_040.8_s: "blended in"       # +0.58° of shift (mean over the bands), curvature margin 1.20 vs 0.82 required
      t_054.5_s: "blended in"       # +0.21° of shift (mean over the bands), curvature margin 1.35 vs 0.82 required
      t_069.0_s: "blended in"       # -0.04° of shift (mean over the bands), curvature margin 1.59 vs 0.82 required
      t_084.7_s: "blended in"       # +0.07° of shift (mean over the bands), curvature margin 1.29 vs 0.82 required
      t_088.7_s: "blended in"       # +1.50° of shift (mean over the bands), curvature margin 1.31 vs 0.82 required
    laps:
      lap_1: -1.07                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.07°, correction became [+0.53 +0.63 +0.71 +0.64 +0.38]° (crossing … lobe)
      lap_2: -0.4                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.96°, correction became [+0.35 +0.63 +1.09 +1.18 +0.71]° (crossing … lobe)
      lap_3: 0.13                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.64°, correction became [+0.03 +0.42 +1.14 +1.32 +0.83]° (crossing … lobe)
      lap_4: -0.09                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.79°, correction became [+0.14 +0.51 +1.25 +1.36 +0.84]° (crossing … lobe)
    lap_profiles:
      lap_1: "-1.02 -1.31 -1.47 -1.40 -0.58" # error vs the optimizer's curve per band, crossing first; 215/193/159/162/323 samples, correction now [+0.53 +0.63 +0.71 +0.64 +0.38]° (crossing … lobe)
      lap_2: "+0.49 -0.00 -0.91 -1.37 -0.34" # error vs the optimizer's curve per band, crossing first; 223/238/221/211/335 samples, correction now [+0.35 +0.63 +1.09 +1.18 +0.71]° (crossing … lobe)
      lap_3: "+0.80 +0.45 -0.31 -0.62 +0.13" # error vs the optimizer's curve per band, crossing first; 249/258/218/209/374 samples, correction now [+0.03 +0.42 +1.14 +1.32 +0.83]° (crossing … lobe)
      lap_4: "-0.07 -0.13 -0.48 -0.38 +0.34" # error vs the optimizer's curve per band, crossing first; 299/304/230/211/362 samples, correction now [+0.14 +0.51 +1.25 +1.36 +0.84]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 0.38              # kite below the path's elevation centre [deg], over 1537 samples; the path itself sits 0.03 half-spans down there and the kite -0.28° under it
    az_20_40_pct: 0.7               # kite below the path's elevation centre [deg], over 1552 samples; the path itself sits 0.00 half-spans down there and the kite -0.74° under it
    az_40_60_pct: 1.85              # kite below the path's elevation centre [deg], over 1210 samples; the path itself sits 0.04 half-spans down there and the kite -1.59° under it
    az_60_80_pct: 2.49              # kite below the path's elevation centre [deg], over 1191 samples; the path itself sits 0.11 half-spans down there and the kite -1.73° under it
    az_80_100_pct: 1.67             # kite below the path's elevation centre [deg], over 1991 samples; the path itself sits 0.17 half-spans down there and the kite -0.58° under it
    centre_to_lobe_deg: 2.11        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 2.32             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [1.64, 2.01, 2.75, 2.86, 2.34] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 20.13     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 13.05  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 10.9            # lowest elevation over the whole run — set in phase 4, so a phase-5 lift does not move it [deg]
    el_min_final_deg: 13.02         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 6.41     # reach margin: flew 20.50° against the 14.09° required by min_span_frac = 0.70, +45 %
    azimuth_reach_neg_deg: 6.36     # reach margin: flew 20.45° against the 14.09° required by min_span_frac = 0.70, +45 %
    elevation_span_deg: 4.55        # reach margin: flew 13.69° against the 9.13° required by min_span_frac = 0.70, +50 %
    tightest: "elevation span"      # the size criterion with the least room, +4.55° (+50 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 48.7                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 42.3               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 9.5    # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 10.0            # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.039                      # v_set = k_v * sqrt(force) sent to the optimizer [-]
    optimize_k_v: false             # k_v sent as a design variable; the reply's value is then the one flown
    k_v_flown: 0.039                # k_v the run actually flew; == k_v, the optimizer did not move it
    f_min_N: 700.0                  # minimum winch force sent [N]
    f_max_N: 8000.0                 # maximum winch force sent [N]
    force_limit: "soft"             # the reel-out law itself limits the force, inverting the optimizer's own saturating tension curve (beta 1e-03/1e-03, force filtered at tau = 2.48 s); the UpperForceController is held in reset, so upper_force_pct is 0 by construction
