    peak_N: 11935                   # peak tether force over the reeling window [N]
    cf_force_ro: 1.48               # crest factor: peak_N / mean_N
  power:
    mean_W: 37642                   # mean reel-out power over the reeling window [W]
    peak_W: 54223                   # peak reel-out power over the reeling window [W]
    cf_power_ro: 1.44               # crest factor: peak_W / mean_W
    duration_s: 48.9                # reeling window length [s]
    n_samples: 4404                 # sample count in the reeling window
    energy_kJ: 1842.0               # energy over the reeling window [kJ]
    energy_run_kJ: 1837.8           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 4404                 # sample count in the reeling window
  ringing:
    n_peaks: 10                     # ring peaks detected above peak_floor
    period_s: 2.02                  # mean peak-to-peak ring period [s]
    zeta: 0.069                     # damping ratio from the peak log decrement
    overshoot_m_s: 1.41             # first ring peak's amplitude above the local trend [m/s]
    duration_s: 18.2                # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 6.34        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 4.71      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 38851              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 35660      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 35660              # 47% of the reeling window
      t_048.7_s: 41139              # 22% of the reeling window
      t_059.2_s: 42025              # 25% of the reeling window
      t_071.3_s: 41706              # 7% of the reeling window
    measured_W: 37642               # mean reel-out power the run harvested [W]
    ratio: 0.97                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 29.0             # centre elevation of the guess [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.421              # optimizer's l_dp [m]; rel_depower equivalent 0.271 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_036.9_s: 1.413              # optimizer's l_dp [m]; rel_depower equivalent 0.270 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_048.7_s: 1.41               # optimizer's l_dp [m]; rel_depower equivalent 0.269 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_048.7_s_2: 1.412            # optimizer's l_dp [m]; rel_depower equivalent 0.269 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_059.2_s: 1.409              # optimizer's l_dp [m]; rel_depower equivalent 0.269 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_071.3_s: 1.42               # optimizer's l_dp [m]; rel_depower equivalent 0.271 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.5              # centre azimuth of the path [deg]
    az_amplitude_deg: 17.6          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 23.8             # centre elevation of the path [deg]
    el_height_deg: 11.9             # elevation span of the path, peak to peak [deg]
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.2       # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 13.51    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.341        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 30.0 # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    margin_start: 0.9               # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.27                # curvature margin at reelout_l_max [-]
    c1_final: 0.1919                # turn-rate gain at depower_final [1/m]
    margin_final: 1.56              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.6         # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 4                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked_s: 38.7                 # wall time the simulation was frozen waiting for replies [s]
    installed: 3                    # new paths actually flown
    blend_retries: 1                # cold-restart attempts spent on a rejected reply — a folded blend, a collapsed prediction, or a clearance/elevation shortfall re-asked at a raised floor — across every install this run
    events:
      t_036.9_s: "rejected — curvature margin 0.77 (the optimizer measured 14.51 m at r = 200-309 m, asked for >= 14.51 m)" # at L = 200 m
      t_048.7_s: "installed — margin 1.06 (phase 5: 1.08 at 380 m), clearance 56.7 m, 41139 W predicted" # at L = 258 m
      t_059.2_s: "installed — margin 0.83 (droop spread at 100 %, lobe lift at 75 %) (phase 5: 0.70 at 380 m), clearance 68.5 m, 42025 W predicted" # at L = 311 m
      t_071.3_s: "installed — margin 0.85 (droop spread at 25 %, lobe lift at 0 %) (phase 5: 0.60 at 380 m), clearance 84.4 m, 41706 W predicted" # at L = 371 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 3.17                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [2.53, 2.86, 3.7, 3.99, 2.76] # the learnt correction per band, crossing first [deg]
    lift_deg: 1.5                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead_s: 8.0                # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t_s: 65.1                  # when the lift actually latched [s]
    lift_remaining_m: 39.9          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_036.9_s: "blended in"       # +0.47° of shift (mean over the bands), curvature margin 1.11 vs 0.82 required
      t_052.7_s: "blended in"       # +0.28° of shift (mean over the bands), curvature margin 0.89 vs 0.82 required
      t_063.2_s: "blended in"       # -0.25° of shift (mean over the bands), curvature margin 1.15 vs 0.82 required
      t_067.3_s: "blended in"       # +1.50° of shift (mean over the bands), curvature margin 1.23 vs 0.82 required
      t_071.3_s: "carried by an install (25 % of the spread)" # -0.00° of shift (mean over the bands), curvature margin 0.85 vs 0.82 required
    laps:
      lap_1: -0.89                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.89°, correction became [+0.47 +0.47 +0.53 +0.56 +0.35]° (crossing … lobe)
      lap_2: -0.49                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.95°, correction became [+0.30 +0.53 +0.97 +1.21 +0.76]° (crossing … lobe)
      lap_3: 0.49                   # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.26°, correction became [+0.04 +0.25 +0.63 +0.91 +0.70]° (crossing … lobe)
      lap_5: -1.26                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.78°, correction became [+1.27 +1.55 +2.37 +2.63 +1.68]° (crossing … lobe)
      lap_6: -1.12                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -2.96°, correction became [+2.53 +2.86 +3.70 +3.99 +2.76]° (crossing … lobe)
    lap_profiles:
      lap_1: "-0.95 -0.94 -1.07 -1.24 -0.55" # error vs the optimizer's curve per band, crossing first; 167/169/145/133/261 samples, correction now [+0.47 +0.47 +0.53 +0.56 +0.35]° (crossing … lobe)
      lap_2: "+0.43 -0.14 -0.96 -1.65 -0.48" # error vs the optimizer's curve per band, crossing first; 205/224/182/161/286 samples, correction now [+0.30 +0.53 +0.97 +1.21 +0.76]° (crossing … lobe)
      lap_3: "+0.61 +0.59 +0.63 +0.37 +0.30" # error vs the optimizer's curve per band, crossing first; 182/183/175/153/256 samples, correction now [+0.04 +0.25 +0.63 +0.91 +0.70]° (crossing … lobe)
      lap_5: "-1.22 -1.25 -1.84 -2.03 -0.62" # error vs the optimizer's curve per band, crossing first; 137/151/150/112/264 samples, correction now [+1.27 +1.55 +2.37 +2.63 +1.68]° (crossing … lobe)
      lap_6: "-1.23 -1.30 -1.45 -1.75 -0.62" # error vs the optimizer's curve per band, crossing first; 135/140/131/116/308 samples, correction now [+2.53 +2.86 +3.70 +3.99 +2.76]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 2.73              # kite below the path's elevation centre [deg], over 1021 samples; the path itself sits 0.43 half-spans down there and the kite -0.63° under it
    az_20_40_pct: 2.42              # kite below the path's elevation centre [deg], over 1078 samples; the path itself sits 0.33 half-spans down there and the kite -0.94° under it
    az_40_60_pct: 2.5               # kite below the path's elevation centre [deg], over 1011 samples; the path itself sits 0.21 half-spans down there and the kite -1.71° under it
    az_60_80_pct: 3.22              # kite below the path's elevation centre [deg], over 851 samples; the path itself sits 0.25 half-spans down there and the kite -2.27° under it
    az_80_100_pct: 1.95             # kite below the path's elevation centre [deg], over 1690 samples; the path itself sits 0.20 half-spans down there and the kite -1.22° under it
    centre_to_lobe_deg: 0.49        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 2.0              # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [1.89, 1.94, 2.04, 2.1, 2.05] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 14.58     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 9.53   # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 7.8             # lowest elevation over the whole run — set in phase 4, so a phase-5 lift does not move it [deg]
    el_min_final_deg: 7.75          # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 5.7      # reach margin: flew 15.90° against the 10.21° required by min_span_frac = 0.70, +56 %
    azimuth_reach_neg_deg: 6.14     # reach margin: flew 16.34° against the 10.21° required by min_span_frac = 0.70, +60 %
    elevation_span_deg: 3.04        # reach margin: flew 9.72° against the 6.67° required by min_span_frac = 0.70, +46 %
    tightest: "elevation span"      # the size criterion with the least room, +3.04° (+46 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 46.1                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 46.9               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
    elevation_min_asked_deg: 9.5    # elevation floor the LAST request carried, the higher of asind(min_height/L) and min_elevation + candidate_elevation_margin at the length it was made for; the optimizer constrains HEIGHT, and only at the far end of the lap's reel-out [deg]
    elevation_min_extra_deg: 0.0    # raise a rejected reply's shortfall added to that floor, carried forward once measured; 0 means no reply was gated out low [deg]
  inflow:
    wind_speed_m_s: 10.0            # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0558                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    f_min_N: 350.0                  # minimum winch force sent [N]
    f_max_N: 8000.0                 # maximum winch force sent [N]
performance:
  sim_time_s: 90.0                  # simulated time [s]
  wall_time_s: 87.8                 # wall-clock time [s]
  total_wall_time_s: 100.9          # the whole script: package loading, init, settling, the startup solve and the run, up to this summary — the archive copy and any plots follow it [s]
  optimization_time_s: 46.9         # wall time waiting for the optimizer: the startup solve (8.2 s) plus every blocking re-optimization (traj_opt.reopt.blocked_s) [s]
  realtime_factor: 1.83             # sim_time / wall_time, excluding time frozen for re-optimization
  ms_per_step: 6.1                  # wall time per step, excluding time frozen for re-optimization [ms]
  steps: 8100                       # step count
  dt_s: 0.011111111111111112        # simulation timestep [s]
  vsm_interval: 10                  # VSM aerodynamic update interval [steps]
summary:
  date: "2026-08-22"                # wall-clock date the run finished
  time: "20:42:15"                  # wall-clock time the run finished
  wind_speed_m_s: 10.0              # wind speed at 6 m sent to the optimizer [m/s]
  mean_power_W: 37642               # mean reel-out power the run harvested [W]
  power_ratio: 0.97                 # measured / predicted mean reel-out power, against the weighted prediction
  total_wall_time_s: 100.9          # the whole script, start to this summary [s]
