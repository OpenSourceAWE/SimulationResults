    duration_s: 50.6                # phase-4 window length [s]
    mean_m_s: 33.53                 # mean apparent wind speed [m/s]
    min_m_s: 30.88                  # min apparent wind speed [m/s]
    max_m_s: 38.71                  # max apparent wind speed [m/s]
    v_app_ref_m_s: 27.0             # reference apparent wind speed [m/s]
    deviation_pct: 24.2             # mean v_app deviation from v_app_ref [%]
  tether:
    start_m: 150.0                  # tether length at run start [m]
    end_m: 380.0                    # tether length at run end [m]
    target_m: 380.0                 # reelout_l_max target [m]
    stop_reason: "length"           # criterion that ended reel-out: length, laps, or none
    laps_reeled: 5.12               # figure-eight laps completed by the time reel-out ended
  force:
    mean_N: 7940                    # mean tether force over the reeling window [N]
    peak_N: 12310                   # peak tether force over the reeling window [N]
    cf_force_ro: 1.55               # crest factor: peak_N / mean_N
  power:
    mean_W: 35017                   # mean reel-out power over the reeling window [W]
    peak_W: 53778                   # peak reel-out power over the reeling window [W]
    cf_power_ro: 1.54               # crest factor: peak_W / mean_W
    duration_s: 51.9                # reeling window length [s]
    n_samples: 4670                 # sample count in the reeling window
    energy_kJ: 1817.0               # energy over the reeling window [kJ]
    energy_run_kJ: 1823.4           # energy over the whole run [kJ]
  winch_state:
    speed_pct: 100.0                # % of the reeling window in speed control (state 1)
    lower_force_pct: 0.0            # % in the LowerForceController, reeling in (state 0)
    upper_force_pct: 0.0            # % in the UpperForceController, force capped at f_high (state 2)
    n_samples: 4670                 # sample count in the reeling window
  ringing:
    n_peaks: 8                      # ring peaks detected above peak_floor
    period_s: 2.27                  # mean peak-to-peak ring period [s]
    zeta: 0.079                     # damping ratio from the peak log decrement
    overshoot_m_s: 1.39             # first ring peak's amplitude above the local trend [m/s]
    duration_s: 14.1                # time until the ring decays below settle_frac of overshoot_m_s [s]
    peak_v_reelout_m_s: 5.99        # raw v_reelout max within ring_span [m/s]
    steady_v_reelout_m_s: 4.52      # mean v_reelout after ring_span [m/s]
traj_opt:
  power:
    predicted_W: 40422              # predicted mean reel-out power of the paths actually flown, weighted by their share of the reeling window [W]
    predicted_initial_W: 36534      # predicted mean reel-out power of the path installed before the run [W]
    predicted_paths:
      t_000.0_s: 36534              # 21% of the reeling window
      t_037.1_s: 39856              # 19% of the reeling window
      t_047.2_s: 41273              # 19% of the reeling window
      t_057.3_s: 42116              # 20% of the reeling window
      t_067.7_s: 42661              # 20% of the reeling window
    measured_W: 35017               # mean reel-out power the run harvested [W]
    ratio: 0.87                     # measured / predicted, against the weighted prediction
  guess:
    a_deg: 30.0                     # width of the guess lemniscate; azimuth spans ±a [deg]
    b_deg: 12.0                     # height of the guess, peak to peak [deg]
    el_center_deg: 30.0             # centre elevation of the guess [deg]
    points: 361                     # points the guess was sent with
    depower_seed_m: 1.85            # power-tape length the solve started from, input_depower ramped with the wind above input_depower_wind_ref; only a seed, the server optimizes it [m]
    depower_optimized:
      t_000.0_s: 1.42               # optimizer's l_dp [m]; rel_depower equivalent 0.284 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_037.1_s: 1.415              # optimizer's l_dp [m]; rel_depower equivalent 0.283 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_047.2_s: 1.412              # optimizer's l_dp [m]; rel_depower equivalent 0.282 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_057.3_s: 1.41               # optimizer's l_dp [m]; rel_depower equivalent 0.282 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
      t_067.7_s: 1.408              # optimizer's l_dp [m]; rel_depower equivalent 0.282 (awetrim_depower_to_v3kite), against the flown depower_setpoint = 0.274
  path:
    points: 360                     # points of the path installed before the run
    points_final: 360               # points of the path at the end; differs when reopt installed one
    az_center_deg: 0.3              # centre azimuth of the path [deg]
    az_amplitude_deg: 19.0          # half-width of the STARTUP path; the criteria are scored against the pattern commanded at each lap, whose mean is lift_budget's reference [deg]
    el_center_deg: 23.3             # centre elevation of the path [deg]
    el_height_deg: 12.9             # elevation span of the path, peak to peak [deg]
    downloops: true                 # traversal direction the optimizer solved for
  feasibility:
    min_required: 0.82              # min_feasibility_margin of data/traj_opt.yaml [-]
    turn_radius_headroom: 1.2       # factor on the gate's number for what the GATE adds: its finite-difference curvature estimate and the elevation lift [-]
    turn_radius_request_m: 17.34    # minimum turn radius asked of the optimizer for the LAST request; the gate's margin/(c1*max_steering) times the headroom and the lap's reel-out ratio, since the optimizer measures the radius up the reel-out while the run flies the curve at the anchor [m]
    turn_radius_scale: 1.443        # the two corrections together, as sent [-]
    turn_radius_lap_reelout_m: 30.0 # reel-out per lap ASSUMED for the startup request, the only one with no reply to measure it off [m]
    margin_start: 0.99              # curvature margin at the starting length; the worst case only when one path is flown throughout — see the docstring [-]
    margin_end: 2.5                 # curvature margin at reelout_l_max [-]
    c1_final: 0.2133                # turn-rate gain at depower_final [1/m]
    margin_final: 1.89              # curvature margin phase 5 flies with: depower_final's c1, at reelout_l_max, on the STARTING path lifted by el_offset_final [-]
    margin_final_flown: 0.78        # the same, for the last path the re-optimizer installed — the one phase 5 actually inherited [-]
  reopt:
    enabled: true                   # re-optimization during the run
    warm_start: true                # /step alone, seeded from the previous optimum; false re-inits from the parametric guess at every length
    requests: 5                     # solves that completed, accepted or rejected
    blocking: true                  # simulation held while a solve ran
    blocked_s: 203.8                # wall time the simulation was frozen waiting for replies [s]
    installed: 4                    # new paths actually flown
    blend_retries: 0                # cold-restart attempts spent on a reply whose blend folded or predicted collapsed power (`blend_folds`/`min_power_frac`), across every install this run
    events:
      t_037.1_s: "installed — margin 1.06 (phase 5: 1.59 at 380 m), clearance 45.7 m, 39856 W predicted" # at L = 196 m
      t_047.2_s: "installed — margin 0.92 (phase 5: 1.12 at 380 m), clearance 54.8 m, 41273 W predicted" # at L = 242 m
      t_057.3_s: "installed — margin 0.89 (phase 5: 0.91 at 380 m), clearance 63.4 m, 42116 W predicted" # at L = 287 m
      t_067.7_s: "installed — margin 0.89 (droop spread at 100 %, lobe lift at 25 %) (phase 5: 0.78 at 380 m), clearance 69.1 m, 42661 W predicted" # at L = 334 m
      t_078.4_s: "failed"           # at L = 382 m
  el_bias:
    gain: 0.5                       # per-lap learning gain for the elevation bias; 0 = off
    final_deg: 0.99                 # mean elevation correction added to the last installed path [deg]
    bins: 5                         # el_bias_bins, azimuth bands the correction is learnt over; 1 = one rigid shift
    smooth: 0.25                    # el_bias_smooth, how far each band is pulled towards its neighbours after every lap [-]
    profile_deg: [0.45, 0.71, 1.23, 1.51, 1.03] # the learnt correction per band, crossing first [deg]
    lift_deg: 1.5                   # el_offset_final, the fixed lift added on top of the learnt bias [deg]
    lift_lead_s: 8.0                # el_offset_lead, how early the lift is allowed to latch; 0 = at the end [s]
    wing_deg: 1.5                   # el_offset_wing, extra lift at the lobes, baked into every installed path [deg]
    wing_mode: "azimuth"            # el_offset_wing_mode, the coordinate that lift is shaped over
    wing_az_deg: 10.0               # azimuth mode: azimuth beyond which that lift is full; it ramps over el_offset_wing_blend below it [deg]
    wing_depth: 0.0                 # elevation mode: depth below the path's elevation centre where the lift starts, in half-spans; full at its lowest point [-]
    lift_t_s: 69.8                  # when the lift actually latched [s]
    lift_remaining_m: 36.2          # reel-out left at that moment; > 0 means the lead fired, 0 means phase 5 did [m]
    shift_delivery:
      t_041.1_s: "blended in"       # +0.56° of shift (mean over the bands), curvature margin 1.08 vs 0.82 required
      t_051.2_s: "blended in"       # +0.23° of shift (mean over the bands), curvature margin 0.88 vs 0.82 required
      t_061.3_s: "blended in"       # +0.13° of shift (mean over the bands), curvature margin 0.93 vs 0.82 required
      t_071.7_s: "blended in"       # +1.56° of shift (mean over the bands), curvature margin 0.85 vs 0.82 required
    laps:
      lap_1: -1.04                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -1.04°, correction became [+0.58 +0.59 +0.61 +0.62 +0.39]° (crossing … lobe)
      lap_2: -0.45                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.99°, correction became [+0.48 +0.65 +0.94 +1.11 +0.77]° (crossing … lobe)
      lap_3: -0.22                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.99°, correction became [+0.49 +0.73 +1.13 +1.34 +0.92]° (crossing … lobe)
      lap_4: -0.06                  # mean elevation error vs the OPTIMIZER's curve; sag under the flown path -0.96°, correction became [+0.45 +0.71 +1.23 +1.51 +1.03]° (crossing … lobe)
    lap_profiles:
      lap_1: "-1.17 -1.21 -1.21 -1.38 -0.61" # error vs the optimizer's curve per band, crossing first; 166/175/144/137/272 samples, correction now [+0.58 +0.59 +0.61 +0.62 +0.39]° (crossing … lobe)
      lap_2: "+0.26 -0.13 -0.72 -1.24 -0.49" # error vs the optimizer's curve per band, crossing first; 164/170/149/149/273 samples, correction now [+0.48 +0.65 +0.94 +1.11 +0.77]° (crossing … lobe)
      lap_3: "+0.07 -0.17 -0.45 -0.78 +0.01" # error vs the optimizer's curve per band, crossing first; 176/185/167/138/243 samples, correction now [+0.49 +0.73 +1.13 +1.34 +0.92]° (crossing … lobe)
      lap_4: "+0.18 +0.04 -0.31 -0.72 +0.16" # error vs the optimizer's curve per band, crossing first; 186/200/178/123/250 samples, correction now [+0.45 +0.71 +1.23 +1.51 +1.03]° (crossing … lobe)
  droop_profile:
    az_00_20_pct: 2.26              # kite below the path's elevation centre [deg], over 895 samples; the path itself sits 0.35 half-spans down there and the kite -0.58° under it
    az_20_40_pct: 2.16              # kite below the path's elevation centre [deg], over 942 samples; the path itself sits 0.28 half-spans down there and the kite -0.91° under it
    az_40_60_pct: 1.92              # kite below the path's elevation centre [deg], over 844 samples; the path itself sits 0.10 half-spans down there and the kite -1.46° under it
    az_60_80_pct: 2.76              # kite below the path's elevation centre [deg], over 716 samples; the path itself sits 0.19 half-spans down there and the kite -1.92° under it
    az_80_100_pct: 1.66             # kite below the path's elevation centre [deg], over 1348 samples; the path itself sits 0.21 half-spans down there and the kite -0.79° under it
    centre_to_lobe_deg: 0.51        # how much deeper the kite flies in its worst azimuth band than in the crossing — what a SHAPED lift is aimed at, where el_bias and el_offset_final can only move the pattern rigidly [deg]
  lift_budget:
    delivered_deg: 2.49             # mean correction the path in the air actually carries — el_bias plus el_offset_final once it has been delivered [deg]
    delivered_profile_deg: [1.95, 2.21, 2.73, 3.01, 2.53] # the same, per azimuth band, crossing first [deg]
    commanded_az_amp_deg: 16.28     # mean half-width the run was COMMANDED to fly, against the startup path's in traj_opt.path [deg]
    commanded_el_height_deg: 10.34  # mean commanded pattern height [deg]
    wing_deg: 1.5                   # el_offset_wing, the fixed lobe lift baked into every installed path [deg]
    el_min_run_deg: 10.4            # lowest elevation over the whole run — set in phase 4, so a phase-5 lift does not move it [deg]
    el_min_final_deg: 10.45         # lowest elevation in phase 5, which is what el_offset_final buys [deg]
    azimuth_reach_pos_deg: 5.18     # reach margin: flew 16.57° against the 11.40° required by min_span_frac = 0.70, +45 %
    azimuth_reach_neg_deg: 5.87     # reach margin: flew 17.26° against the 11.40° required by min_span_frac = 0.70, +51 %
    elevation_span_deg: 3.28        # reach margin: flew 10.52° against the 7.24° required by min_span_frac = 0.70, +45 %
    tightest: "elevation span"      # the size criterion with the least room, +3.28° (+45 %) — what the NEXT lift has to spend
  clearance:
    path_min_m: 43.5                # lowest point of the PRE-FLIGHT path at the starting length [m]
    flown_min_m: 44.1               # lowest point the kite actually reached over the run [m]
    min_required_m: 40.0            # min_height of data/traj_opt.yaml [m]
  inflow:
    wind_speed_m_s: 10.0            # wind speed at 6 m sent to the optimizer [m/s]
    wind_direction_deg: 270.0       # direction the wind comes from [deg]
    profile_law: 3                  # 0=CONST, 1=EXP, 2=LOG, 3=EXPLOG, 4-6=CUSTOM_*
  winch:
    k_v: 0.0508                     # v_set = k_v * sqrt(force) sent to the optimizer [-]
    f_min_N: 350.0                  # minimum winch force sent [N]
    f_max_N: 8000.0                 # maximum winch force sent [N]
performance:
  sim_time_s: 79.9                  # simulated time [s]
  wall_time_s: 245.9                # wall-clock time [s]
  total_wall_time_s: 271.9          # the whole script: package loading, init, settling, the startup solve and the run, up to this summary — the archive copy and any plots follow it [s]
  optimization_time_s: 224.1        # wall time waiting for the optimizer: the startup solve (20.3 s) plus every blocking re-optimization (traj_opt.reopt.blocked_s) [s]
  realtime_factor: 1.9              # sim_time / wall_time, excluding time frozen for re-optimization
  ms_per_step: 5.9                  # wall time per step, excluding time frozen for re-optimization [ms]
  steps: 7191                       # step count
  dt_s: 0.011111111111111112        # simulation timestep [s]
  vsm_interval: 10                  # VSM aerodynamic update interval [steps]
