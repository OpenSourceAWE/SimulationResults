    pct_time_within_2pct_of_peak: 4 # % of time within 2% of peak (saturation)
    hf_std_steering: 0.0074         # high-frequency std of steering (chatter)
    hf_std_turnrate_deg_s: 1.17     # high-frequency std of heading rate [deg/s]
